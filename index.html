        <button data-upgrade="${def.key}" ${maxed || save.ku < cost ? 'disabled' : ''}>${maxed?'MAX':format(cost)+' KU'}</button>
      </div>`;
    }).join('') + `<div class="quote">실패해도 KU는 남습니다. 자존심은 모르겠습니다.</div>`;
    el.panelBody.querySelectorAll('[data-upgrade]').forEach(btn => btn.addEventListener('click', () => upgradeBuy(btn.dataset.upgrade)));
  }

  function renderArtifactPanel(){
    if(!artifactUnlocked()){
      el.panelBody.innerHTML = `
        <h3 class="sectionTitle"><span>성물</span><span class="pill warn">3-1 해금</span></h3>
        <div class="box mini">성물은 3-1부터 열립니다. 2-5를 클리어하면 출격 전 장착형 성물을 구매할 수 있습니다.</div>
      `;
      return;
    }
    el.panelBody.innerHTML = `
      <h3 class="sectionTitle"><span>성물</span><span>DS ${format(save.ds || 0)} · ${save.artifacts.equipped.length}/${currentArtifactSlots()} 장착</span></h3>
      <div class="box mini">출격 전에 장착하는 특수 능력입니다. 성물 구매에는 DS를 사용합니다. 등급은 일반(흰색), 희귀(초록), 영웅(파랑), 에픽(보라), 전설(금색), 자쿠드(빨강)입니다. 시작 무기 계열은 최대 3개, 부활/경제 핵심 계열은 중복 제한이 있습니다.</div>
      ${artifactDefs.map(def => {
        const owned = isOwned(def.id);
        const equipped = isEquipped(def.id);
        const cost = artifactCost(def);
        const gClass = gradeClass(def.grade);
        return `<div class="artifactRow ${gClass}">
          <div>
            <h4>${def.name} <span class="pill grade ${gClass}">${def.grade}</span> ${equipped?'<span class="pill ok">장착 중</span>':''}</h4>
            <p>${def.desc}</p>
          </div>
          <div style="display:grid;gap:6px">
            ${owned ? `<button data-equip="${def.id}">${equipped?'해제':'장착'}</button>` : `<button data-buy-artifact="${def.id}" ${(save.ds || 0) < cost ? 'disabled' : ''}>${format(cost)} DS</button>`}
          </div>
        </div>`;
      }).join('')}
    `;
    el.panelBody.querySelectorAll('[data-buy-artifact]').forEach(btn => btn.addEventListener('click', () => buyArtifact(btn.dataset.buyArtifact)));
    el.panelBody.querySelectorAll('[data-equip]').forEach(btn => btn.addEventListener('click', () => toggleArtifact(btn.dataset.equip)));
  }

  function renderSkillPanel(){
    if(!skillTreeUnlocked()){
      el.panelBody.innerHTML = `
        <h3 class="sectionTitle"><span>특성</span><span class="pill warn">2-1 해금</span></h3>
        <div class="box mini">특성은 2-1부터 열립니다. 1-5를 클리어하면 노재능 각성이 가능해집니다.</div>
      `;
      return;
    }
    const nodeMap = Object.fromEntries(skillNodes.map(n => [n.id,n]));
    const lines = skillEdges.map(([a,b]) => {
      const n1 = nodeMap[a], n2 = nodeMap[b];
      const unlocked = skillUnlocked(a) && skillUnlocked(b);
      const available = skillUnlocked(a) && nodeAvailable(n2);
      const color = unlocked ? '#70ff9a' : available ? '#ffe66d' : 'rgba(139,164,200,.24)';
      return `<line x1="${n1.x}%" y1="${n1.y}%" x2="${n2.x}%" y2="${n2.y}%" stroke="${color}" stroke-width="2" />`;
    }).join('');
    const nodes = skillNodes.map(n => {
      const unlocked = skillUnlocked(n.id);
      const available = nodeAvailable(n);
      const cls = unlocked ? 'unlocked' : available ? 'available' : 'locked';
      const extra = `${n.core?' core':''}${n.breakNode?' break':''}`;
      return `<div class="skillNode ${cls}${extra}" data-skill="${n.id}" style="left:${n.x}%;top:${n.y}%">
        <div class="nodeName">${escapeHtml(n.name)}</div>
        <div class="nodeDesc">${escapeHtml(n.desc)}</div>
        <div class="nodeCost">${skillCostText(n)}</div>
      </div>`;
    }).join('');
    const breakReady = save.highestClearedRank >= stageRank(3,5);
    el.panelBody.innerHTML = `
      <h3 class="sectionTitle"><span>특성</span><span>KU ${format(save.ku)} · DS ${format(save.ds || 0)}</span></h3>
      <div class="box mini">노드를 클릭하면 습득합니다. 설명은 노드 안에 항상 표시됩니다. 레벨 돌파는 3-5 클리어와 주요 분파 2개 이상 선행이 필요합니다.</div>
      <div class="skillTreeWrap"><svg>${lines}</svg>${nodes}</div>
      <div class="box" id="skillInfo">
        <div class="statLine"><span>레벨 돌파 조건</span><b>${breakReady?'3-5 클리어 완료':'3-5 클리어 필요'}</b></div>
        <div class="statLine"><span>레벨 돌파 상태</span><b>${save.skillTree.levelBreakthrough?'해금됨':'미해금'}</b></div>
      </div>`;
    el.panelBody.querySelectorAll('[data-skill]').forEach(nodeEl => {
      const id = nodeEl.dataset.skill;
      nodeEl.addEventListener('click', () => {
        const n = getNode(id);
        if(skillUnlocked(id)) { setMessage(`${n.name.replace(/\n/g,' ')}: 이미 습득했습니다.`, 'ok'); return; }
        if(!nodeAvailable(n)) { setMessage(`${n.name.replace(/\n/g,' ')} 조건 부족. ${n.desc}`, 'warn'); return; }
        buySkill(id);
      });
    });
  }

  function renderRecordPanel(){
    const s = save.stats;
    el.panelBody.innerHTML = `
      <h3 class="sectionTitle">기록</h3>
      <div class="box">
        <div class="statLine"><span>출격 횟수</span><b>${format(s.runs)}</b></div>
        <div class="statLine"><span>사망 횟수</span><b>${format(s.deaths)}</b></div>
        <div class="statLine"><span>클리어 횟수</span><b>${format(s.clears)}</b></div>
        <div class="statLine"><span>파괴 타일</span><b>${format(s.tilesDestroyed)}</b></div>
        <div class="statLine"><span>보스 처치</span><b>${format(s.bossKills)}</b></div>
        <div class="statLine"><span>최대 런 KU</span><b>${format(s.highestKuInRun)}</b></div>
        <div class="statLine"><span>누적 KU 획득</span><b>${format(s.totalKuEarned)}</b></div>
        <div class="statLine"><span>누적 JA 획득</span><b>${format(s.totalJaEarned || 0)}</b></div>
        <div class="statLine"><span>누적 DS 획득</span><b>${format(s.totalDsEarned || 0)}</b></div>
        <div class="statLine"><span>무한 최고 구간</span><b>${format(save.infiniteBestDepth || 0)}</b></div>
        <div class="statLine"><span>뽑기 횟수</span><b>${format(s.gachaPulls || 0)}</b></div>
        <div class="statLine"><span>폭탄 사용</span><b>${format(s.bombsUsed || 0)}</b></div>
      </div>
      <div class="grid2">
        <button id="exportSave">저장 데이터 내보내기</button>
        <button id="resetSave" class="dangerBtn">저장 초기화</button>
      </div>
      <div class="box mini" id="exportBox" style="display:none;white-space:pre-wrap;word-break:break-all"></div>
    `;
    document.getElementById('exportSave').addEventListener('click', () => {
      const box = document.getElementById('exportBox');
      box.style.display = 'block';
      box.textContent = JSON.stringify(save, null, 2);
    });
    document.getElementById('resetSave').addEventListener('click', () => {
      if(confirm('정말 저장 데이터를 초기화할까요?')){
        save = defaultSave();
        saveGame('초기화 저장됨');
        setMessage('저장 데이터 초기화 완료.', 'warn');
        uiDirty = true;
        renderTabs(); renderPanel(true);
      }
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
  }

  function setPointer(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * canvas.width / rect.width;
    const y = (clientY - rect.top) * canvas.height / rect.height;
    game.player.targetX = clamp(x, 18, W-18);
    game.player.targetY = clamp(y, H*0.44, H-24);
  }

  canvas.addEventListener('mousemove', e => { if(game.running && !game.powerupOpen) setPointer(e.clientX,e.clientY); });
  canvas.addEventListener('mousedown', e => {
    game.inputActive = true;
    if(game.running && !game.powerupOpen){
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * canvas.width / rect.width;
      const y = (e.clientY - rect.top) * canvas.height / rect.height;
      const b = bombButtonRect();
      if(bombUnlocked() && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ useBomb(); e.preventDefault(); return; }
      setPointer(e.clientX,e.clientY);
    }
  });
  window.addEventListener('mouseup', () => game.inputActive = false);
  canvas.addEventListener('touchstart', e => { if(e.touches[0] && game.running && !game.powerupOpen){
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches[0].clientX - rect.left) * canvas.width / rect.width;
    const y = (e.touches[0].clientY - rect.top) * canvas.height / rect.height;
    const b = bombButtonRect();
    if(bombUnlocked() && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ useBomb(); e.preventDefault(); return; }
    setPointer(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); } }, {passive:false});
  canvas.addEventListener('touchmove', e => { if(e.touches[0] && game.running && !game.powerupOpen){ setPointer(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); } }, {passive:false});

  document.addEventListener('keydown', e => {
    if((e.key === 'b' || e.key === 'B' || e.key === 'ㅠ') && !game.powerupOpen){ useBomb(); return; }
    if(e.key >= '1' && e.key <= '3' && game.powerupOpen){ choosePowerup(Number(e.key)-1); return; }
    if(e.code === 'Space'){
      e.preventDefault();
      if(game.powerupOpen) choosePowerup(0);
      else if(!game.running) startRun();
    }
    if(e.key === 'Escape') togglePause();
  });

  function loop(ts){
    if(!game.lastTime) game.lastTime = ts;
    const dt = clamp((ts - game.lastTime) / 1000, 0, 0.04);
    game.lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function init(){
    if(save.selectedRank > highestUnlockedRank()) save.selectedRank = highestUnlockedRank();
    if(!save.selectedMode) save.selectedMode = 'story';
    if(!save.equipment) save.equipment = {jet:null, bullet:null};
    if(!Number.isFinite(save.ds)) save.ds = 0;
    el.versionText.textContent = `v${VERSION} / GitHub Pages ready`;
    renderTabs();
    renderPanel(true);
    saveGame('자동 저장 준비');
    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
