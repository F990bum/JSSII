  function combinePart(key){
    const count = save.parts[key] || 0;
    if(count < 3){ setMessage('합성에는 같은 종류/타입/등급 파츠 3개가 필요합니다.', 'warn'); return; }
    const p = parsePartKey(key);
    const idx = gradeOrder.indexOf(p.grade);
    if(idx < 0 || idx >= gradeOrder.length - 1){ setMessage('이미 최고 등급입니다.', 'warn'); return; }
    const wasEquipped = save.equipment && save.equipment[p.kind] === key;
    save.parts[key] -= 3;
    if(save.parts[key] <= 0) delete save.parts[key];
    const nextGrade = gradeOrder[idx + 1];
    const nextKey = partKey(p.kind, p.type, nextGrade);
    addPart(p.kind, p.type, nextGrade, 1);
    if(wasEquipped) save.equipment[p.kind] = nextKey;
    saveGame('파츠 합성 저장됨');
    setMessage(`${partName(p.kind,p.type,p.grade)} 3개 → ${partName(p.kind,p.type,nextGrade)} 1개 합성.`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function nodeAvailable(node){
    if(skillUnlocked(node.id)) return false;
    if(!skillTreeUnlocked()) return false;
    if(node.id === 'levelBreakthrough' && save.highestClearedRank < stageRank(3,5)) return false;
    const prereq = node.prereq || [];
    if(node.anyPrereqCount){
      const count = prereq.filter(skillUnlocked).length;
      return count >= node.anyPrereqCount;
    }
    return prereq.every(skillUnlocked);
  }

  function buySkill(id){
    const node = getNode(id);
    if(!node || skillUnlocked(id) || !nodeAvailable(node)){
      setMessage('조건이 부족합니다. 자쿠드는 아직 고개를 돌리지 않았습니다.', 'warn');
      return;
    }
    if(save.ku < node.cost){
      setMessage(`KU 부족: ${format(node.cost)} KU 필요`, 'warn');
      return;
    }
    if(node.dsCost && (save.ds || 0) < node.dsCost){
      setMessage(`DS 부족: ${format(node.dsCost)} DS 필요`, 'warn');
      return;
    }
    save.ku -= node.cost;
    if(node.dsCost) save.ds -= node.dsCost;
    save.skillTree[id] = true;
    saveGame('특성 저장됨');
    setMessage(`${node.name.replace(/\n/g,' ')} 습득. ${node.desc}`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function upgradeBuy(key){
    const def = upgradeDefs.find(u => u.key === key);
    if(!def) return;
    const level = save.permanentUpgrades[key] || 0;
    if(level >= def.max){ setMessage('이미 MAX입니다.', 'warn'); return; }
    const cost = costFormula(def.base, level);
    if(save.ku < cost){ setMessage(`KU 부족: ${format(cost)} KU 필요`, 'warn'); return; }
    save.ku -= cost;
    save.permanentUpgrades[key] = level + 1;
    saveGame('강화 저장됨');
    setMessage(`${def.name} Lv.${level + 1}. 조금 덜 노재능이 되었습니다.`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function buyArtifact(id){
    if(!artifactUnlocked()){ setMessage('성물은 3-1부터 열립니다.', 'warn'); return; }
    const def = artifactDefs.find(a => a.id === id);
    if(!def || isOwned(id)) return;
    const cost = artifactCost(def);
    if((save.ds || 0) < cost){ setMessage(`DS 부족: ${format(cost)} DS 필요`, 'warn'); return; }
    save.ds -= cost;
    save.artifacts.owned.push(id);
    saveGame('성물 저장됨');
    setMessage(`${def.name} 획득. ${def.desc}`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function toggleArtifact(id){
    if(!artifactUnlocked()){ setMessage('성물은 3-1부터 열립니다.', 'warn'); return; }
    const def = artifactDefs.find(a => a.id === id);
    if(!def || !isOwned(id)) return;
    if(isEquipped(id)){
      save.artifacts.equipped = save.artifacts.equipped.filter(x => x !== id);
      setMessage(`${def.name} 해제.`, 'normal');
    }else{
      if(save.artifacts.equipped.length >= currentArtifactSlots()){
        setMessage(`장착 슬롯이 부족합니다. 현재 ${currentArtifactSlots()}칸.`, 'warn');
        return;
      }
      const jakudEquipped = save.artifacts.equipped
        .map(eid => artifactDefs.find(a => a.id === eid))
        .filter(a => a && a.grade === '자쿠드').length;
      if(def.grade === '자쿠드' && jakudEquipped >= 2){
        setMessage('자쿠드 등급 성물은 최대 2개까지만 장착할 수 있습니다.', 'warn');
        return;
      }
      const sameGroup = artifactDefs.filter(a => a.group === def.group && isEquipped(a.id));
      if((def.group === 'revival' || def.group === 'economy') && sameGroup.length >= 1){
        setMessage('같은 핵심 계열은 중복 장착할 수 없습니다.', 'warn');
        return;
      }
      if(def.group === 'startWeapon'){
        const startWeaponEquipped = artifactDefs.filter(a => a.group === 'startWeapon' && isEquipped(a.id));
        if(startWeaponEquipped.length >= 3){
          setMessage('시작 무기 레벨 증가 성물은 최대 3개까지 장착됩니다.', 'warn');
          return;
        }
      }
      save.artifacts.equipped.push(id);
      setMessage(`${def.name} 장착.`, 'ok');
    }
    saveGame('성물 장착 저장됨');
    uiDirty = true;
    renderPanel(true);
  }

  function createRun(stage){
    const up = save.permanentUpgrades;
    const st = save.skillTree;
    const equipped = save.artifacts.equipped;
    const has = id => equipped.includes(id);
    const artifactAmp = (st.artifactAmplify ? 1.18 : 1) * (1 + (up.artifactStudy || 0) * 0.05);

    const run = {
      stage,
      kuEarned:0,
      jaEarned:0,
      dsEarned:0,
      kills:0,
      bossesKilled:0,
      weapons:{front:1, side:0, missile:0, laser:0},
      weaponBonus:{front:1, side:1, missile:1, laser:1},
      stats:{
        attackMultiplier:1 + (up.attack || 0) * 0.18,
        fireRateMultiplier:1 + (up.fireRate || 0) * 0.09,
        moveSpeedMultiplier:1 + (up.moveSpeed || 0) * 0.06,
        kuGainMultiplier:1 + (up.kuGain || 0) * 0.12,
        bounce:0,
        critChance:Math.min(0.75, 0.05 + (up.critChance || 0) * 0.025),
        critDamage:1.5 + (up.critDamage || 0) * 0.18,
        shield:0,
        maxShield:3,
        bossDamageMultiplier:1 + (up.bossDamage || 0) * 0.12,
        antiBitik:(up.antiBitik || 0) * 0.10,
        enhancedDamageMultiplier:1,
        bulletSizeMultiplier:1,
        missileExplosionMultiplier:1,
        laserDurationMultiplier:1,
        bombChargeMultiplier:1
      },
      levelBreakthrough: !!st.levelBreakthrough,
      revivalAvailable:false,
      silenceAvailable:false,
      startedAt:performance.now()
    };
    const incWeapon = (key, n=1) => { run.weapons[key] = Math.min(run.weapons[key] + n, maxForWeapon(key, run)); };

    if(st.noTalentAwakening) run.stats.attackMultiplier += 0.05;
    if(st.jjamAccumulation) run.stats.attackMultiplier += 0.10;
    if(st.rapidFireTraining) run.stats.fireRateMultiplier += 0.08;
    if(st.wristAdaptation){ run.weaponBonus.front *= 1.14; run.weaponBonus.side *= 1.14; }
    if(st.revelationBoost) run.stats.kuGainMultiplier += 0.12;
    if(st.bossDismantle) run.stats.bossDamageMultiplier += 0.18;
    if(st.bulletUnderstanding){ run.stats.bulletSizeMultiplier += 0.15; run.weaponBonus.front *= 1.10; run.weaponBonus.side *= 1.10; }
    if(st.enhancedBullet) run.stats.enhancedDamageMultiplier += 0.35;
    if(st.missileOverload) run.stats.missileExplosionMultiplier += 0.28;
    if(st.laserHaste) run.stats.fireRateMultiplier += 0.06;
    if(st.dopamineTheory) run.stats.kuGainMultiplier += Math.min(0.35, (stage.rank - 1) * 0.015);
    if(st.bombCharge) run.stats.bombChargeMultiplier += 0.20;

    let shieldChancePercent = 0;
    if(st.protectionPrayer) shieldChancePercent += 35;
    if((up.shieldBase || 0) > 0) shieldChancePercent += (up.shieldBase || 0) * 20;

    if(has('front_manual')){ incWeapon('front',1); run.weaponBonus.front *= 1 + 0.12 * artifactAmp; }
    if(has('side_wing')){ incWeapon('side',1); run.weaponBonus.side *= 1 + 0.12 * artifactAmp; }
    if(has('missile_call')){ incWeapon('missile',1); run.weaponBonus.missile *= 1 + 0.20 * artifactAmp; }
    if(has('laser_book')){ incWeapon('laser',1); run.weaponBonus.laser *= 1 + 0.20 * artifactAmp; }
    if(has('cracked_shield_charm')){ shieldChancePercent += 60 * artifactAmp; run.stats.maxShield += 1; }
    if(has('ku_rosary')) run.stats.kuGainMultiplier += 0.18 * artifactAmp;
    if(has('bounce_coin')){ run.stats.bounce += 2; run.weaponBonus.front *= 1.10; run.weaponBonus.side *= 1.10; }
    if(has('boss_stamp')) run.stats.bossDamageMultiplier += 0.35 * artifactAmp;
    if(has('wrist_guard')) run.stats.fireRateMultiplier += 0.14 * artifactAmp;
    if(has('pixel_engine')){ run.stats.moveSpeedMultiplier += 0.22 * artifactAmp; run.stats.fireRateMultiplier += 0.10 * artifactAmp; }
    if(has('anti_bitik_charm')) run.stats.antiBitik += 0.45 * artifactAmp;
    if(has('missile_core')){ run.weaponBonus.missile *= 1 + 0.45 * artifactAmp; run.stats.missileExplosionMultiplier += 0.20 * artifactAmp; }
    if(has('laser_prism')){ run.weaponBonus.laser *= 1 + 0.45 * artifactAmp; run.stats.laserDurationMultiplier += 0.25 * artifactAmp; }
    if(has('dopamine_meter')) run.stats.kuGainMultiplier += Math.min(0.55, stage.rank * 0.018) * artifactAmp;
    if(has('overclock_relic')){ run.stats.fireRateMultiplier += 0.28 * artifactAmp; run.stats.attackMultiplier += 0.18 * artifactAmp; }
    if(has('enhanced_ammo_seal')) run.stats.enhancedDamageMultiplier += 0.80 * artifactAmp;
    if(has('shield_generator')){ run.stats.maxShield += 2; run.stats.shield += 1; }
    if(has('jakud_revival')) run.revivalAvailable = true;
    if(has('no_talent_license')) ['front','side','missile','laser'].forEach(k => incWeapon(k,1));
    if(has('ku_singularity')) run.stats.kuGainMultiplier += 0.75 * artifactAmp;
    if(has('jakud_fragment')){ run.stats.attackMultiplier += 0.80; run.stats.kuGainMultiplier += 0.50; run.stats.shield += 2; run.stats.maxShield += 2; }
    if(has('jakud_silence')){ run.silenceAvailable = true; run.stats.bossDamageMultiplier += 1.00; }
    if(has('jakud_core')){ ['front','side','missile','laser'].forEach(k => incWeapon(k,2)); run.stats.fireRateMultiplier += 0.20; run.stats.enhancedDamageMultiplier += 1.20; run.stats.bombChargeMultiplier += 0.25; }

    for(const part of getEquippedParts()){
      const type = partTypes[part.type];
      const weapon = type.weapon;
      const grade = part.grade;
      const amp = partEffectMultiplier();
      const startLevelByGrade = { common:0, uncommon:0, rare:0, hero:1, epic:1, legend:1, jakud:2 };
      const shieldByGrade = { common:50, uncommon:100, rare:100, hero:100, epic:150, legend:200, jakud:200 };
      const damageByGrade = { common:1.5, uncommon:2.5, rare:2.5, hero:2.5, epic:3.5, legend:5.0, jakud:5.0 };
      const addLevel = startLevelByGrade[grade] || 0;
      if(addLevel) incWeapon(weapon, addLevel);
      if(part.kind === 'jet'){
        shieldChancePercent += (shieldByGrade[grade] || 0) * amp;
        if(grade === 'jakud') run.revivalAvailable = true;
        if(grade === 'jakud' && part.type === 'A') run.stats.shield = Math.min(run.stats.maxShield, run.stats.shield + 1);
        if(grade === 'jakud' && part.type === 'B') run.stats.critChance = Math.min(0.75, run.stats.critChance + 0.20);
        if(grade === 'jakud' && part.type === 'C') run.weaponBonus.missile *= 1.50;
        if(grade === 'jakud' && part.type === 'D') run.stats.fireRateMultiplier += 0.20;
      }
      if(part.kind === 'bullet'){
        run.weaponBonus[weapon] *= (damageByGrade[grade] || 1) * amp;
        if(grade === 'jakud'){
          for(const k of Object.keys(run.weaponBonus)) if(k !== weapon) run.weaponBonus[k] *= 2.0;
          if(part.type === 'C') run.stats.missileExplosionMultiplier += 0.50;
          if(part.type === 'D'){ run.weaponBonus.laser *= 1.50; run.stats.laserDurationMultiplier += 0.20; }
        }
      }
    }

    if(shieldChancePercent > 0){
      const guaranteed = Math.floor(shieldChancePercent / 100);
      const residual = (shieldChancePercent % 100) / 100;
      run.stats.shield += guaranteed + (chance(residual) ? 1 : 0);
    }
    run.stats.maxShield = Math.min(6, run.stats.maxShield);
    run.stats.shield = clamp(run.stats.shield, 0, run.stats.maxShield);
    return run;
  }

  function maxForWeapon(key, run = game.run){
    return run && run.levelBreakthrough ? weaponMax[key].break : weaponMax[key].base;
  }

  function startRun(){
    if(game.running){ setMessage('이미 출격 중입니다.', 'warn'); return; }
    const mode = save.selectedMode || 'story';
    if(mode === 'infinite' && !infiniteUnlocked()){
      save.selectedMode = 'story';
      setMessage('무한 모드는 3-5 클리어 후 개방됩니다.', 'warn');
      renderPanel(true);
      return;
    }
    if(mode === 'story'){
      const unlocked = highestUnlockedRank();
      if(save.selectedRank > unlocked){ save.selectedRank = unlocked; }
      game.stage = rankToStage(save.selectedRank);
      game.infiniteDepth = 0;
    }else{
      game.infiniteDepth = Math.max(1, (save.infiniteBestDepth || 0) - 3);
      game.stage = infiniteStage(game.infiniteDepth);
    }
    const stage = game.stage;
    game.running = true;
    game.paused = false;
    game.powerupOpen = false;
    game.run = createRun(stage);
    game.enemies = [];
    game.bullets = [];
    game.missiles = [];
    game.bossBullets = [];
    game.particles = [];
    game.lasers = [];
    game.warnings = [];
    game.boss = null;
    game.player.x = W/2;
    game.player.y = H - 82;
    game.player.targetX = W/2;
    game.player.targetY = H - 82;
    game.shootTimer = 0.15;
    game.missileTimer = 0.8;
    game.laserTimer = 1.4;
    game.nextKillPowerup = 8;
    game.powerupCount = 0;
    game.bombGauge = 0;
    game.bombReadyFlash = 0;
    game.sequence = stageSequence(stage);
    game.phaseIndex = 0;
    save.stats.runs += 1;
    saveGame('출격 저장됨');
    setMessage(`${mode === 'infinite' ? '무한 모드' : stageText(stage)} 출격. 재능에 맞서 싸워라.`, 'ok');
    startPhase();
    uiDirty = true;
  }

  function stageSequence(stage){
    if(stage && stage.mode === 'infinite') return ['wave','wave','wave','wave','miniboss','wave','wave','wave','wave','boss'];
    if(stage && stage.rank === stageRank(1,1)) return ['wave','wave','wave','boss'];
    if(stage && stage.rank === stageRank(6,5)) return ['wave','wave','miniboss','wave','wave','miniboss','wave','wave','boss'];
    if(stage && stage.level === 5) return ['wave','wave','miniboss','wave','wave','boss'];
    if(stage && stage.rank >= stageRank(4,1)) return ['wave','wave','wave','miniboss','wave','wave','boss'];
    return ['wave','wave','wave','wave','boss'];
  }

  function startPhase(){
    const name = game.sequence[game.phaseIndex];
    if(!name){ completeRun(); return; }
    if(name === 'wave'){
      const ch = Math.min(6, game.stage.chapter || 1);
      const lv = game.stage.level || 1;
      const rank = game.stage.rank || 1;
      const rowBase = [0,5,6,7,8,9,10][ch] || 8;
      const laterWave = Math.max(0, game.phaseIndex - 1);
      const x5Bonus = lv === 5 ? 1 : 0;
      const finalBonus = rank === stageRank(6,5) ? 2 : 0;
      const infiniteBonus = game.stage.mode === 'infinite' ? Math.min(10, Math.floor((game.stage.depth || 1) / 8)) : 0;
      const target = clamp(rowBase + Math.floor(laterWave * 0.45) + x5Bonus + finalBonus + infiniteBonus, 5, game.stage.mode === 'infinite' ? 24 : 14);
      const rowInterval = clamp(1.82 - ch * 0.095 - (game.stage.mode === 'infinite' ? 0.05 : 0), 1.15, 1.75);
      game.phase = { type:'wave', spawned:0, target, spawnTimer:0.42, rowInterval, rowsCleared:0, label:`${game.phaseIndex + 1}번째 웨이브` };
      setMessage(`${game.phase.label}: ${target}행 타일 행렬 접근 중.`);
    }else{
      spawnBoss(name === 'miniboss');
      game.phase = { type:name, label:name === 'miniboss' ? '미니 보스' : 'BOSS' };
    }
  }

  function phaseComplete(){
    const phase = game.phase;
    if(!phase) return;
    if(phase.type === 'boss'){
      if(game.stage && game.stage.mode === 'infinite'){
        advanceInfiniteStage();
        return;
      }
      completeRun();
      return;
    }
    const text = phase.type === 'miniboss' ? '미니 보스 격파. 자쿠드가 카드 3장을 던졌습니다.' : '웨이브 정리. 파워업을 선택합니다.';
    offerPowerups(() => {
      game.phaseIndex += 1;
      startPhase();
    }, text);
  }

  function advanceInfiniteStage(){
    const run = game.run;
    const ja = clearJaReward(game.stage);
    run.jaEarned += ja;
    game.infiniteDepth += 1;
    save.infiniteBestDepth = Math.max(save.infiniteBestDepth || 0, game.infiniteDepth - 1);
    game.stage = infiniteStage(game.infiniteDepth);
    game.sequence = stageSequence(game.stage);
    game.phaseIndex = 0;
    game.enemies = [];
    game.bossBullets = [];
    game.warnings = [];
    offerPowerups(() => startPhase(), `무한 모드 ${game.infiniteDepth - 1}구간 돌파. ${format(ja)} JA 확보.`);
    uiDirty = true;
  }

  function completeRun(){
    const run = game.run;
    if(!run) return;
    const st = run.stage;
    const clearBonus = roundNice(Math.max(1, run.kuEarned) * 0.18);
    const jaGain = clearJaReward(st);
    run.kuEarned += clearBonus;
    run.jaEarned += jaGain;
    save.ku += run.kuEarned;
    save.ja = (save.ja || 0) + run.jaEarned;
    save.ds = (save.ds || 0) + (run.dsEarned || 0);
    save.stats.totalKuEarned += run.kuEarned;
    save.stats.totalJaEarned = (save.stats.totalJaEarned || 0) + run.jaEarned;
    save.stats.totalDsEarned = (save.stats.totalDsEarned || 0) + (run.dsEarned || 0);
    save.stats.highestKuInRun = Math.max(save.stats.highestKuInRun, run.kuEarned);
    save.stats.clears += 1;
    if(st.mode !== 'infinite'){
      save.highestClearedRank = Math.max(save.highestClearedRank, st.rank);
      save.selectedRank = nextRank(st.rank);
    }
    game.running = false;
    game.paused = false;
    game.phase = null;
    hidePowerup();

    let msg = `${stageText(st)} 클리어. ${format(run.jaEarned)} JA / ${format(run.kuEarned)} KU / ${format(run.dsEarned || 0)} DS 정산.`;
    let ending = null;
    if(st.rank === stageRank(3,5) && !save.normalEndingSeen){
      save.normalEndingSeen = true;
      ending = {
        title:'노멀 엔딩',
        text:'재능단의 중간 거점이 무너졌다.\n하지만 진짜 비틱은 아직 웃고 있다.\n\n3-5 클리어로 무한 모드와 레벨 돌파 루트가 열렸습니다.'
      };
    }
    if(st.rank === stageRank(6,5)){
      if(save.skillTree.trueEndingTrace && !save.trueEndingSeen){
        save.trueEndingSeen = true;
        ending = {
          title:'진엔딩',
          text:'재능은 졌다.\n짬은 남았다.\nKU는 증명했다.\n\n자쿠드는 아무 말도 하지 않았다.\n노재능단은 그 침묵을 허락으로 받아들였다.'
        };
      }else{
        ending = {
          title:'최종 보스 격파',
          text:'6-5를 클리어했습니다.\n진엔딩 추적 노드를 습득하면 진엔딩 문구가 열립니다.'
        };
      }
    }
    saveGame('클리어 저장됨');
    setMessage(msg, 'ok');
    if(ending) showEnding(ending.title, ending.text);
    uiDirty = true;
    renderPanel(true);
  }

  function failRun(reason){
    const run = game.run;
    if(!run) return;
    save.ku += run.kuEarned;
    save.ja = (save.ja || 0) + (run.jaEarned || 0);
    save.ds = (save.ds || 0) + (run.dsEarned || 0);
    if(game.stage && game.stage.mode === 'infinite') save.infiniteBestDepth = Math.max(save.infiniteBestDepth || 0, Math.max(0, game.infiniteDepth - 1));
    save.stats.deaths += 1;
    save.stats.totalKuEarned += run.kuEarned;
    save.stats.totalJaEarned = (save.stats.totalJaEarned || 0) + (run.jaEarned || 0);
    save.stats.totalDsEarned = (save.stats.totalDsEarned || 0) + (run.dsEarned || 0);
    save.stats.highestKuInRun = Math.max(save.stats.highestKuInRun, run.kuEarned);
    game.running = false;
    game.paused = false;
    game.phase = null;
    hidePowerup();
    saveGame('사망 정산 저장됨');
    setMessage(`패배했습니다. ${reason} / ${format(run.jaEarned || 0)} JA, ${format(run.kuEarned)} KU, ${format(run.dsEarned || 0)} DS 정산.`, 'danger');
    spawnBurst(game.player.x, game.player.y, '#ff5769', 32);
    uiDirty = true;
    renderPanel(true);
  }

  function showEnding(title, text){
    el.endingTitle.textContent = title;
    el.endingText.textContent = text;
    el.endingModal.classList.add('show');
  }
  el.endingClose.addEventListener('click', () => el.endingModal.classList.remove('show'));

  function togglePause(){
    if(!game.running || game.powerupOpen) return;
    game.paused = !game.paused;
    setMessage(game.paused ? '일시정지. 자쿠드는 보고 있다.' : '재개. 재능에 맞서 싸워라.', game.paused ? 'warn' : 'ok');
  }

  function spawnTileWave(lanes=null, forcedTypes=null){
    const y = -78;
    let laneList = lanes;
    if(!laneList){
      const ch = Math.min(6, game.stage.chapter || 1);
      const minCount = ch >= 4 ? 3 : 2;
      const maxCount = ch >= 2 ? 4 : 3;
      const count = clamp(Math.floor(rand(minCount, maxCount + 0.999)), 2, 4);
      laneList = [0,1,2,3].sort(() => Math.random() - 0.5).slice(0,count).sort((a,b)=>a-b);
    }
    for(const lane of laneList){
      const type = forcedTypes ? (Array.isArray(forcedTypes) ? pick(forcedTypes) : forcedTypes) : chooseEnemyType();
      game.enemies.push(createEnemy(type, lane, y));
    }
  }

  function spawnTwoLaneWave(forcedTypes=null){
    const lanes = [0,1,2,3].sort(() => Math.random() - 0.5).slice(0,2).sort((a,b)=>a-b);
    spawnTileWave(lanes, forcedTypes);
  }

  function recordEnemy(typeKey){
    if(!save.discoveredEnemies) save.discoveredEnemies = {};
    if(!save.discoveredEnemies[typeKey]){
      save.discoveredEnemies[typeKey] = true;
      uiDirty = true;
    }
  }
  function recordBoss(ch){
    if(!save.discoveredBosses) save.discoveredBosses = {};
    if(!save.discoveredBosses[ch]){
      save.discoveredBosses[ch] = true;
      uiDirty = true;
    }
  }

  function chooseEnemyType(){
    const ch = game.stage.chapter;
    const pool = ['basic','basic','basic'];
    if(ch >= 2) pool.push('fast','fast','bitik');
    if(ch >= 3) pool.push('split','split');
    if(ch >= 4) pool.push('shield','jjam','jjam');
    if(ch >= 5) pool.push('healer','barrier','armor');
    if(ch >= 6) pool.push('ranker','ranker','barrier','armor');
    if(game.stage.mode === 'infinite' && (game.stage.depth || 1) >= 30) pool.push('healer','ranker','barrier','armor','bitik');
    if(game.phase && (game.phase.type === 'boss' || game.phase.type === 'miniboss')) pool.push('shield','bitik','barrier');
    return pick(pool);
  }

  function createEnemy(typeKey, lane, y){
    const def = enemyTypes[typeKey] || enemyTypes.basic;
    const laneW = W / 4;
    recordEnemy(typeKey);
    const sizeW = Math.min(150, laneW * 0.94);
    const sizeH = typeKey === 'ranker' ? 74 : 68;
    const phaseRatio = game.sequence && game.sequence.length ? clamp((game.phaseIndex || 0) / Math.max(1, game.sequence.length - 1), 0, 1) : 0;
    let waveMultiplier = 0.90 + phaseRatio * 0.70;
    const variancePool = [0.30,0.55,0.75,0.90,1.00,1.15,1.30,1.60,2.10,2.60,3.00];
    const variance = pick(variancePool);
    waveMultiplier *= variance;
    if(game.phase && (game.phase.type === 'boss' || game.phase.type === 'miniboss')) waveMultiplier *= rand(1.50, 2.20);
    const anti = game.run ? game.run.stats.antiBitik : 0;
    let typeMult = def.hp;
    if(['bitik','shield','healer','barrier','armor'].includes(typeKey)) typeMult *= (1 - Math.min(0.55, anti * 0.10));
    let hp = roundNice(stageBaseNormalHp(game.stage) * waveMultiplier * typeMult);
    if(typeKey === 'armor') hp = roundNice(hp * 1.08);
    const rankForSpeed = game.stage.mode === 'infinite' ? clamp((save.highestClearedRank || 1) + Math.floor((game.stage.depth || 1)/5), 1, 30) : (game.stage.rank || 1);
    const speed = (72 + rankForSpeed * 2.1) * def.speed * SPEED_MULT;
    const x = laneW * lane + laneW / 2;
    return {
      id:Math.random().toString(36).slice(2),
      typeKey, type:def, lane, x, y, w:sizeW, h:sizeH,
      hp, maxHp:hp,
      speed,
      reward:def.reward,
      shielded:typeKey === 'shield',
      damageReduction:typeKey === 'barrier' ? 0.25 : (typeKey === 'armor' ? 0.45 : 0),
      growTimer:0,
      healTimer:1.45,
      phase:rand(0,Math.PI*2),
      vx:typeKey === 'ranker' ? rand(42,78) * (chance(0.5)?1:-1) : 0,
      hurt:0,
      hpTier:variance
    };
  }

  function spawnBoss(mini=false){
    const ch = game.stage.chapter;
    const lv = game.stage.level;
    const storyBossStage = game.stage.mode !== 'infinite' && lv === 5;
    const isFinal = game.stage.mode !== 'infinite' && game.stage.rank === stageRank(6,5) && !mini;
    const names = ['딸깍의 재능','망한 오락실 점탑','희대의 노브떨기범','리듬여아 니아노아','미친 연타수저','재능단장 비틱의 화신'];
    const normalHp = stageBaseNormalHp(game.stage);
    let hpBase;
    if(mini){
      hpBase = normalHp * (storyBossStage ? (20 + ch * 4) : (12 + ch * 3));
    }else if(isFinal){
      hpBase = normalHp * 155;
    }else if(storyBossStage){
      hpBase = normalHp * (85 + ch * 10);
    }else{
      hpBase = normalHp * (45 + ch * 5);
    }
    if(game.stage.mode === 'infinite') hpBase = normalHp * (mini ? (14 + Math.min(20, (game.stage.depth || 1) * 0.7)) : (60 + Math.min(90, (game.stage.depth || 1) * 2.0)));
    hpBase = roundNice(hpBase);
    recordBoss(isFinal ? 'final' : ch);
    const bossName = isFinal ? '자쿠드' : names[Math.max(0,ch-1)];
    game.boss = {
      mini,
      chapter:ch,
      name: mini ? `미니 ${bossName}` : bossName,
      x:W/2,
      y:mini ? 85 : 102,
      w:mini ? 150 : (storyBossStage ? 246 : 220),
      h:mini ? 58 : (storyBossStage ? 84 : 76),
      hp:hpBase,
      maxHp:hpBase,
      timer:0,
      shootTimer:mini ? 1.25 : (storyBossStage ? 0.78 : 0.92),
      summonTimer:mini ? 3.8 : (storyBossStage ? 2.35 : 2.9),
      specialTimer:mini ? 4.4 : (storyBossStage ? 3.0 : 3.6),
      shieldUsed:false,
      halfPowerupGiven:false,
      direction:1,
      rage:false,
      hitFlash:0
    };
    const line = bossLine(ch, mini, isFinal);
    setMessage(`${mini ? '미니 보스' : (storyBossStage ? '챕터 보스' : 'BOSS')} 등장: ${game.boss.name} — “${line}”`, 'warn');
    if(save.skillTree.revivalPrep && !mini && game.run){
      game.run.stats.shield = clamp(game.run.stats.shield + 1, 0, game.run.stats.maxShield);
      setMessage('재림 준비: 보스전 보호막 +1', 'ok');
    }
  }

  function bossLine(ch, mini, isFinal=false){
    const lines = [
      '이거 그냥 한 번에 되던데요?',
      '저 별로 안 했는데요?',
      '계산을 왜 해요? 감으로 하면 되는데.',
      '손목 차이네요.',
      '재능은 증명할 필요가 없다. 이미 결과니까.',
      '노력하셨군요. 저는 그냥 됐습니다.'
    ];
    if(isFinal) return '나는 네가 숭배한 것의 결말이다.';
    return mini ? '많이 하셨나 봐요.' : lines[ch-1] || lines[0];
  }

  function update(dt){
    if(!game.running || game.paused || game.powerupOpen) return;
    if(messageTimer > 0) messageTimer -= dt;
    updatePlayer(dt);
    updatePhase(dt);
    updateWeapons(dt);
    updateBullets(dt);
    updateMissiles(dt);
    updateLasers(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateBossBullets(dt);
    updateWarnings(dt);
    updateParticles(dt);
    checkPlayerCollisions();
    if(uiDirty || performance.now() - lastPanelRender > 700){
      renderPanel(false);
      lastPanelRender = performance.now();
    }
  }

  function updatePlayer(dt){
    const p = game.player;
    const speed = 13 * (game.run ? game.run.stats.moveSpeedMultiplier : 1);
    p.x += (p.targetX - p.x) * clamp(dt * speed, 0, 1);
    p.y += (p.targetY - p.y) * clamp(dt * speed, 0, 1);
    p.x = clamp(p.x, 18, W - 18);
    p.y = clamp(p.y, H * 0.44, H - 24);
    if(p.hitFlash > 0) p.hitFlash -= dt;
  }

  function updatePhase(dt){
    const phase = game.phase;
    if(!phase) return;
    if(phase.type === 'wave'){
      phase.spawnTimer -= dt;
      if(phase.spawned < phase.target && phase.spawnTimer <= 0){
        spawnTileWave();
        phase.spawned += 1;
        phase.spawnTimer = phase.rowInterval || 1.55;
      }
      if(phase.spawned >= phase.target && game.enemies.length === 0){
        phaseComplete();
      }
    }
  }

  function updateWeapons(dt){
    const run = game.run;
    if(!run) return;
    game.shootTimer -= dt;
    const fireInterval = clamp(0.27 / run.stats.fireRateMultiplier, 0.075, 0.35);
    if(game.shootTimer <= 0){
      fireBullets();
      game.shootTimer += fireInterval;
    }
    if(run.weapons.missile > 0){
      game.missileTimer -= dt;
      if(game.missileTimer <= 0){
        fireMissiles();
        game.missileTimer = clamp(1.02 / run.stats.fireRateMultiplier, 0.34, 1.05);
      }
    }else{
      game.missileTimer = clamp(1.02 / run.stats.fireRateMultiplier, 0.34, 1.05);
    }
    if(run.weapons.laser > 0){
      game.laserTimer -= dt;
      if(game.laserTimer <= 0){
        fireLaser();
        const skillFactor = save.skillTree.laserHaste ? 1.18 : 1;
        game.laserTimer = clamp(2.05 / (run.stats.fireRateMultiplier * skillFactor), 0.48, 2.1);
      }
    }else{
      game.laserTimer = clamp(2.05 / run.stats.fireRateMultiplier, 0.48, 2.1);
    }
  }

  function damageRoll(base, weaponKey, enhanced=false, targetBoss=false){
    const run = game.run;
    let dmg = base * run.stats.attackMultiplier * (run.weaponBonus[weaponKey] || 1);
    if(enhanced) dmg *= run.stats.enhancedDamageMultiplier * 3.15;
    if(targetBoss) dmg *= run.stats.bossDamageMultiplier;
    const crit = Math.random() < run.stats.critChance;
    if(crit) dmg *= run.stats.critDamage;
    return {dmg, crit};
  }

  function fireBullets(){
    const run = game.run;
    const p = game.player;
    const frontLv = run.weapons.front;
    const sideLv = run.weapons.side;
    const enhancedFront = Math.max(0, frontLv - weaponMax.front.base);
    const normalFront = enhancedFront > 0 ? 0 : Math.min(frontLv, weaponMax.front.base);
    if(normalFront > 0){
      for(let i=0; i<normalFront; i++){
        const offset = (i - (normalFront - 1) / 2) * 11;
        const roll = damageRoll(2.2, 'front');
        game.bullets.push(makeBullet(p.x + offset, p.y - 18, offset * 0.05, -900, 4.2 * run.stats.bulletSizeMultiplier, roll.dmg, roll.crit, 'front', false));
      }
    }
    for(let i=0; i<enhancedFront; i++){
      const offset = (i - (enhancedFront - 1) / 2) * 18;
      const roll = damageRoll(3.2, 'front', true);
      game.bullets.push(makeBullet(p.x + offset, p.y - 22, offset * 0.04, -860, 9.0 * run.stats.bulletSizeMultiplier, roll.dmg, roll.crit, 'front', true));
    }

    const sideEnhanced = Math.max(0, sideLv - weaponMax.side.base);
    const sideNormal = sideEnhanced > 0 ? 0 : Math.min(sideLv, weaponMax.side.base);
    if(sideNormal > 0){
      for(let i=0; i<sideNormal; i++){
        const spread = 280 + i * 56;
        const vy = -700 + i * -24;
        let roll = damageRoll(1.45, 'side');
        game.bullets.push(makeBullet(p.x - 10, p.y - 9, -spread, vy, 3.8 * run.stats.bulletSizeMultiplier, roll.dmg, roll.crit, 'side', false));
        roll = damageRoll(1.45, 'side');
        game.bullets.push(makeBullet(p.x + 10, p.y - 9, spread, vy, 3.8 * run.stats.bulletSizeMultiplier, roll.dmg, roll.crit, 'side', false));
      }
    }
    if(sideEnhanced > 0){
      for(let i=0; i<sideEnhanced; i++){
        const spread = 360 + i * 68;
        const vy = -660 + i * -20;
        let roll = damageRoll(2.3, 'side', true);
        game.bullets.push(makeBullet(p.x - 14, p.y - 12, -spread, vy, 8.5 * run.stats.bulletSizeMultiplier, roll.dmg, roll.crit, 'side', true));
        roll = damageRoll(2.3, 'side', true);
        game.bullets.push(makeBullet(p.x + 14, p.y - 12, spread, vy, 8.5 * run.stats.bulletSizeMultiplier, roll.dmg, roll.crit, 'side', true));
      }
    }
  }

  function makeBullet(x,y,vx,vy,r,dmg,crit,weapon,enhanced){
    return {x,y,vx,vy,r,dmg,crit,weapon,enhanced,bounceLeft:game.run.stats.bounce, life:3.2};
  }

  function fireMissiles(){
    const run = game.run;
    const p = game.player;
    const lv = run.weapons.missile;
    const enhanced = Math.max(0, lv - weaponMax.missile.base);
    const normalCount = enhanced > 0 ? 0 : (lv >= 3 ? 4 : lv);
    const launch = (x,y,side,enhancedMissile,index) => {
      const roll = damageRoll(enhancedMissile ? 12.5 : (lv >= 3 ? 8.2 : 6.8), 'missile', enhancedMissile);
      const r = enhancedMissile ? 11 : (lv >= 3 ? 7.5 : 6);
      game.missiles.push({x,y,vx:side * (enhancedMissile ? 110 : 80), vy:enhancedMissile ? -360 : -320, r, dmg:roll.dmg, crit:roll.crit, enhanced:enhancedMissile, life:enhancedMissile?5.6:5.0, target:null, trail:[], phase:index});
    };
    for(let i=0;i<normalCount;i++){
      const side = i % 2 === 0 ? -1 : 1;
      const pair = Math.floor(i / 2);
      launch(p.x + side * (32 + pair * 9), p.y - 10 - pair * 8, side, false, i);
    }
    for(let i=0;i<enhanced;i++){
      const side = i % 2 === 0 ? -1 : 1;
      const pair = Math.floor(i / 2);
      launch(p.x + side * (42 + pair * 11), p.y - 14 - pair * 7, side, true, i);
    }
  }

  function fireLaser(){
    const run = game.run;
    const lv = run.weapons.laser;
    const beams = laserAngles(lv);
    for(const beam of beams){
      const enhanced = beam.enhanced;
      const roll = damageRoll(enhanced ? 30 : 11.5, 'laser', enhanced);
      game.lasers.push({
        x:game.player.x, y:game.player.y - 22,
        angle:beam.angle, width:enhanced ? 22 : 9,
        dmg:roll.dmg, crit:roll.crit,
        duration:(enhanced ? 0.36 : 0.18) * run.stats.laserDurationMultiplier,
        tick:0,
        enhanced
      });
    }
  }

  function laserAngles(lv){
    const enhancedCount = Math.max(0, lv - weaponMax.laser.base);
    if(enhancedCount > 0){
      const count = enhancedCount;
      const out = [];
      for(let i=0; i<count; i++){
        const spread = (i - (count - 1) / 2) * 0.20;
        out.push({angle:-Math.PI/2 + spread, enhanced:true});
      }
      return out;
    }
    const normalLv = Math.min(lv, weaponMax.laser.base);
    let angles = [];
    if(normalLv === 1) angles = [-Math.PI/2];
    if(normalLv === 2) angles = [-Math.PI/2 - 0.23, -Math.PI/2 + 0.23];
    if(normalLv === 3) angles = [-Math.PI/2 - 0.27, -Math.PI/2, -Math.PI/2 + 0.27];
    if(normalLv >= 4) angles = [-Math.PI/2 - 0.42, -Math.PI/2 - 0.22, -Math.PI/2, -Math.PI/2 + 0.22, -Math.PI/2 + 0.42];
    return angles.map(a => ({angle:a, enhanced:false}));
  }

  function updateBullets(dt){
    for(let i=game.bullets.length-1; i>=0; i--){
      const b = game.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if((b.x < b.r || b.x > W - b.r) && b.bounceLeft > 0){
        b.vx *= -1;
        b.bounceLeft -= 1;
        b.x = clamp(b.x, b.r, W - b.r);
      }
      if(b.life <= 0 || b.y < -40 || b.y > H + 60 || b.x < -60 || b.x > W + 60){
        game.bullets.splice(i,1); continue;
      }
      if(hitBossWithProjectile(b)){
        game.bullets.splice(i,1); continue;
      }
      let hit = false;
      for(let j=game.enemies.length-1; j>=0; j--){
        const e = game.enemies[j];
        if(circleRect(b.x,b.y,b.r,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
          damageEnemy(e, b.dmg, b.crit, b.weapon, b.enhanced);
          spawnBurst(b.x,b.y,b.enhanced ? '#ffe66d' : (b.crit ? '#ff5de1' : '#5df0ff'), b.enhanced ? 8 : 4);
          hit = true;
          break;
        }
      }
      if(hit) game.bullets.splice(i,1);
    }
  }

  function updateMissiles(dt){
    for(let i=game.missiles.length-1; i>=0; i--){
      const m = game.missiles[i];
      m.life -= dt;
      m.trail.push({x:m.x,y:m.y,life:.25});
      if(m.trail.length > 10) m.trail.shift();
      m.trail.forEach(t => t.life -= dt);
      m.trail = m.trail.filter(t => t.life > 0);
      const target = findMissileTarget(m);
      if(target){
        const tx = target.x;
        const ty = target.y;
        const dx = tx - m.x;
        const dy = ty - m.y;
        const len = Math.hypot(dx,dy) || 1;
        const acc = m.enhanced ? 980 : 760;
        m.vx += (dx/len) * acc * dt;
        m.vy += (dy/len) * acc * dt;
        const sp = Math.hypot(m.vx,m.vy) || 1;
        const maxSp = m.enhanced ? 820 : 690;
        if(sp > maxSp){ m.vx = m.vx / sp * maxSp; m.vy = m.vy / sp * maxSp; }
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if(m.life <= 0 || m.y < -80 || m.x < -80 || m.x > W + 80){ game.missiles.splice(i,1); continue; }
      if(hitBossWithProjectile(m)){
        missileExplosion(m.x,m.y,m.enhanced,m.dmg*0.50,m.crit);
        game.missiles.splice(i,1); continue;
      }
      let hit = false;
      for(let j=game.enemies.length-1; j>=0; j--){
        const e = game.enemies[j];
        if(circleRect(m.x,m.y,m.r,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
          damageEnemy(e, m.dmg, m.crit, 'missile', m.enhanced);
          missileExplosion(m.x,m.y,m.enhanced,m.dmg*0.50,m.crit);
          hit = true;
          break;
        }
      }
      if(hit) game.missiles.splice(i,1);
    }
  }

  function findMissileTarget(m){
    if(game.boss) return game.boss;
    let best = null;
    let bestScore = Infinity;
    for(const e of game.enemies){
      const d = Math.hypot(e.x-m.x,e.y-m.y);
      const score = d - e.hp * 4;
      if(score < bestScore){ bestScore = score; best = e; }
    }
    return best;
  }

  function updateLasers(dt){
    for(let i=game.lasers.length-1; i>=0; i--){
      const l = game.lasers[i];
      l.duration -= dt;
      l.tick -= dt;
      if(l.tick <= 0){
        l.tick = 0.075;
        applyLaserDamage(l, l.dmg * 0.18);
      }
      if(l.duration <= 0) game.lasers.splice(i,1);
    }
  }

  function applyLaserDamage(laser, dmg){
    const ex = laser.x + Math.cos(laser.angle) * 1000;
    const ey = laser.y + Math.sin(laser.angle) * 1000;
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      const d = distPointToSegment(e.x, e.y, laser.x, laser.y, ex, ey);
      if(d < laser.width + Math.min(e.w,e.h) * 0.38){
        damageEnemy(e, dmg, laser.crit, 'laser', laser.enhanced);
      }
    }
    if(game.boss){
      const d = distPointToSegment(game.boss.x, game.boss.y, laser.x, laser.y, ex, ey);
      if(d < laser.width + game.boss.w * 0.33){
        damageBoss(dmg * game.run.stats.bossDamageMultiplier, laser.crit, 'laser');
      }
    }
  }

  function updateEnemies(dt){
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      e.hurt = Math.max(0, e.hurt - dt);
      if(e.typeKey === 'ranker'){
        e.x += e.vx * dt;
        if(e.x < e.w/2 + 6 || e.x > W - e.w/2 - 6) e.vx *= -1;
        e.y += e.speed * dt * 0.55;
        if(chance(0.008 + game.stage.chapter * 0.002)) spawnBossBullet(e.x,e.y + 24, rand(-55,55), rand(120,180), 5, '#ffe66d');
      }else{
        e.y += e.speed * dt;
      }
      if(e.typeKey === 'jjam'){
        e.growTimer += dt;
        if(e.growTimer > 0.8){
          e.growTimer = 0;
          const grow = Math.max(1, e.maxHp * 0.012);
          e.hp += grow;
          e.maxHp += grow;
          spawnText(e.x,e.y-22,'짬','#ff9f5d');
        }
      }
      if(e.typeKey === 'healer'){
        e.healTimer -= dt;
        if(e.healTimer <= 0){
          e.healTimer = save.skillTree.healBlock || isEquipped('anti_bitik_charm') ? 2.7 : 1.65;
          const healMult = save.skillTree.healBlock || isEquipped('anti_bitik_charm') ? 0.45 : 1;
          for(const other of game.enemies){
            if(other !== e && Math.abs(other.x - e.x) < W/2 && Math.abs(other.y - e.y) < 95){
              const heal = Math.max(1, Math.floor(other.maxHp * 0.18 * healMult));
              other.hp = Math.min(other.maxHp, other.hp + heal);
              other.hurt = 0.18;
              spawnBurst(other.x, other.y, '#70ff9a', 14);
              spawnText(other.x, other.y-18, '+' + format(heal), '#70ff9a');
            }
          }
        }
      }
      if(e.y > H + 70){
        game.enemies.splice(i,1);
      }
    }
  }

  function updateBoss(dt){
    const b = game.boss;
    if(!b) return;
    b.timer += dt;
    b.hitFlash = Math.max(0, b.hitFlash - dt);
    const ch = b.chapter;
    if(ch === 3 || ch === 6){
      b.x = W/2 + Math.sin(b.timer * (b.mini ? 1.6 : 2.1)) * (b.mini ? 105 : 155);
    }else if(ch === 4){
      b.x += b.direction * (b.mini ? 80 : 120) * dt;
      if(b.x < b.w/2+12 || b.x > W-b.w/2-12) b.direction *= -1;
    }else if(ch === 5){
      b.x = W/2 + Math.sin(b.timer * 0.7) * 70;
    }else{
      b.x = W/2 + Math.sin(b.timer * 0.8) * 90;
    }

    b.shootTimer -= dt;
    b.summonTimer -= dt;
    b.specialTimer -= dt;
    if(b.hp / b.maxHp < 0.4) b.rage = true;
    if(!b.halfPowerupGiven && b.hp / b.maxHp <= 0.5 && game.powerupCount < 7){
      b.halfPowerupGiven = true;
      offerPowerups(() => {}, '보스 체력 50% 이하. 자쿠드의 긴급 선택.');
      return;
    }

    if(b.shootTimer <= 0){
      bossShootPattern(b);
      b.shootTimer = b.rage ? (b.mini ? 0.65 : 0.42) : (b.mini ? 1.15 : 0.72);
    }
    if(b.summonTimer <= 0){
      bossSummonPattern(b);
      b.summonTimer = b.rage ? (b.mini ? 2.8 : 2.0) : (b.mini ? 3.4 : 2.6);
    }
    if(b.specialTimer <= 0){
      bossSpecialPattern(b);
      b.specialTimer = b.rage ? (b.mini ? 3.4 : 2.5) : (b.mini ? 4.5 : 3.4);
    }
  }

  function bossShootPattern(b){
    const ch = b.chapter;
    if(ch === 1){
      const lanes = [0,1,2,3].sort(() => Math.random() - 0.5).slice(0,2);
      const laneW = W / 4;
      for(const lane of lanes){
        const x = lane * laneW + laneW / 2;
        spawnBossBullet(x,b.y+42,(game.player.x - x) * 0.10,185,5.2,'#ff7a88');
      }
    }else if(ch === 2){
      for(let i=0;i<6;i++){
        const a = Math.PI*0.20 + i * Math.PI*0.12;
        spawnBossBullet(b.x,b.y+40,Math.cos(a)*110,Math.sin(a)*170,5,'#ff5de1');
      }
    }else if(ch === 3){
      const lanes = [W*0.125,W*0.375,W*0.625,W*0.875];
      for(const x of lanes) spawnBossBullet(x,b.y+35,(game.player.x-x)*0.15,180,5,'#ffd166');
    }else if(ch === 4){
      for(let i=0;i<9;i++) spawnBossBullet(b.x,b.y+40,rand(-160,160),rand(150,245),4.2,'#ffe66d');
    }else if(ch === 5){
      for(let i=-2;i<=2;i++) spawnBossBullet(b.x + i*25,b.y+45,i*30,190,6,'#7f8cff');
    }else{
      for(let i=0;i<12;i++){
        const a = Math.PI*0.10 + i * Math.PI*0.075 + Math.sin(b.timer)*0.2;
        spawnBossBullet(b.x,b.y+38,Math.cos(a)*155,Math.sin(a)*210,4.8,i%2?'#ff5de1':'#5df0ff');
      }
    }
  }

  function bossSummonPattern(b){
    const ch = b.chapter;
    if(ch === 1){
      spawnTwoLaneWave('basic');
    }else if(ch === 2){
      game.enemies.push(createEnemy('healer', Math.floor(rand(0,4)), -55));
      for(let lane=0; lane<4; lane++) if(chance(0.45)) game.enemies.push(createEnemy('shield', lane, -70-rand(0,40)));
    }else if(ch === 3){
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(chance(0.5)?'fast':'split', lane, -55-rand(0,20)));
    }else if(ch === 4){
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(chance(0.55)?'jjam':'shield', lane, -55-rand(0,50)));
    }else if(ch === 5){
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(pick(['shield','bitik','barrier','armor','healer']), lane, -55-rand(0,30)));
    }else{
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(pick(['shield','healer','ranker','bitik','barrier','armor']), lane, -55-rand(0,50)));
    }
  }

  function bossSpecialPattern(b){
    const ch = b.chapter;
    if(ch === 1 && !b.shieldUsed){
      b.shieldUsed = true;
      spawnBurst(b.x,b.y,'#ffe66d',24);
      setMessage('원트클 방패: 다음 큰 피해 일부 무효.', 'warn');
    }else if(ch === 2){
      for(const e of game.enemies){ e.hp = Math.min(e.maxHp + 8, e.hp + Math.floor(e.maxHp * 0.16)); spawnBurst(e.x,e.y,'#70ff9a',6); }
      setMessage('비틱 회복: 주변 타일 체력이 회복됩니다.', 'warn');
    }else if(ch === 3){
      const lanes = [0,1,2,3].sort(() => Math.random() - 0.5).slice(0,2);
      lanes.forEach(lane => addLaneWarning(lane, 0.85, 0.30, '#ffd166')); 
    }else if(ch === 4){
      addSweepWarning(b.direction > 0 ? 'right' : 'left');
    }else if(ch === 5){
      addLaneWarning(0, 1.0, 0.42, '#7f8cff');
      addLaneWarning(2, 1.0, 0.42, '#7f8cff');
    }else{
      const lanes = [0,1,2,3].sort(() => Math.random() - 0.5).slice(0, game.boss && game.boss.rage ? 3 : 2);
      for(const lane of lanes) addLaneWarning(lane, 0.78, 0.32, lane % 2 ? '#ff5de1' : '#5df0ff');
    }
  }

  function addLaneWarning(lane, warnTime, activeTime, color){
    const laneW = W/4;
    game.warnings.push({type:'lane', lane, x:lane*laneW, w:laneW, warnTime, activeTime, totalWarn:warnTime, color, hit:false});
    setMessage('경고 라인: 레인을 벗어나십시오.', 'warn');
  }
  function addSweepWarning(dir){
    game.warnings.push({type:'sweep', dir, x:dir === 'right' ? 0 : W, warnTime:0.75, activeTime:0.45, totalWarn:0.75, color:'#ffe66d', hit:false});
    setMessage('랭커 스윕: 손목 차이 공격이 옵니다.', 'warn');
  }

  function updateWarnings(dt){
    for(let i=game.warnings.length-1; i>=0; i--){
      const w = game.warnings[i];
      if(w.warnTime > 0){
        w.warnTime -= dt;
      }else{
        w.activeTime -= dt;
        if(w.type === 'sweep'){
          const speed = 760;
          w.x += (w.dir === 'right' ? 1 : -1) * speed * dt;
        }
        if(!w.hit && warningHitsPlayer(w)){
          w.hit = true;
          playerTakeHit('특수 패턴 피격');
        }
        if(w.activeTime <= 0) game.warnings.splice(i,1);
      }
    }
  }

  function warningHitsPlayer(w){
    const p = game.player;
    if(w.type === 'lane'){
      return p.x > w.x + 6 && p.x < w.x + w.w - 6;
    }
    if(w.type === 'sweep'){
      return Math.abs(p.x - w.x) < 20;
    }
    return false;
  }

  function spawnBossBullet(x,y,vx,vy,r,color){
    game.bossBullets.push({x,y,vx:vx*0.96,vy:vy*0.96,r,color,life:5.8});
  }

  function updateBossBullets(dt){
    for(let i=game.bossBullets.length-1; i>=0; i--){
      const b = game.bossBullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if(b.life <= 0 || b.y > H + 40 || b.x < -40 || b.x > W + 40){ game.bossBullets.splice(i,1); continue; }
      if(Math.hypot(b.x - game.player.x, b.y - game.player.y) < b.r + game.player.r){
        game.bossBullets.splice(i,1);
        playerTakeHit('보스 탄막 피격');
      }
    }
  }

  function checkPlayerCollisions(){
    if(!game.running) return;
    const p = game.player;
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      if(circleRect(p.x,p.y,p.r,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
        game.enemies.splice(i,1);
        playerTakeHit(`${e.type.name} 직접 충돌`);
        break;
      }
    }
  }

  function playerTakeHit(reason){
    const run = game.run;
    if(!run || !game.running) return;
    if(game.player.hitFlash > 0) return;
    if(run.stats.shield > 0){
      run.stats.shield -= 1;
      game.player.hitFlash = 1.2;
      spawnBurst(game.player.x, game.player.y, '#5df0ff', 30);
      spawnText(game.player.x, game.player.y-36, '무적', '#ffe66d');
      setMessage(`보호막 소모: ${reason}. 남은 보호막 ${run.stats.shield}`, 'warn');
      uiDirty = true;
      return;
    }
    if(run.silenceAvailable){
      run.silenceAvailable = false;
      game.player.hitFlash = 1.2;
      spawnBurst(game.player.x, game.player.y, '#ff5769', 54);
      spawnText(game.player.x, game.player.y-36, '침묵', '#ff5769');
      setMessage('자쿠드의 침묵 발동: 보호막 0 상태의 피격을 1회 무효화했습니다.', 'ok');
      uiDirty = true;
      return;
    }
    if(run.revivalAvailable){
      run.revivalAvailable = false;
      run.stats.shield = Math.min(2, run.stats.maxShield);
      game.player.hitFlash = 1.4;
      spawnBurst(game.player.x, game.player.y, '#ffe66d', 70);
      spawnText(game.player.x, game.player.y-40, '부활', '#ffe66d');
      setMessage('자쿠드 재림권 발동: 부활 및 보호막 +2.', 'ok');
      uiDirty = true;
      return;
    }
    failRun(reason);
  }

  function chargeBomb(amount){
    if(!bombUnlocked() || !game.running || !game.run) return;
    const before = game.bombGauge;
    game.bombGauge = clamp(game.bombGauge + amount * game.run.stats.bombChargeMultiplier, 0, 100);
    if(before < 100 && game.bombGauge >= 100){
      game.bombReadyFlash = 1.2;
      setMessage('폭탄 준비 완료. 우하단 게이지 클릭 또는 B 키.', 'ok');
    }
  }

  function useBomb(){
    if(!bombUnlocked()){ setMessage('폭탄은 5-1부터 열립니다.', 'warn'); return; }
    if(!game.running || !game.run){ setMessage('출격 중에만 사용할 수 있습니다.', 'warn'); return; }
    if(game.bombGauge < 100){ setMessage(`폭탄 게이지 부족: ${Math.floor(game.bombGauge)}%`, 'warn'); return; }
    game.bombGauge = 0;
    game.bossBullets = [];
    game.warnings = [];
    for(const e of game.enemies){
      e.hp = Math.max(1, e.hp * 0.5);
      e.hurt = 0.22;
      spawnBurst(e.x, e.y, '#ffffff', 8);
    }
    if(game.boss){
      const capDamage = game.boss.maxHp * 0.008;
      damageBoss(capDamage, false, 'bomb');
    }
    save.stats.bombsUsed = (save.stats.bombsUsed || 0) + 1;
    setMessage('폭탄 발동: 화면 내 탄막 삭제, 일반 적 HP 절반 감소.', 'ok');
    spawnBurst(game.player.x, game.player.y, '#ffffff', 54);
    uiDirty = true;
  }

  function bombButtonRect(){ return {x:W-142,y:H-128,w:126,h:52}; }

  function damageEnemy(e, amount, crit=false, weapon='front', enhanced=false){
    if(!game.running) return;
    if(e.shielded){
      const pierce = save.skillTree.shieldBreak || isEquipped('anti_bitik_charm') || weapon === 'laser';
      if(!pierce){
        e.shielded = false;
        e.hurt = 0.16;
        spawnBurst(e.x,e.y,'#7f8cff',14);
        spawnText(e.x,e.y-18,'방패','#d1d5ff');
        return;
      }
      e.shielded = false;
      amount *= 1.35;
    }
    if(e.damageReduction){
      let reduction = e.damageReduction;
      if(save.skillTree.shieldBreak || weapon === 'laser' || enhanced) reduction *= 0.45;
      amount *= Math.max(0.20, 1 - reduction);
      if(e.typeKey === 'armor' && !enhanced) spawnText(e.x,e.y-18,'장갑','#b8c0d6');
    }
    const dealt = Math.min(e.hp, amount);
    e.hp -= amount;
    chargeBomb(dealt / (stageBaseNormalHp(game.stage) * 160) * 100);
    e.hurt = 0.10;
    if(crit) spawnText(e.x,e.y-14,'CRIT','#ff5de1');
    if(enhanced) spawnText(e.x,e.y+12,'강화','#ffe66d');
    if(e.hp <= 0) destroyEnemy(e);
  }

  function destroyEnemy(e){
    const idx = game.enemies.indexOf(e);
    if(idx >= 0) game.enemies.splice(idx,1);
    let reward = enemyKuReward(e.maxHp, game.run.stats.kuGainMultiplier);
    if(save.skillTree.antiBitikScan && ['bitik','shield','healer','barrier','armor'].includes(e.typeKey)) reward = Math.floor(reward * 1.20);
    game.run.kuEarned += reward;
    game.run.kills += 1;
    save.stats.tilesDestroyed += 1;
    spawnBurst(e.x,e.y,e.type.color,18);
    chargeBomb(0.03);
    if(e.typeKey === 'split'){
      for(let lane=0; lane<4; lane++){
        const frag = createEnemy('basic', lane, e.y - rand(20,60));
        frag.hp = Math.max(2, Math.floor(e.maxHp * 0.28));
        frag.maxHp = frag.hp;
        frag.speed *= 1.18;
        game.enemies.push(frag);
      }
      setMessage('연타수저 분열: 파편 4칸 추가.', 'warn');
    }
    if(game.run.kills >= game.nextKillPowerup && !game.powerupOpen && game.running){
      game.nextKillPowerup += 8 + game.powerupCount * 7;
      offerPowerups(() => {}, `${game.run.kills}킬 달성. KU 노동자의 파워업 선택.`);
    }
    uiDirty = true;
  }

  function hitBossWithProjectile(p){
    const b = game.boss;
    if(!b) return false;
    if(circleRect(p.x,p.y,p.r,b.x-b.w/2,b.y-b.h/2,b.w,b.h)){
      const dmg = p.dmg * game.run.stats.bossDamageMultiplier;
      damageBoss(dmg, p.crit, p.weapon || 'front');
      return true;
    }
    return false;
  }

  function damageBoss(amount, crit=false, weapon='front'){
    const b = game.boss;
    if(!b) return;
    if(b.chapter === 1 && b.shieldUsed && amount > b.maxHp * 0.06){
      amount *= save.skillTree.oneTryDeny ? 0.65 : 0.35;
      b.shieldUsed = false;
      spawnText(b.x,b.y-38,'방패 약화','#ffe66d');
    }
    const dealt = Math.min(b.hp, amount);
    b.hp -= amount;
    chargeBomb(dealt / (stageBaseNormalHp(game.stage) * 160) * 100);
    b.hitFlash = 0.10;
    if(crit) spawnText(b.x,b.y-50,'BOSS CRIT','#ff5de1');
    if(b.hp <= 0){
      const reward = roundNice(bossKuReward(b.maxHp, game.run.stats.kuGainMultiplier) * (b.mini ? 0.55 : 1));
      const ds = bossDsReward(b);
      game.run.kuEarned += reward;
      game.run.dsEarned = (game.run.dsEarned || 0) + ds;
      game.run.bossesKilled += 1;
      save.stats.bossKills += 1;
      spawnBurst(b.x,b.y,'#ffe66d',80);
      chargeBomb(b.mini ? 4 : 8);
      setMessage(`${b.name} 격파. ${format(reward)} KU / ${format(ds)} DS 보상.`, 'ok');
      game.boss = null;
      game.bossBullets = [];
      game.warnings = game.warnings.filter(w => w.type !== 'lane');
      setTimeout(() => { if(game.running && game.phase && (game.phase.type === 'boss' || game.phase.type === 'miniboss')) phaseComplete(); }, 60);
    }
    uiDirty = true;
  }

  function missileExplosion(x,y,enhanced,dmg,crit){
    const radius = (enhanced ? 74 : 42) * (game.run ? game.run.stats.missileExplosionMultiplier : 1);
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      if(Math.hypot(e.x-x,e.y-y) < radius){
        damageEnemy(e, dmg, crit, 'missile', enhanced);
      }
    }
    if(game.boss && Math.hypot(game.boss.x-x,game.boss.y-y) < radius + game.boss.w/2){
      damageBoss(dmg * 0.8 * game.run.stats.bossDamageMultiplier, crit, 'missile');
    }
    spawnBurst(x,y,enhanced ? '#ffe66d' : '#ffd166', enhanced ? 28 : 16);
  }

  function circleRect(cx,cy,r,rx,ry,rw,rh){
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    return Math.hypot(cx - nx, cy - ny) <= r;
  }

  function distPointToSegment(px,py,x1,y1,x2,y2){
    const dx = x2-x1, dy=y2-y1;
    const l2 = dx*dx + dy*dy || 1;
    let t = ((px-x1)*dx + (py-y1)*dy) / l2;
    t = clamp(t,0,1);
    return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
  }

  function spawnBurst(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = rand(0, Math.PI*2);
      const s = rand(30, 190);
      game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.18,.65),maxLife:.65,color,size:rand(1.5,4)});
    }
  }

  function spawnText(x,y,text,color){
    game.particles.push({x,y,vx:0,vy:-34,life:.75,maxLife:.75,color,text,size:12});
  }

  function updateParticles(dt){
    for(let i=game.particles.length-1; i>=0; i--){
      const p = game.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 60 * dt;
      p.life -= dt;
      if(p.life <= 0) game.particles.splice(i,1);
    }
  }

  function offerPowerups(after, title){
    if(!game.running || game.powerupOpen) return;
    if(game.powerupCount >= 7){ if(typeof after === 'function') after(); return; }
    game.powerupOpen = true;
    game.paused = true;
    game.afterPowerup = after || (() => {});
    game.offeredPowerups = generatePowerups(3);
    game.powerupCount += 1;
    renderPowerCards(title);
    el.powerupModal.classList.add('show');
    el.powerupModal.setAttribute('aria-hidden','false');
    setMessage(title || '파워업 선택. 카드 클릭 또는 숫자키 1~3.', 'warn');
  }

  function hidePowerup(){
    game.powerupOpen = false;
    el.powerupModal.classList.remove('show');
    el.powerupModal.setAttribute('aria-hidden','true');
    el.powerCards.innerHTML = '';
  }

  function generatePowerups(count){
    const selected = [];
    const candidates = powerups.map(p => ({...p, dynamicWeight:dynamicPowerWeight(p)}));
    while(selected.length < count && candidates.length){
      const total = candidates.reduce((s,p)=>s+p.dynamicWeight,0);
      let r = Math.random() * total;
      let idx = 0;
      for(; idx<candidates.length; idx++){
        r -= candidates[idx].dynamicWeight;
        if(r <= 0) break;
      }
      selected.push(candidates[idx]);
      candidates.splice(idx,1);
    }
    return selected;
  }

  function dynamicPowerWeight(p){
    let w = p.weight;
    const run = game.run;
    if(!run) return w;
    if(p.type === 'weapon'){
      if(save.skillTree.repeatMastery) w *= 1.22;
      const level = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      if(level >= max) w *= 0.55;
      else if(level < weaponMax[p.key].base) w *= 1.08;
    }
    if(p.id === 'shield'){
      if(run.stats.shield <= 0) w += 10;
      if(run.stats.shield >= run.stats.maxShield) w *= 0.25;
    }
    if(game.phase && (game.phase.type === 'boss' || game.phase.type === 'miniboss')){
      if(['missile','laser','attack'].includes(p.id)) w *= 1.22;
    }
    return Math.max(1, w);
  }

  function renderPowerCards(title){
    const cards = game.offeredPowerups.map((p, i) => {
      const meta = powerMeta(p);
      const desc = powerDesc(p);
      return `<button class="powerCard" data-index="${i}" aria-label="${p.name}">
        <div class="powerIcon">${p.icon}</div>
        <div class="powerTitle">${i + 1}. ${p.name}</div>
        <div class="powerDesc">${escapeHtml(desc)}</div>
        <div class="powerMeta">${escapeHtml(meta)}</div>
      </button>`;
    }).join('');
    el.powerCards.innerHTML = cards;
    el.powerCards.querySelectorAll('.powerCard').forEach(btn => {
      btn.addEventListener('click', () => choosePowerup(Number(btn.dataset.index)));
    });
  }

  function powerMeta(p){
    const run = game.run;
    if(!run) return '';
    if(p.type === 'weapon'){
      const lv = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      const baseMax = weaponMax[p.key].base;
      if(lv >= max) return `현재 Lv.${lv} / MAX — 선택 시 피해 강화`;
      if(lv >= baseMax && run.levelBreakthrough) return `현재 Lv.${lv} → Lv.${lv+1} / 강화 구간`;
      if(lv >= baseMax && !run.levelBreakthrough) return `현재 Lv.${lv} / 기본 MAX — 선택 시 피해 강화`;
      return `현재 Lv.${lv} → Lv.${lv+1}`;
    }
    if(p.id === 'shield') return `현재 보호막 ${run.stats.shield}/${run.stats.maxShield}`;
    if(p.id === 'critChance') return `현재 ${Math.round(run.stats.critChance*100)}%`;
    if(p.id === 'critDamage') return `현재 ${Math.round(run.stats.critDamage*100)}%`;
    if(p.id === 'bounce') return `현재 ${run.stats.bounce}회 반사`;
    return '중첩 가능';
  }

  function powerDesc(p){
    const run = game.run;
    if(p.type === 'weapon' && run){
      const lv = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      if(lv >= max) return `${p.desc}
MAX 피해 +15%`;
      if(lv >= weaponMax[p.key].base && run.levelBreakthrough) return `${p.desc}
강화 구간: 일반탄 대신 강화탄`;
      if(lv >= weaponMax[p.key].base && !run.levelBreakthrough) return `${p.desc}
돌파 전: 피해 강화`;
    }
    return p.desc;
  }

  function choosePowerup(index){
    if(!game.powerupOpen) return;
    const p = game.offeredPowerups[index];
    if(!p) return;
    applyPowerup(p);
    const after = game.afterPowerup || (() => {});
    hidePowerup();
    game.paused = false;
    game.afterPowerup = null;
    after();
    uiDirty = true;
  }

  function applyPowerup(p){
    const run = game.run;
    if(!run) return;
    if(p.type === 'weapon'){
      const lv = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      if(lv < max){
        run.weapons[p.key] += 1;
        if(lv === 0 && p.key === 'missile') game.missileTimer = clamp(1.02 / run.stats.fireRateMultiplier, 0.34, 1.05);
        if(lv === 0 && p.key === 'laser') game.laserTimer = clamp(2.05 / run.stats.fireRateMultiplier, 0.48, 2.1);
        const enhanced = run.weapons[p.key] > weaponMax[p.key].base;
        setMessage(`${p.name} Lv.${run.weapons[p.key]}${enhanced ? ' — 강화 전용 구간 진입' : ''}`, 'ok');
      }else{
        run.weaponBonus[p.key] *= 1.15;
        setMessage(`${p.name} MAX 초과: 해당 무기 피해 +15%`, 'ok');
      }
      return;
    }
    switch(p.id){
      case 'attack': run.stats.attackMultiplier *= 1.18; setMessage('공격력 증가. 잠재력이 실력으로 환전되었습니다.', 'ok'); break;
      case 'fireRate': run.stats.fireRateMultiplier *= 1.14; setMessage('공격속도 증가. 손목이 적응했습니다.', 'ok'); break;
      case 'bounce': run.stats.bounce += 1; setMessage(`벽에 튕기기 +1. 현재 ${run.stats.bounce}회 반사.`, 'ok'); break;
      case 'critChance': run.stats.critChance = Math.min(0.7, run.stats.critChance + 0.05); setMessage(`크리티컬 확률 ${Math.round(run.stats.critChance*100)}%.`, 'ok'); break;
      case 'critDamage': run.stats.critDamage += 0.25; setMessage(`크리티컬 대미지 ${Math.round(run.stats.critDamage*100)}%.`, 'ok'); break;
      case 'shield': run.stats.shield = Math.min(run.stats.maxShield, run.stats.shield + 1); setMessage(`보호막 +1. 현재 ${run.stats.shield}/${run.stats.maxShield}.`, 'ok'); break;
    }
  }

  function rollGrade(rates){
    let r = Math.random();
    for(const [grade,prob] of rates){
      r -= prob;
      if(r <= 0) return grade;
    }
    return rates[rates.length - 1][0];
  }

  function rollPart(boxId){
    const box = gachaBoxes[boxId];
    if(!box) return null;
    let grade;
    if(boxId === 'superTalent'){
      save.gachaPitySuper = (save.gachaPitySuper || 0) + 1;
      if(save.gachaPitySuper >= 10){
        grade = 'epic';
        save.gachaPitySuper = 0;
      }else{
        grade = rollGrade(box.rates);
        if(grade === 'epic') save.gachaPitySuper = 0;
      }
    }else{
      grade = rollGrade(box.rates);
    }
    const kind = pick(Object.keys(partKinds));
    const type = pick(Object.keys(partTypes));
    addPart(kind,type,grade,1);
    save.stats.gachaPulls = (save.stats.gachaPulls || 0) + 1;
    return {kind,type,grade,name:partName(kind,type,grade)};
  }

  function drawGacha(boxId, count){
    const box = gachaBoxes[boxId];
    if(!box) return;
    if(boxId === 'talent' && !gachaTalentUnlocked()){ setMessage('재능 상자는 1-3부터 열립니다.', 'warn'); return; }
    if(boxId === 'superTalent' && !gachaSuperUnlocked()){ setMessage('슈퍼 재능 상자는 4-1부터 열립니다.', 'warn'); return; }
    const cost = box.cost * count;
    if((save.ja || 0) < cost){ setMessage(`JA 부족: ${format(cost)} JA 필요`, 'warn'); return; }
    save.ja -= cost;
    const results = [];
    for(let i=0;i<count;i++) results.push(rollPart(boxId));
    game.gachaResults = results;
    game.gachaFlash = count >= 10 ? 1.45 : 0.9;
    for(let i=0;i<(count>=10?90:34);i++) spawnBurst(rand(90,W-90), rand(90,H-180), i%3===0?'#ffe66d':(i%3===1?'#ff5de1':'#5df0ff'), 1);
    saveGame('뽑기 저장됨');
    setMessage(`${box.name} ${count}회 뽑기 완료. ${results.map(r=>gradeLabel(r.grade)).join(', ')}`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function partEffectDescription(part){
    const type = partTypes[part.type];
    const grade = part.grade;
    const gradeName = gradeLabel(grade);
    const jetShield = { common:50, uncommon:100, rare:100, hero:100, epic:150, legend:200, jakud:200 };
    const bulletDamage = { common:1.5, uncommon:2.5, rare:2.5, hero:2.5, epic:3.5, legend:5.0, jakud:5.0 };
    const startLevel = { common:0, uncommon:0, rare:0, hero:1, epic:1, legend:1, jakud:2 };
    if(part.kind === 'jet'){
      const start = startLevel[grade] || 0;
      let text = `${type.name} 제트기 · ${gradeName}: 시작 보호막 확률 +${jetShield[grade] || 0}%`;
      if(start) text += `, ${weaponNames[type.weapon]} 시작 Lv.+${start}`;
      if(grade === 'jakud') text += ', 추가 부활 +1 및 자쿠드 특수 효과';
      return text;
    }
    if(part.kind === 'bullet'){
      const start = startLevel[grade] || 0;
      let text = `${type.name} 총알 · ${gradeName}: ${weaponNames[type.weapon]} 피해 ×${bulletDamage[grade] || 1}`;
      if(start) text += `, ${weaponNames[type.weapon]} 시작 Lv.+${start}`;
      if(grade === 'jakud') text += ', 다른 무기 피해 ×2 및 자쿠드 특수 효과';
      return text;
    }
    return `${type.label}: ${gradeName}`;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawGachaFlash();
    drawLanes();
    drawWarnings();
    drawEnemies();
    drawBoss();
    drawLasers();
    drawBullets();
    drawMissiles();
    drawBossBullets();
    drawPlayer();
    drawParticles();
    drawHUD();
    if(!game.running) drawIdleOverlay();
    if(game.paused && game.running && !game.powerupOpen) drawPauseOverlay();
  }

  function drawGachaFlash(){
    if(game.gachaFlash <= 0) return;
    game.gachaFlash = Math.max(0, game.gachaFlash - 0.035);
    const a = clamp(game.gachaFlash, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.10 * a;
    ctx.fillStyle = '#ffe66d';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 0.55 * a;
    ctx.strokeStyle = '#ff5de1';
    ctx.lineWidth = 4;
    for(let i=0;i<7;i++){
      ctx.beginPath();
      ctx.arc(W/2,H/2,40 + i*55 + Math.sin(performance.now()*0.004+i)*12,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBackground(){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#050814'); grad.addColorStop(1,'#081226');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 0.24;
    ctx.strokeStyle = '#163156'; ctx.lineWidth = 1;
    for(let y=0;y<H;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for(let x=0;x<W;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const t = performance.now() * 0.00005;
    for(let i=0;i<42;i++){
      const x = (i * 97 + Math.sin(i)*33) % W;
      const y = (i * 71 + (performance.now()*0.018*(i%3+1))) % H;
      ctx.fillStyle = i%5===0 ? 'rgba(255,230,109,.55)' : 'rgba(93,240,255,.35)';
      ctx.fillRect(Math.floor(x), Math.floor(y), 2, 2);
    }
  }

  function drawLanes(){
    const laneW = W/4;
    for(let i=1;i<4;i++){
      ctx.strokeStyle = 'rgba(93,240,255,.23)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(i*laneW,0); ctx.lineTo(i*laneW,H); ctx.stroke();
    }
    for(let i=0;i<4;i++){
      ctx.fillStyle = 'rgba(93,240,255,.05)';
      ctx.fillRect(i*laneW+2,0,laneW-4,H);
      ctx.fillStyle = 'rgba(139,164,200,.38)';
      ctx.font = '12px Pretendard, Arial, sans-serif'; ctx.textAlign='center';
      ctx.fillText(`LANE ${i+1}`, i*laneW + laneW/2, 22);
    }
  }

  function drawWarnings(){
    for(const w of game.warnings){
      if(w.type === 'lane'){
        const active = w.warnTime <= 0;
        ctx.globalAlpha = active ? 0.48 : 0.18 + Math.sin(performance.now()*0.02)*0.08;
        ctx.fillStyle = w.color;
        ctx.fillRect(w.x, 0, w.w, H);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = w.color;
        ctx.lineWidth = active ? 5 : 2;
        ctx.strokeRect(w.x+3, 3, w.w-6, H-6);
      }else if(w.type === 'sweep'){
        ctx.globalAlpha = w.warnTime > 0 ? 0.25 : 0.72;
        ctx.fillStyle = w.color;
        ctx.fillRect(w.x - 18,0,36,H);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawEnemies(){
    for(const e of game.enemies){
      const x = Math.round(e.x - e.w/2), y = Math.round(e.y - e.h/2);
      const hpRatio = clamp(e.hp / Math.max(1, e.maxHp || e.hp), 0, 1);
      const density = clamp((e.hpTier || 1) / 3, 0.15, 1);
      ctx.save();
      ctx.shadowColor = e.type.color; ctx.shadowBlur = e.hurt > 0 ? 18 : 7 + density * 7;
      ctx.fillStyle = '#071124'; ctx.fillRect(x,y,e.w,e.h);
      ctx.globalAlpha = 0.12 + 0.36 * hpRatio + 0.12 * density;
      ctx.fillStyle = e.type.color; ctx.fillRect(x+4,y+4,e.w-8,e.h-8); ctx.globalAlpha=1;
      ctx.strokeStyle = e.shielded ? '#ffffff' : e.type.border; ctx.lineWidth = e.shielded ? 4 : (2 + Math.floor(density*2)); ctx.strokeRect(x+1,y+1,e.w-2,e.h-2);
      ctx.globalAlpha = 0.45 + hpRatio * 0.55;
      drawPixelCorners(x,y,e.w,e.h,e.type.border);
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Pretendard, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(format(Math.max(0, e.hp)), e.x, e.y + 5);
      ctx.font = 'bold 13px Pretendard, Arial, sans-serif'; ctx.fillStyle = e.type.border;
      ctx.fillText(e.type.icon, e.x, e.y - 17);
      if(e.shielded){ ctx.font = '10px Pretendard, Arial, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('SHIELD', e.x, e.y + 22); }
      ctx.restore();
    }
  }

  function drawPixelCorners(x,y,w,h,color){
    ctx.fillStyle = color;
    const s = 6;
    ctx.fillRect(x,y,s,2); ctx.fillRect(x,y,2,s);
    ctx.fillRect(x+w-s,y,s,2); ctx.fillRect(x+w-2,y,2,s);
    ctx.fillRect(x,y+h-2,s,2); ctx.fillRect(x,y+h-s,2,s);
    ctx.fillRect(x+w-s,y+h-2,s,2); ctx.fillRect(x+w-2,y+h-s,2,s);
  }

  function drawBoss(){
    const b = game.boss;
    if(!b) return;
    const x = b.x - b.w/2, y = b.y - b.h/2;
    ctx.save();
    ctx.shadowColor = b.hitFlash > 0 ? '#ff5de1' : '#ff5769'; ctx.shadowBlur = b.hitFlash > 0 ? 28 : 14;
    ctx.fillStyle = b.mini ? '#22152d' : '#2b1020';
    ctx.fillRect(x,y,b.w,b.h);
    ctx.strokeStyle = b.mini ? '#ffd166' : '#ff5769'; ctx.lineWidth = b.mini ? 3 : 4; ctx.strokeRect(x,y,b.w,b.h);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    for(let i=0;i<8;i++) ctx.fillRect(x + i*b.w/8 + 4, y+8, 8, b.h-16);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font='bold 16px Pretendard, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.name, b.x, b.y-4);
    ctx.font='12px Pretendard, Arial, sans-serif'; ctx.fillStyle=colors.muted; ctx.fillText(b.rage ? '발악 패턴' : (b.mini ? 'MINI BOSS' : 'BOSS'), b.x, b.y+18);
    const barW = W - 60;
    const hpRatio = clamp(b.hp/b.maxHp,0,1);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(30,52,barW,12);
    ctx.fillStyle = b.rage ? '#ff5de1' : '#ff5769'; ctx.fillRect(30,52,barW*hpRatio,12);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeRect(30,52,barW,12);
    ctx.restore();
  }

  function drawBullets(){
    for(const b of game.bullets){
      ctx.save();
      ctx.shadowColor = b.enhanced ? '#ffe66d' : (b.crit ? '#ff5de1' : '#5df0ff');
      ctx.shadowBlur = b.enhanced ? 14 : 8;
      ctx.fillStyle = b.enhanced ? '#ffe66d' : (b.crit ? '#ff5de1' : '#bdfbff');
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawMissiles(){
    for(const m of game.missiles){
      for(const t of m.trail){
        ctx.globalAlpha = clamp(t.life / 0.25, 0, 1) * (m.enhanced ? 0.62 : 0.42);
        ctx.fillStyle = m.enhanced ? '#ff5de1' : '#ffd166';
        ctx.beginPath(); ctx.arc(t.x,t.y,m.r*(m.enhanced?0.95:0.7),0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(m.x,m.y);
      ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);
      ctx.shadowColor = m.enhanced ? '#ff5de1' : '#ffd166'; ctx.shadowBlur = m.enhanced ? 24 : 12;
      if(m.enhanced){
        ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,m.r*1.7,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#ff5de1';
        ctx.beginPath(); ctx.moveTo(0,-m.r*2.2); ctx.lineTo(m.r*1.25, m.r*1.2); ctx.lineTo(0,m.r*.55); ctx.lineTo(-m.r*1.25,m.r*1.2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-m.r*.35,-m.r*.7,m.r*.7,m.r*1.5);
        ctx.fillStyle = '#ffe66d'; ctx.fillRect(-m.r*1.2,m.r*.7,m.r*.7,m.r*.35); ctx.fillRect(m.r*.5,m.r*.7,m.r*.7,m.r*.35);
      }else{
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.moveTo(0,-m.r*1.6); ctx.lineTo(m.r, m.r); ctx.lineTo(-m.r,m.r); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawLasers(){
    for(const l of game.lasers){
      const ex = l.x + Math.cos(l.angle) * 1000;
      const ey = l.y + Math.sin(l.angle) * 1000;
      ctx.save();
      ctx.globalAlpha = clamp(l.duration / 0.25, 0.25, 1);
      ctx.shadowColor = l.enhanced ? '#ffe66d' : '#5df0ff'; ctx.shadowBlur = l.enhanced ? 26 : 16;
      ctx.strokeStyle = l.enhanced ? '#ffe66d' : '#5df0ff'; ctx.lineWidth = l.width;
      ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2,l.width*0.32); ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.restore();
    }
  }


  function drawBossBullets(){
    for(const b of game.bossBullets){
      ctx.save();
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(b.x - b.r*0.25,b.y - b.r*0.25,Math.max(1.5,b.r*0.34),0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function drawPlayer(){
    const p = game.player;
    const run = game.run;
    ctx.save();
    if(p.hitFlash > 0){
      ctx.globalAlpha = 0.35 + 0.65 * (Math.sin(performance.now()*0.045) > 0 ? 1 : 0.25);
    }
    if(run && run.weapons.missile > 0){
      drawCompanion(p.x - 35, p.y + 6);
      drawCompanion(p.x + 35, p.y + 6);
    }
    ctx.translate(p.x,p.y);
    ctx.shadowColor = p.hitFlash > 0 ? '#ff5769' : '#5df0ff'; ctx.shadowBlur = p.hitFlash > 0 ? 24 : 12;
    ctx.fillStyle = p.hitFlash > 0 ? '#ffccd2' : '#bdfbff';
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(15,15); ctx.lineTo(0,8); ctx.lineTo(-15,15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5df0ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffe66d'; ctx.fillRect(-4,0,8,9);
    ctx.restore();
    if(p.hitFlash > 0){
      ctx.fillStyle = '#ffe66d'; ctx.font = 'bold 11px Pretendard, Arial, sans-serif'; ctx.textAlign='center'; ctx.fillText('무적', p.x, p.y - 30);
    }
    if(run && run.stats.shield > 0){
      ctx.save();
      ctx.strokeStyle = run.stats.shield > 1 ? '#ffe66d' : '#5df0ff';
      ctx.lineWidth = 2 + run.stats.shield;
      ctx.globalAlpha = 0.55 + Math.sin(performance.now()*0.008)*0.1;
      ctx.beginPath(); ctx.arc(p.x,p.y,24 + run.stats.shield*2,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawCompanion(x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle = '#7f8cff'; ctx.strokeStyle = '#d1d5ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(10,10); ctx.lineTo(0,5); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawParticles(){
    for(const p of game.particles){
      const alpha = clamp(p.life / (p.maxLife || .65), 0, 1);
      ctx.globalAlpha = alpha;
      if(p.text){
        ctx.fillStyle = p.color; ctx.font = 'bold 12px Pretendard, Arial, sans-serif'; ctx.textAlign='center'; ctx.fillText(p.text,p.x,p.y);
      }else{
        ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,p.size,p.size);
      }
      ctx.globalAlpha = 1;
    }
  }

  function phaseProgressRatio(){
    if(!game.running || !game.phase || !game.sequence.length) return 0;
    let local = 0;
    if(game.phase.type === 'wave') local = game.phase.target ? clamp(game.phase.spawned / game.phase.target, 0, 1) : 0;
    else if(game.boss) local = 1 - clamp(game.boss.hp / game.boss.maxHp, 0, 1);
    else local = 1;
    return clamp((game.phaseIndex + local) / game.sequence.length, 0, 1);
  }

  function drawHUD(){
    ctx.save();
    if(game.running && game.run){
      const prog = phaseProgressRatio();
      ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fillRect(20,28,W-40,12);
      ctx.fillStyle = 'rgba(93,240,255,.25)'; ctx.fillRect(22,30,W-44,8);
      ctx.fillStyle = '#5df0ff'; ctx.fillRect(22,30,(W-44)*prog,8);
      ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.strokeRect(20,28,W-40,12);
      ctx.fillStyle = colors.text; ctx.font = '800 11px Pretendard, Arial, sans-serif'; ctx.textAlign='center';
      ctx.fillText(`WAVE PROGRESS ${Math.floor(prog*100)}%`, W/2, 24);

      const r = game.run;
      ctx.fillStyle = 'rgba(5,8,18,.80)'; ctx.fillRect(18,52,255,126);
      ctx.strokeStyle = 'rgba(93,240,255,.42)'; ctx.lineWidth = 2; ctx.strokeRect(18,52,255,126);
      ctx.fillStyle = '#ffe66d'; ctx.font = '900 14px Pretendard, Arial, sans-serif'; ctx.textAlign='left';
      ctx.fillText(`${game.stage.mode === 'infinite' ? '무한 모드' : '스토리'} ${stageText(game.stage)}`, 30, 75);
      const waveText = game.phase ? `${game.phaseIndex + 1}/${game.sequence.length}` : '-';
      const rows = [
        ['STAGE', stageText(game.stage)],
        ['WAVE', waveText],
        ['KILL', format(r.kills)],
        ['RUN KU', format(r.kuEarned)],
        ['SHIELD', `${r.stats.shield}/${r.stats.maxShield}${game.player.hitFlash>0?' · 무적':''}`]
      ];
      ctx.font = '800 12px Pretendard, Arial, sans-serif';
      rows.forEach((row,idx)=>{
        const y = 98 + idx*15;
        ctx.fillStyle = colors.muted; ctx.fillText(row[0], 30, y);
        ctx.fillStyle = row[0] === 'SHIELD' ? (r.stats.shield>0 ? '#5df0ff' : '#ff5769') : '#ffffff'; ctx.fillText(row[1], 104, y);
      });
      drawBombGauge();
    }

    ctx.fillStyle = 'rgba(0,0,0,.52)'; ctx.fillRect(0,H-64,W,64);
    ctx.strokeStyle = 'rgba(93,240,255,.22)'; ctx.beginPath(); ctx.moveTo(0,H-64); ctx.lineTo(W,H-64); ctx.stroke();
    ctx.fillStyle = colors.text; ctx.font = '700 13px Pretendard, Arial, sans-serif'; ctx.textAlign='left';
    if(game.running && game.run){
      const r = game.run;
      ctx.fillText(`JA ${format(r.jaEarned || 0)}  KU ${format(r.kuEarned)}  DS ${format(r.dsEarned || 0)}  KILL ${r.kills}`, 12, H-39);
      ctx.fillText(`SHIELD ${r.stats.shield}/${r.stats.maxShield}  F${r.weapons.front} S${r.weapons.side} M${r.weapons.missile} L${r.weapons.laser}${r.levelBreakthrough?'  BREAK':''}${game.player.hitFlash>0?'  무적':''}`, 12, H-17);
      ctx.textAlign='right';
      const phase = game.phase ? game.phase.label : '작전 중';
      ctx.fillStyle = colors.muted; ctx.fillText(phase, W-12, H-28);
    }else{
      ctx.fillText(`JA ${format(save.ja || 0)} · KU ${format(save.ku)} · DS ${format(save.ds || 0)} · 최고 ${save.highestClearedRank ? stageText(rankToStage(save.highestClearedRank)) : '없음'}`, 12, H-32);
      ctx.textAlign='right'; ctx.fillStyle = colors.muted; ctx.fillText('Space 또는 작전 패널에서 출격', W-12, H-32);
    }
    ctx.restore();
  }

  function drawBombGauge(){
    if(!bombUnlocked()) return;
    const r = bombButtonRect();
    const ready = game.bombGauge >= 100;
    ctx.save();
    ctx.fillStyle = ready ? 'rgba(255,230,109,.24)' : 'rgba(0,0,0,.42)';
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle = ready ? '#ffe66d' : 'rgba(139,164,200,.45)';

    ctx.strokeRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(r.x+8,r.y+28,r.w-16,10);
    ctx.fillStyle = ready ? '#ffe66d' : '#5df0ff'; ctx.fillRect(r.x+8,r.y+28,(r.w-16)*clamp(game.bombGauge/100,0,1),10);
    ctx.textAlign='center'; ctx.font='bold 12px Pretendard, Arial, sans-serif'; ctx.fillStyle = ready ? '#ffe66d' : colors.text;
    ctx.fillText('BOMB', r.x+r.w/2, r.y+18);
    ctx.font='10px Pretendard, Arial, sans-serif'; ctx.fillStyle=colors.muted; ctx.fillText(`${Math.floor(game.bombGauge)}% · B`, r.x+r.w/2, r.y+47);
    ctx.restore();
  }

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(70,170,W-140,210);

    ctx.fillStyle = colors.gold; ctx.font='bold 28px Pretendard, Arial, sans-serif'; ctx.fillText('재능이 없다.', W/2, 226);
    ctx.fillStyle = colors.text; ctx.font='16px Pretendard, Arial, sans-serif'; ctx.fillText('하지만 노재능은 자쿠드를 숭배한다.', W/2, 262);
    ctx.fillStyle = colors.muted; ctx.font='13px Pretendard, Arial, sans-serif';

    ctx.fillText(`다음 출격: ${(save.selectedMode||'story') === 'infinite' ? '무한 모드' : stageText(rankToStage(save.selectedRank))}`, W/2, 330);

  function drawPauseOverlay(){
    ctx.save(); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle=colors.gold; ctx.font='bold 32px Pretendard, Arial, sans-serif'; ctx.fillText('일시정지', W/2, H/2);

  function renderTabs(){
    el.tabs.innerHTML = tabs.map(([id,label]) => `<button class="tabBtn ${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');

  function renderPanel(force=false){
    if(!force && !uiDirty && activeTab !== 'operation') return;
    uiDirty = false;
    if(activeTab === 'operation') renderOperationPanel();
    else if(activeTab === 'gacha') renderGachaPanel();
    else if(activeTab === 'equipment') renderEquipmentPanel();
    else if(activeTab === 'upgrade') renderUpgradePanel();
    else if(activeTab === 'artifact') renderArtifactPanel();
    else if(activeTab === 'skill') renderSkillPanel();
    else if(activeTab === 'info') renderInfoPanel();
    else if(activeTab === 'record') renderRecordPanel();
    else renderInfoPanel();
  }
