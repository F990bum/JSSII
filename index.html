  <style>
    :root {
      --bg0:#050611;
      --bg1:#090b1e;
      --panel:#101428;
      --panel2:#161b34;
      --panel3:#0c1022;
      --line:rgba(149, 167, 255, .22);
      --text:#eef3ff;
      --muted:#a7afca;
      --soft:#7780a5;
      --cyan:#6be8ff;
      --violet:#b079ff;
      --gold:#ffd166;
      --red:#ff4d74;
      --green:#6dff9b;
      --blue:#5ca8ff;
      --shadow:0 18px 60px rgba(0,0,0,.42);
      --radius:18px;
      --font: Pretendard, SUIT, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:radial-gradient(circle at 20% 0%,#182054 0%,transparent 38%),radial-gradient(circle at 80% 10%,#36124f 0%,transparent 34%),linear-gradient(180deg,var(--bg0),var(--bg1));color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
    button,select,input{font:inherit;color:inherit}
    button{border:0;cursor:pointer;user-select:none}
    button:disabled{cursor:not-allowed;opacity:.48;filter:saturate(.55)}
    .app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px;max-width:1540px;margin:0 auto}
    .topbar{min-height:68px;display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(9,12,30,.72);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .brandLogo{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);object-fit:cover;box-shadow:0 0 0 2px rgba(107,232,255,.12),0 0 24px rgba(176,121,255,.22);background:linear-gradient(135deg,#202851,#080a18)}
    .brandTitle{display:flex;flex-direction:column;gap:2px;min-width:0}
    .brandTitle b{font-size:22px;letter-spacing:.09em;white-space:nowrap;text-shadow:0 0 14px rgba(107,232,255,.28)}
    .brandTitle span{color:#cbd4ff;font-size:14px;font-weight:700;white-space:nowrap}
    .topMeta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .pill{min-height:32px;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.055);color:#dce5ff;font-weight:800;white-space:nowrap}
    .saveDot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
    .layout{min-height:0;display:grid;grid-template-columns:minmax(440px,1fr) clamp(420px,30vw,460px);gap:10px}
    .gamePanel,.console,.logbar{border:1px solid var(--line);border-radius:var(--radius);background:rgba(10,13,31,.76);box-shadow:var(--shadow);backdrop-filter:blur(12px);min-width:0}
    .gamePanel{position:relative;min-height:0;overflow:hidden;padding:10px}
    .canvasWrap{position:relative;width:100%;height:100%;min-height:360px;border-radius:14px;overflow:hidden;border:1px solid rgba(107,232,255,.18);background:linear-gradient(180deg,#080b18,#0d1024 54%,#070916)}
    canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:auto}
    .hud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap;pointer-events:none;z-index:5}
    .hudChip{padding:7px 9px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(4,6,18,.62);box-shadow:0 0 18px rgba(0,0,0,.25);min-width:70px;line-height:1.1}
    .hudChip small{display:block;color:#8fa2d4;font-size:11px;font-weight:900;letter-spacing:.08em}
    .hudChip b{display:block;margin-top:3px;font-size:15px;color:#fff;white-space:nowrap}
    .bombBtn{position:absolute;right:16px;bottom:16px;z-index:8;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,209,102,.7);background:radial-gradient(circle,#8c1b31 0%,#2b1020 60%,#0b0918 100%);box-shadow:0 0 28px rgba(255,77,116,.35),inset 0 0 24px rgba(255,209,102,.18);font-weight:1000;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05;text-shadow:0 0 9px #000}
    .bombBtn[hidden]{display:none}
    .bombBtn.ready{animation:pulseBomb 1s infinite}
    .bombBtn span{font-size:11px;color:#ffd166}.bombBtn b{font-size:18px}
    @keyframes pulseBomb{0%,100%{transform:scale(1);box-shadow:0 0 22px rgba(255,77,116,.35)}50%{transform:scale(1.05);box-shadow:0 0 42px rgba(255,209,102,.78)}}
    .centerBanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;min-width:min(520px,92%);max-width:92%;padding:18px 20px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,rgba(10,12,30,.9),rgba(36,18,62,.9));text-align:center;box-shadow:0 18px 70px rgba(0,0,0,.55),0 0 40px rgba(176,121,255,.2);pointer-events:none;opacity:0;transition:opacity .2s ease}
    .centerBanner.show{opacity:1}.centerBanner b{display:block;font-size:24px;margin-bottom:6px;text-shadow:0 0 18px rgba(107,232,255,.32)}.centerBanner span{color:#d7defb;line-height:1.45}
    .powerOverlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(4,5,15,.62);backdrop-filter:blur(4px)}
    .powerOverlay.hidden,.modal.hidden{display:none}
    .powerBox{width:min(860px,96%);border-radius:20px;border:1px solid rgba(255,255,255,.18);padding:18px;background:linear-gradient(180deg,rgba(14,17,42,.96),rgba(8,9,25,.96));box-shadow:0 25px 80px rgba(0,0,0,.6)}
    .powerTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.powerTitle b{font-size:20px}.powerTitle span{color:var(--muted);font-weight:700}
    .powerCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .powerCard{min-height:130px;text-align:left;border-radius:16px;border:1px solid rgba(107,232,255,.22);background:linear-gradient(180deg,rgba(28,34,70,.92),rgba(14,17,38,.92));padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035),0 10px 28px rgba(0,0,0,.26);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
    .powerCard:hover{transform:translateY(-2px);border-color:rgba(107,232,255,.6);box-shadow:0 0 24px rgba(107,232,255,.15),0 10px 28px rgba(0,0,0,.26)}
    .powerIcon{font-size:28px;line-height:1}.powerName{display:block;margin-top:9px;font-weight:1000;font-size:16px}.powerDesc{display:block;margin-top:6px;color:#c2ccf0;line-height:1.3}.powerKey{display:inline-flex;margin-top:10px;color:#111827;background:#d7ebff;border-radius:999px;padding:3px 9px;font-weight:1000}
    .console{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
    .resourceBar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 10px 0}
    .resChip{border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);padding:9px;line-height:1.1;min-width:0}.resChip small{display:block;font-size:11px;font-weight:1000;letter-spacing:.08em}.resChip b{display:block;margin-top:5px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resChip.ja small{color:#9beaff}.resChip.ku small{color:#ffd166}.resChip.ds small{color:#ff7aae}
    .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px}.tabBtn{min-height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);font-size:13px;font-weight:1000;color:#dce5ff}.tabBtn.active{border-color:rgba(107,232,255,.82);box-shadow:0 0 0 1px rgba(107,232,255,.24),0 0 22px rgba(107,232,255,.12);background:linear-gradient(180deg,rgba(34,47,86,.9),rgba(16,21,45,.92))}.tabBtn .badge{display:inline-flex;min-width:17px;height:17px;align-items:center;justify-content:center;border-radius:50%;background:var(--red);font-size:10px;margin-left:3px}

function deepMerge(base, src){
  if(src===undefined || src===null) return structuredCloneSafe(base);
  if(Array.isArray(base)) return Array.isArray(src) ? src.slice() : base.slice();
  if(typeof base === 'object'){
    const out = {};
    Object.keys(base).forEach(k=>out[k]=deepMerge(base[k], src[k]));
    Object.keys(src||{}).forEach(k=>{ if(!(k in out)) out[k]=src[k]; });
    return out;
  }
  return typeof src === typeof base ? src : base;
}
function structuredCloneSafe(obj){ return JSON.parse(JSON.stringify(obj)); }
function normalizeSave(raw){
  const base = defaultSave();
  if(!raw || typeof raw !== 'object') return base;
  if(raw.skillTree && !raw.traits) raw.traits = raw.skillTree;
  if(raw.artifacts && !raw.relics) raw.relics = raw.artifacts;
  if(raw.permanentUpgrades){
    if(raw.permanentUpgrades.antiBitik && !raw.permanentUpgrades.antiTalent) raw.permanentUpgrades.antiTalent = raw.permanentUpgrades.antiBitik;
    if(raw.permanentUpgrades.artifactMastery && !raw.permanentUpgrades.relicMastery) raw.permanentUpgrades.relicMastery = raw.permanentUpgrades.artifactMastery;
  }
  const merged = deepMerge(base, raw);
  merged.version = SAVE_VERSION;
  if(!merged.stats.totalDraws) merged.stats.totalDraws = 0;
  if(!merged.stats.totalSynth) merged.stats.totalSynth = 0;
  return merged;
}
function loadSave(){
  const keys = [SAVE_KEY, SAVE_BACKUP_KEY, ...LEGACY_KEYS];
  for(const key of keys){
    const text = localStorage.getItem(key);
    if(!text) continue;
    try{
      const parsed = JSON.parse(text);
      const s = normalizeSave(parsed);
      if(key !== SAVE_KEY) localStorage.setItem(SAVE_KEY, JSON.stringify(s));
      return s;
    }catch(err){
      try{ localStorage.setItem('jss2_save_corrupt_backup', text); }catch(e){}
    }
  }
  return defaultSave();
}
function storeSave(){

function formatNumber(value){
  const units=[{v:1e21,s:'Sx'},{v:1e18,s:'Qi'},{v:1e15,s:'Qa'},{v:1e12,s:'T'},{v:1e9,s:'B'},{v:1e6,s:'M'},{v:1e3,s:'K'}];
  const num = Number(value)||0;
  const abs = Math.abs(num);
  for(let i=0;i<units.length;i++){
    if(abs>=units[i].v){
      let unitIndex=i, scaled=abs/units[unitIndex].v, text=formatScaledNumber(scaled);
      while(Number(text)>=1000 && unitIndex>0){
        unitIndex--;
        scaled=abs/units[unitIndex].v;
        text=formatScaledNumber(scaled);
      }
      return `${num<0?'-':''}${text}${units[unitIndex].s}`;
    }
  }
  return Math.floor(num).toString();
}
function formatScaledNumber(scaled){
  const digits = scaled>=100 ? 0 : scaled>=10 ? 1 : 2;
  const text = scaled.toFixed(digits);
  return digits===0 ? text : text.replace(/\.?0+$/,'');
}
function roundNice(value){
  if(!isFinite(value) || value<=0) return 0;
  if(value<10) return Math.round(value);
  const exp = Math.pow(10, Math.floor(Math.log10(value)));
  const n = value/exp;
  let nice;
  if(n<1.5) nice=1; else if(n<2.5) nice=2; else if(n<3.5) nice=3; else if(n<5.5) nice=5; else if(n<7.5) nice=7; else nice=10;
  return Math.round(nice*exp);
}
function stageIndexOf(stage){
  if(!stage || stage==='0-0') return 0;
  const m = String(stage).match(/^(\d+)-(\d+)$/);
  if(!m) return 0;
  const c = Number(m[1]), s = Number(m[2]);
  return (c-1)*5+s;
}
function stageFromIndex(idx){ if(idx<=0) return '0-0'; const c=Math.floor((idx-1)/5)+1; const s=((idx-1)%5)+1; return c+'-'+s; }
function chapterOf(idx){ return Math.floor((idx-1)/5)+1; }

function roundRect(ctx,x,y,w,h,r,fill,stroke){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); if(fill) ctx.fill(); if(stroke) ctx.stroke(); }
function drawBoss(ctx){
  const b=game.boss; if(!b) return; ctx.save(); ctx.translate(b.x,b.y); if(b.flash>0){ctx.shadowColor='#ff4d74';ctx.shadowBlur=28;} ctx.fillStyle=b.isMini?'#403213':'#33152b'; roundRect(ctx,-b.w/2,-b.h/2,b.w,b.h,16,true,false); ctx.lineWidth=2; ctx.strokeStyle=b.isMini?'#ffd166':'#ff4d74'; roundRect(ctx,-b.w/2,-b.h/2,b.w,b.h,16,false,true); ctx.fillStyle='#fff'; ctx.font='900 17px '+getComputedStyle(document.body).fontFamily; ctx.textAlign='center'; ctx.fillText(b.name,0,-8); ctx.font='800 13px '+getComputedStyle(document.body).fontFamily; ctx.fillStyle='#ffe6f0'; ctx.fillText(formatNumber(b.hp)+' / '+formatNumber(b.maxHp),0,12); ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(-b.w/2+12,b.h/2-13,b.w-24,6); ctx.fillStyle=b.isMini?'#ffd166':'#ff4d74'; ctx.fillRect(-b.w/2+12,b.h/2-13,(b.w-24)*clamp(b.hp/b.maxHp,0,1),6); ctx.restore(); }
function drawBullets(ctx){
  for(const b of game.bullets){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2); ctx.fillStyle=b.crit?'#fff7d6':b.kind==='trans'?'#ff4d74':b.kind==='enhanced'?'#ffd166':'#65dfff'; ctx.strokeStyle=b.crit?'#ffffff':'rgba(255,255,255,.75)'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=b.crit?22:(b.kind==='normal'?4:12); drawProjectileShape(ctx,equippedBulletType(b.weapon),b.size); if(b.crit){ ctx.rotate(-Math.PI/2); drawCritStar(ctx,0,0,10); } ctx.restore(); }
}
function drawMissiles(ctx){
  for(const m of game.missiles){ ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2); ctx.fillStyle=m.crit?'#fff7d6':m.kind==='trans'?'#ff4d74':m.kind==='enhanced'?'#ffd166':'#8bdcff'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=m.crit?24:12; ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(7,8); ctx.lineTo(-7,8); ctx.closePath(); ctx.fill(); if(m.crit){ ctx.rotate(-Math.PI/2); drawCritStar(ctx,0,0,10); } ctx.restore(); }
}
function drawLasers(ctx){
  for(const l of game.lasers){ ctx.save(); ctx.globalAlpha=clamp(l.life/.12,0,1); ctx.strokeStyle=l.kind==='trans'?'#ff4d74':l.kind==='enhanced'?'#ffd166':'#7fdfff'; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=18; ctx.lineWidth=l.width; ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.stroke(); ctx.restore(); }
}
function drawEnemyBullets(ctx){ for(const b of game.enemyBullets){ ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; } }
function equippedBulletType(weapon){ return getPartById(save.parts.equippedBullet)?.type || WEAPON_TO_TYPE[weapon] || 'A'; }
function drawProjectileShape(ctx,type,size){
  if(type==='B'){
    ctx.beginPath(); ctx.moveTo(0,-size*2.0); ctx.lineTo(size*1.45,size*.6); ctx.lineTo(size*.45,size*1.65); ctx.lineTo(0,size*.7); ctx.lineTo(-size*.45,size*1.65); ctx.lineTo(-size*1.45,size*.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(type==='C'){
    roundRect(ctx,-size*.52,-size*2.0,size*1.04,size*4.0,Math.max(2,size*.25),true,true);
    roundRect(ctx,-size*1.75,-size*.52,size*3.5,size*1.04,Math.max(2,size*.25),true,true);
  } else if(type==='D'){
    roundRect(ctx,-size*1.05,-size*1.9,size*2.1,size*3.25,Math.max(2,size*.35),true,true);
  } else {
    ctx.beginPath(); ctx.moveTo(0,-size*2.25); ctx.lineTo(size*.95,size*1.35); ctx.lineTo(0,size*.78); ctx.lineTo(-size*.95,size*1.35); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawJetShape(ctx,type){
  if(type==='B'){ ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(13,12); ctx.lineTo(0,6); ctx.lineTo(-13,12); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if(type==='C'){ ctx.fillRect(-9,-16,18,28); ctx.fillStyle='#cfefff'; ctx.fillRect(-20,0,8,18); ctx.fillRect(12,0,8,18); }
  else if(type==='D'){ ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(16,0); ctx.lineTo(0,19); ctx.lineTo(-16,0); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(0,-21); ctx.lineTo(15,16); ctx.lineTo(0,7); ctx.lineTo(-15,16); ctx.closePath(); ctx.fill(); ctx.stroke(); }
}
function drawPlayer(ctx,t){
  const p=game.player, run=game.run; let alpha=1; if(run && run.invincibleTimer>0) alpha=.42+.58*(Math.sin(t*34)>0?1:0); const jet=getPartById(save.parts.equippedJet); const type=jet?.type||'A'; const grade=jet?GRADE[jet.grade].color:'#6be8ff';
  if(run && run.weapons.missile>0){ for(const side of [-1,1]){ const ally=allyJetPosition(side); ctx.save(); ctx.globalAlpha=alpha*.72; ctx.translate(ally.x,ally.y); ctx.scale(.48,.48); ctx.shadowColor=grade; ctx.shadowBlur=9; ctx.fillStyle=grade; ctx.strokeStyle='rgba(255,255,255,.78)'; ctx.lineWidth=1.4; drawJetShape(ctx,type); ctx.fillStyle='#ff77a8'; ctx.fillRect(-4,12,8,8); ctx.restore(); } }
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(p.x,p.y); ctx.shadowColor=grade; ctx.shadowBlur=14; ctx.fillStyle=grade; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.5; drawJetShape(ctx,type); ctx.fillStyle='#ff77a8'; ctx.fillRect(-4,12,8,8); ctx.restore();
  if(run && run.shields>0){ ctx.save(); ctx.translate(p.x,p.y); ctx.strokeStyle='rgba(107,232,255,.62)'; ctx.lineWidth=2; ctx.shadowColor='#6be8ff'; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(0,0,24+Math.sin(t*4)*2,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  if(run && run.invincibleTimer>0){ ctx.save(); ctx.translate(p.x,p.y); ctx.strokeStyle=run.reviveFlash>0?'rgba(255,77,116,.95)':'rgba(255,255,255,.72)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,32+Math.sin(t*15)*5,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
}
function drawEffects(ctx){
  for(const p of game.particles){ ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); }
  ctx.globalAlpha=1;
  for(const e of game.effects){
    if(e.type==='text'){ ctx.globalAlpha=clamp(e.life/.8,0,1); ctx.fillStyle=e.color; ctx.font='900 13px '+getComputedStyle(document.body).fontFamily; ctx.textAlign='center'; ctx.fillText(e.text,e.x,e.y-(.8-e.life)*30); ctx.globalAlpha=1; }
    if(e.type==='ring'){ ctx.globalAlpha=clamp(e.life/.65,0,1); ctx.strokeStyle=e.color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(e.x,e.y,(1-e.life/.65)*e.r,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
    if(e.type==='crit'){ ctx.globalAlpha=clamp(e.life/.34,0,1); ctx.fillStyle=e.color; ctx.shadowColor=e.color; ctx.shadowBlur=18; drawCritStar(ctx,e.x,e.y,(1-e.life/.34)*e.r+10); ctx.shadowBlur=0; ctx.globalAlpha=1; }
    if(e.type==='shockwave'){ ctx.globalAlpha=clamp(e.life/.75,0,1); ctx.strokeStyle='#ffd166'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(e.x,e.y,(.75-e.life)*900,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
    if(e.type==='flash'){ ctx.globalAlpha=clamp(e.life/.18,0,1)*.45; ctx.fillStyle='#fff2a8'; ctx.fillRect(0,0,game.width,game.height); ctx.globalAlpha=1; }
    if(e.type==='laneFlash'){ const x=laneX(e.lane), width=laneWidth()+2; ctx.globalAlpha=clamp(e.life/.18,0,1)*.42; ctx.fillStyle=e.color; ctx.fillRect(x-width/2,0,width,game.height); ctx.globalAlpha=1; }
  }
}
function drawCritStar(ctx,x,y,r){
  ctx.beginPath();
  for(let i=0;i<16;i++){ const a=-Math.PI/2+i*Math.PI/8; const rr=i%2?r:r*.42; const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; if(i) ctx.lineTo(px,py); else ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fill();
}
function drawIdleText(ctx,w,h){
  if(game.running) return;
  const cx=playBounds().center;
  ctx.save(); ctx.textAlign='center'; ctx.fillStyle='rgba(238,243,255,.88)'; ctx.font='900 24px '+getComputedStyle(document.body).fontFamily; ctx.fillText('J. S. S. II', cx, h/2-12); ctx.font='700 14px '+getComputedStyle(document.body).fontFamily; ctx.fillStyle='rgba(202,213,255,.72)'; ctx.fillText('작전 탭에서 출격하세요 · Space', cx, h/2+18); ctx.restore();
}
init();
})();
