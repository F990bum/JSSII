<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>J. S. S. II — 재능 격파 시뮬레이터</title>
  <style>
    :root{
      --bg:#070b16;
      --panel:#0d1425;
      --panel2:#111b32;
      --line:#26385e;
      --text:#e6f1ff;
      --muted:#8ba4c8;
      --accent:#5df0ff;
      --accent2:#ff5de1;
      --danger:#ff5769;
      --ok:#70ff9a;
      --warn:#ffd166;
      --gold:#ffe66d;
      --dark:#050812;
      --card:#141f38;
      --shadow:rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at 18% 10%, rgba(93,240,255,.12), transparent 28%),
        radial-gradient(circle at 88% 16%, rgba(255,93,225,.10), transparent 26%),
        linear-gradient(180deg, #060912 0%, #090d19 48%, #050710 100%);
      color:var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow:hidden;
    }
    button, input, select{font:inherit}
    button{
      border:1px solid rgba(93,240,255,.35);
      background:linear-gradient(180deg, #172542, #0c1528);
      color:var(--text);
      border-radius:10px;
      padding:9px 11px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      transition:transform .08s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
    }
    button:hover{border-color:rgba(93,240,255,.9); transform:translateY(-1px)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.45; cursor:not-allowed; transform:none}
    .app{
      display:grid;
      grid-template-rows:auto 1fr auto;
      height:100vh;
      gap:10px;
      padding:10px;
    }
    header{
      min-height:72px;
      border:1px solid rgba(93,240,255,.22);
      background:linear-gradient(90deg, rgba(13,20,37,.96), rgba(10,15,29,.92));
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
    }
    .brand{
      display:grid;
      grid-template-columns:54px 1fr;
      gap:12px;
      align-items:center;
    }
    .logo{
      width:54px;height:54px;
      border:2px solid var(--accent);
      background:
        linear-gradient(90deg, transparent 0 18%, rgba(93,240,255,.18) 18% 22%, transparent 22% 78%, rgba(255,93,225,.16) 78% 82%, transparent 82%),
        linear-gradient(0deg, transparent 0 18%, rgba(93,240,255,.14) 18% 22%, transparent 22% 78%, rgba(255,93,225,.15) 78% 82%, transparent 82%),
        #071124;
      position:relative;
      box-shadow:0 0 18px rgba(93,240,255,.35), inset 0 0 18px rgba(255,93,225,.08);
      image-rendering:pixelated;
    }
    .logo:before{
      content:"J";
      position:absolute; inset:4px;
      display:grid; place-items:center;
      color:var(--gold);
      font-size:32px;
      font-weight:900;
      text-shadow:3px 0 #ff5de1, 0 0 12px rgba(255,230,109,.45);
    }
    .titleBlock h1{margin:0;font-size:28px;letter-spacing:2px;line-height:1.05}
    .titleBlock p{margin:3px 0 0;color:var(--muted);font-size:14px;letter-spacing:.6px}
    .saveState{font-size:12px;color:var(--muted);text-align:right;line-height:1.55}
    .saveState strong{color:var(--accent);font-weight:700}
    .main{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(420px, 1fr) 390px;
      gap:10px;
    }
    .gamePanel,.console{
      min-height:0;
      border:1px solid rgba(93,240,255,.22);
      background:rgba(13,20,37,.9);
      box-shadow:0 18px 42px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .gamePanel{
      display:grid;
      grid-template-rows:1fr;
      position:relative;
    }
    .canvasWrap{
      position:relative;
      display:grid;
      place-items:center;
      padding:10px;
      min-height:0;
    }
    canvas{
      max-width:100%;
      max-height:100%;
      aspect-ratio:640/820;
      background:#050814;
      border:1px solid rgba(93,240,255,.25);
      image-rendering:pixelated;
      cursor:crosshair;
      touch-action:none;
    }
    .powerupModal{
      position:absolute;
      inset:10px;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(3,6,13,.62);
      backdrop-filter: blur(3px);
      z-index:20;
      border:1px solid rgba(255,230,109,.18);
    }
    .powerupModal.show{display:flex}
    .powerupPanel{
      width:min(96%, 920px);
      border:1px solid rgba(255,230,109,.55);
      background:linear-gradient(180deg, rgba(14,20,35,.98), rgba(10,12,22,.98));
      box-shadow:0 0 34px rgba(255,230,109,.20), 0 20px 60px rgba(0,0,0,.45);
      padding:18px;
    }
    .powerupPanel h2{margin:0 0 4px;font-size:22px;color:var(--gold)}
    .powerupPanel .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
    .cards{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    .powerCard{
      min-height:190px;
      padding:15px;
      text-align:left;
      background:
        linear-gradient(180deg, rgba(26,41,73,.98), rgba(13,22,41,.98));
      border-color:rgba(93,240,255,.35);
      border-radius:14px;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:8px;
    }
    .powerCard:hover{border-color:var(--gold); box-shadow:0 0 22px rgba(255,230,109,.22)}
    .powerIcon{font-size:30px;line-height:1}
    .powerTitle{font-size:18px;color:#fff;font-weight:800}
    .powerDesc{font-size:13px;color:var(--muted);line-height:1.5;white-space:pre-line}
    .powerMeta{font-size:12px;color:var(--accent)}
    .console{
      display:grid;
      grid-template-rows:auto 1fr;
    }
    .tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      padding:8px;
      background:rgba(5,8,18,.55);
      border-bottom:1px solid rgba(93,240,255,.18);
    }
    .tabBtn{
      padding:7px 4px;
      font-size:12px;
      border-radius:8px;
      color:var(--muted);
      background:#0a1223;
      border-color:rgba(139,164,200,.18);
      box-shadow:none;
    }
    .tabBtn.active{color:#06101a;background:linear-gradient(180deg,var(--accent),#55b8ff);border-color:transparent;font-weight:800}
    .panelBody{
      overflow:auto;
      padding:12px;
      min-height:0;
    }
    .sectionTitle{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      margin:0 0 10px;
      color:var(--accent);
      font-size:15px;
      letter-spacing:.3px;
    }
    .box{
      border:1px solid rgba(93,240,255,.16);
      background:rgba(7,12,24,.68);
      padding:10px;
      border-radius:12px;
      margin:0 0 10px;
    }
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .statLine{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;margin:7px 0;color:var(--muted)}
    .statLine b{color:var(--text)}
    .bigNumber{font-size:28px;color:var(--gold);font-weight:900;text-shadow:0 0 12px rgba(255,230,109,.25)}
    .mini{font-size:12px;color:var(--muted);line-height:1.55}
    .quote{font-size:13px;line-height:1.65;color:#d8e8ff;background:rgba(255,255,255,.03);border-left:3px solid var(--accent);padding:9px 10px;margin:8px 0}
    .upgradeRow,.artifactRow{
      display:grid;
      grid-template-columns:1fr auto;
      gap:9px;
      align-items:center;
      border:1px solid rgba(139,164,200,.13);
      background:rgba(18,29,52,.5);
      border-radius:11px;
      padding:9px;
      margin:8px 0;
    }
    .upgradeRow h4,.artifactRow h4{margin:0 0 4px;font-size:13px;color:#fff}
    .upgradeRow p,.artifactRow p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .pill{
      display:inline-block;
      border:1px solid rgba(93,240,255,.24);
      color:var(--muted);
      border-radius:999px;
      padding:3px 7px;
      font-size:11px;
      margin:2px 3px 2px 0;
      background:rgba(93,240,255,.05);
    }
    .pill.ok{color:var(--ok);border-color:rgba(112,255,154,.4)}
    .pill.warn{color:var(--warn);border-color:rgba(255,209,102,.45)}
    .pill.danger{color:var(--danger);border-color:rgba(255,87,105,.45)}
    .dangerBtn{border-color:rgba(255,87,105,.45);color:#ffd9de;background:linear-gradient(180deg,#371727,#1a0a11)}
    .goodBtn{border-color:rgba(112,255,154,.45);color:#ddffe7;background:linear-gradient(180deg,#17372c,#0b1a13)}
    .stageControls{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:10px}
    .launchBtn{font-size:16px;font-weight:900;padding:12px;background:linear-gradient(180deg,#2be8ff,#1883ff);color:#04101b;border:0}
    .pauseBtn{background:linear-gradient(180deg,#272e4f,#11172b)}
    .skillTreeWrap{
      position:relative;
      height:520px;
      border:1px solid rgba(93,240,255,.16);
      border-radius:14px;
      background:
        radial-gradient(circle at 50% 17%, rgba(93,240,255,.10), transparent 20%),
        radial-gradient(circle at 50% 68%, rgba(255,230,109,.08), transparent 24%),
        rgba(5,8,18,.70);
      overflow:hidden;
    }
    .skillTreeWrap svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .skillNode{
      position:absolute;
      transform:translate(-50%,-50%);
      width:92px;
      min-height:52px;
      border-radius:15px;
      border:1px solid rgba(139,164,200,.25);
      background:#0b1325;
      color:var(--muted);
      display:grid;
      place-items:center;
      text-align:center;
      font-size:11px;
      line-height:1.25;
      padding:6px;
      z-index:1;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }
    .skillNode.unlocked{border-color:rgba(112,255,154,.75);color:#07120b;background:linear-gradient(180deg,#8fffb1,#42e77a);font-weight:900}
    .skillNode.available{border-color:rgba(255,230,109,.85);color:#fff;box-shadow:0 0 18px rgba(255,230,109,.26)}
    .skillNode.locked:after{content:"🔒";position:absolute;right:5px;top:4px;font-size:11px;opacity:.85}
    .skillNode.core{width:112px;min-height:60px;border-radius:18px;font-size:12px}
    .skillNode.break{width:120px;min-height:64px;border-color:rgba(255,93,225,.55)}
    .bottomBar{
      min-height:42px;
      border:1px solid rgba(93,240,255,.22);
      background:rgba(13,20,37,.92);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:8px 12px;
      color:var(--muted);
      font-size:13px;
      box-shadow:0 -10px 32px rgba(0,0,0,.18);
    }
    .message{color:#d9e9ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kbd{border:1px solid rgba(139,164,200,.35);background:#071124;color:#dfefff;border-radius:6px;padding:1px 6px;font-size:12px}
    .endingModal{
      position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.72);z-index:40;
    }
    .endingModal.show{display:grid}
    .endingCard{
      width:min(92vw, 700px);
      border:1px solid rgba(255,230,109,.55);
      background:linear-gradient(180deg,#111b32,#050814);
      box-shadow:0 0 70px rgba(255,230,109,.18);
      padding:28px;
      text-align:center;
    }
    .endingCard h2{margin:0 0 10px;color:var(--gold);font-size:30px}
    .endingCard p{color:#dbeaff;line-height:1.8;white-space:pre-line}
    @media (max-width: 980px){
      body{overflow:auto}
      .app{height:auto;min-height:100vh}
      .main{grid-template-columns:1fr}
      .console{min-height:560px}
      .tabs{grid-template-columns:repeat(4,1fr)}
      .bottomBar{position:sticky;bottom:0;z-index:25}
    }
    @media (max-width: 640px){
      .app{padding:6px;gap:6px}
      header{padding:8px}
      .brand{grid-template-columns:44px 1fr;gap:9px}
      .logo{width:44px;height:44px}.logo:before{font-size:25px}
      .titleBlock h1{font-size:22px}.titleBlock p{font-size:12px}
      .saveState{display:none}
      .cards{grid-template-columns:1fr}
      .powerCard{min-height:136px}
      .tabs{grid-template-columns:repeat(2,1fr)}
      .stageControls{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand" aria-label="J. S. S. II">
        <div class="logo" title="임시 픽셀 로고"></div>
        <div class="titleBlock">
          <h1>J. S. S. II</h1>
          <p>재능 격파 시뮬레이터</p>
        </div>
      </div>
      <div class="saveState"><strong id="saveStatus">자동 저장 준비</strong><br><span id="versionText">v0.5 playable prototype</span></div>
    </header>

    <main class="main">
      <section class="gamePanel">
        <div class="canvasWrap" id="canvasWrap">
          <canvas id="game" width="640" height="820" aria-label="JSS2 game canvas"></canvas>
          <div class="powerupModal" id="powerupModal" aria-hidden="true">
            <div class="powerupPanel">
              <h2>자쿠드의 3지선다</h2>
              <div class="hint">PC 마우스 클릭 또는 숫자키 <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> 으로 선택합니다. 선택 중 게임은 멈춥니다.</div>
              <div class="cards" id="powerCards"></div>
            </div>
          </div>
        </div>
      </section>

      <aside class="console">
        <nav class="tabs" id="tabs"></nav>
        <div class="panelBody" id="panelBody"></div>
      </aside>
    </main>

    <footer class="bottomBar">
      <div class="message" id="message">재능이 없다. 하지만 KU는 쌓인다.</div>
      <div><span class="kbd">Space</span> 출격/확인 · <span class="kbd">Esc</span> 일시정지 · <span class="kbd">1~3</span> 파워업</div>
    </footer>
  </div>

  <div class="endingModal" id="endingModal">
    <div class="endingCard">
      <h2 id="endingTitle">엔딩</h2>
      <p id="endingText"></p>
      <button id="endingClose" class="launchBtn">확인</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const SAVE_KEY = 'jss2_save_v0_5_0';
  const VERSION = '0.5.0';
  const W = 640;
  const H = 820;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const el = {
    saveStatus: document.getElementById('saveStatus'),
    versionText: document.getElementById('versionText'),
    tabs: document.getElementById('tabs'),
    panelBody: document.getElementById('panelBody'),
    message: document.getElementById('message'),
    powerupModal: document.getElementById('powerupModal'),
    powerCards: document.getElementById('powerCards'),
    endingModal: document.getElementById('endingModal'),
    endingTitle: document.getElementById('endingTitle'),
    endingText: document.getElementById('endingText'),
    endingClose: document.getElementById('endingClose')
  };

  const tabs = [
    ['operation', '작전'], ['status', '상태'], ['upgrade', 'KU 강화'], ['artifact', '아티팩트'],
    ['skill', '스킬트리'], ['scripture', '경전'], ['record', '기록'], ['help', '도움말']
  ];

  const colors = {
    text:'#e6f1ff', muted:'#8ba4c8', accent:'#5df0ff', accent2:'#ff5de1', danger:'#ff5769', ok:'#70ff9a', warn:'#ffd166', gold:'#ffe66d'
  };

  const enemyTypes = {
    basic: { name:'재능충', icon:'T', hp:1.0, speed:1.0, reward:1, color:'#5df0ff', border:'#a9f8ff' },
    fast: { name:'거병', icon:'▶', hp:0.75, speed:1.75, reward:1, color:'#70ff9a', border:'#b9ffd0' },
    bitik: { name:'비틱충', icon:'★', hp:1.95, speed:0.86, reward:3, color:'#ff5de1', border:'#ffc2f2' },
    split: { name:'연타수저', icon:'×', hp:1.18, speed:1.04, reward:2, color:'#ffd166', border:'#ffe9a1' },
    shield: { name:'돈재능', icon:'◇', hp:1.35, speed:0.95, reward:3, color:'#7f8cff', border:'#d1d5ff' },
    jjam: { name:'짬충', icon:'↑', hp:1.10, speed:1.00, reward:2, color:'#ff9f5d', border:'#ffd6ba' },
    healer: { name:'슈퍼재능', icon:'+', hp:1.7, speed:0.84, reward:4, color:'#9dff70', border:'#dbffc9' },
    ranker: { name:'랭커', icon:'R', hp:2.6, speed:0.28, reward:6, color:'#ffffff', border:'#ffe66d' }
  };

  const powerups = [
    { id:'front', icon:'▲', name:'전방 탄환', type:'weapon', key:'front', weight:14, desc:'정면 탄환 레벨을 올립니다.\n기본 최대 Lv.5, 돌파 후 Lv.9.' },
    { id:'side', icon:'↔', name:'측면 탄환', type:'weapon', key:'side', weight:14, desc:'좌우 탄환 레벨을 올립니다.\n양옆 레인 처리력이 증가합니다.' },
    { id:'missile', icon:'◆', name:'미사일', type:'weapon', key:'missile', weight:13, desc:'동료기가 유도 미사일을 발사합니다.\n고HP 적과 보스에게 강합니다.' },
    { id:'laser', icon:'┃', name:'레이저', type:'weapon', key:'laser', weight:13, desc:'주기적으로 관통 레이저를 쏩니다.\n다수 타일 처리에 좋습니다.' },
    { id:'attack', icon:'✦', name:'공격력 증가', type:'stat', weight:10, desc:'모든 무기 피해량 +18%.' },
    { id:'fireRate', icon:'≋', name:'공격속도 증가', type:'stat', weight:10, desc:'탄환/미사일 발사 주기가 감소합니다.\n공격속도 +14%.' },
    { id:'bounce', icon:'⤻', name:'벽에 튕기기', type:'stat', weight:5, desc:'일반 탄환이 좌우 벽에서 1회 더 반사됩니다.' },
    { id:'critChance', icon:'※', name:'크리티컬 확률', type:'stat', weight:7, desc:'치명타 확률 +5%p.\n노재능도 가끔 터집니다.' },
    { id:'critDamage', icon:'✹', name:'크리티컬 대미지', type:'stat', weight:7, desc:'치명타 피해 배율 +25%p.' },
    { id:'shield', icon:'⬡', name:'보호막 생성', type:'stat', weight:7, desc:'보호막 +1.\nHP가 없으므로 사실상 목숨입니다.' }
  ];

  const weaponMax = {
    front: { base:5, break:9 },
    side: { base:4, break:8 },
    missile: { base:4, break:8 },
    laser: { base:4, break:8 }
  };

  const upgradeDefs = [
    { key:'attack', name:'기본 공격력', base:60, max:30, desc:'모든 피해 +8% / Lv' },
    { key:'fireRate', name:'공격속도 훈련', base:70, max:25, desc:'공격속도 +5% / Lv' },
    { key:'moveSpeed', name:'이동속도 훈련', base:55, max:20, desc:'마우스/터치 추적 속도 +5% / Lv' },
    { key:'kuGain', name:'KU 회수력', base:75, max:25, desc:'KU 획득량 +9% / Lv' },
    { key:'critChance', name:'크리티컬 감각', base:90, max:20, desc:'치명타 확률 +1.5%p / Lv' },
    { key:'critDamage', name:'치명타 압축', base:95, max:20, desc:'치명타 피해 +6%p / Lv' },
    { key:'shieldBase', name:'보호막 기초', base:120, max:10, desc:'출격 시 보호막 보정 확률 증가' },
    { key:'bossDamage', name:'보스 분석', base:130, max:20, desc:'보스 피해 +5% / Lv' },
    { key:'antiBitik', name:'비틱 저항', base:145, max:15, desc:'비틱/보호막 계열 약화' },
    { key:'artifactStudy', name:'아티팩트 이해', base:160, max:15, desc:'아티팩트 구매 비용 감소' }
  ];

  const artifactDefs = [

  function defaultSave(){
    const permanentUpgrades = {};
    upgradeDefs.forEach(u => permanentUpgrades[u.key] = 0);

    skillNodes.forEach(n => skillTree[n.id] = false);
    return {
      version: VERSION,
      ku: 0,
      highestClearedRank: 0,
      selectedRank: 1,
      normalEndingSeen: false,
      trueEndingSeen: false,
      permanentUpgrades,
      skillTree,
      artifacts: { owned: [], equipped: [] },

    };

  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return defaultSave();
      const data = JSON.parse(raw);
      const base = defaultSave();
      const merged = deepMerge(base, data);
      merged.version = VERSION;
      if(!Number.isFinite(merged.selectedRank) || merged.selectedRank < 1) merged.selectedRank = Math.max(1, merged.highestClearedRank + 1);
      return merged;
    }catch(err){
      console.warn(err);
      return defaultSave();
    }
  }

  function deepMerge(base, data){
    const out = Array.isArray(base) ? [...base] : {...base};
    for(const k in data){
      if(data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && base[k]) out[k] = deepMerge(base[k], data[k]);
      else out[k] = data[k];
    }
    return out;
  }

  function saveGame(label='자동 저장됨'){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
      el.saveStatus.textContent = label;
      el.saveStatus.style.color = colors.accent;
    }catch(err){
      el.saveStatus.textContent = '저장 실패';
      el.saveStatus.style.color = colors.danger;
      console.error(err);
    }
  }

  function setMessage(text, tone='normal'){
    el.message.textContent = text;
    el.message.style.color = tone === 'danger' ? colors.danger : tone === 'ok' ? colors.ok : tone === 'warn' ? colors.warn : '#d9e9ff';
    messageTimer = 4.5;
  }

  function stageRank(ch, lv){ return (ch - 1) * 5 + lv; }
  function rankToStage(rank){
    const r = clamp(Math.round(rank), 1, 30);
    return { chapter: Math.floor((r - 1) / 5) + 1, level: ((r - 1) % 5) + 1, rank:r };
  }
  function stageText(stage){ return `${stage.chapter}-${stage.level}`; }
  function nextRank(rank){ return clamp(rank + 1, 1, 30); }
  function highestUnlockedRank(){ return clamp(save.highestClearedRank + 1, 1, 30); }

  function chapterName(ch){
    return ['노재능단 입단 시험','비틱 골목','감각파 연구소','랭커 폐허','재능의 대성당','재능단 본부'][ch - 1] || '미확인 구역';
  }

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function rand(min,max){ return min + Math.random() * (max - min); }
  function chance(p){ return Math.random() < p; }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function format(n){ return Math.floor(n).toLocaleString('ko-KR'); }
  function costFormula(base, level){ return Math.floor(base * Math.pow(level + 1, 1.45)); }
  function artifactCost(def){
    const discount = Math.min(0.45, (save.permanentUpgrades.artifactStudy || 0) * 0.025);
    return Math.floor(def.cost * (1 - discount));
  }

  function currentArtifactSlots(){
    let slots = 3;
    if(save.skillTree.artifactSlot) slots += 1;
    if(save.skillTree.trueEndingTrace) slots += 1;
    return slots;
  }

  function isEquipped(id){ return save.artifacts.equipped.includes(id); }
  function isOwned(id){ return save.artifacts.owned.includes(id); }
  function skillUnlocked(id){ return !!save.skillTree[id]; }
  function getNode(id){ return skillNodes.find(n => n.id === id); }

  function nodeAvailable(node){
    if(skillUnlocked(node.id)) return false;
    if(node.id === 'levelBreakthrough' && save.highestClearedRank < stageRank(3,5)) return false;
    const prereq = node.prereq || [];
    if(node.anyPrereqCount){
      const count = prereq.filter(skillUnlocked).length;
      return count >= node.anyPrereqCount;
    }
    return prereq.every(skillUnlocked);
  }

  function buySkill(id){
    const node = getNode(id);
    if(!node || skillUnlocked(id) || !nodeAvailable(node)){
      setMessage('조건이 부족합니다. 자쿠드는 아직 고개를 돌리지 않았습니다.', 'warn');
      return;
    }
    if(save.ku < node.cost){
      setMessage(`KU 부족: ${format(node.cost)} KU 필요`, 'warn');
      return;
    }
    save.ku -= node.cost;
    save.skillTree[id] = true;
    saveGame('스킬 저장됨');
    setMessage(`${node.name.replace(/\n/g,' ')} 습득. ${node.desc}`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function upgradeBuy(key){
    const def = upgradeDefs.find(u => u.key === key);
    if(!def) return;
    const level = save.permanentUpgrades[key] || 0;
    if(level >= def.max){ setMessage('이미 MAX입니다.', 'warn'); return; }
    const cost = costFormula(def.base, level);
    if(save.ku < cost){ setMessage(`KU 부족: ${format(cost)} KU 필요`, 'warn'); return; }
    save.ku -= cost;
    save.permanentUpgrades[key] = level + 1;
    saveGame('강화 저장됨');
    setMessage(`${def.name} Lv.${level + 1}. 조금 덜 노재능이 되었습니다.`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function buyArtifact(id){
    const def = artifactDefs.find(a => a.id === id);
    if(!def || isOwned(id)) return;
    const cost = artifactCost(def);
    if(save.ku < cost){ setMessage(`KU 부족: ${format(cost)} KU 필요`, 'warn'); return; }
    save.ku -= cost;
    save.artifacts.owned.push(id);
    saveGame('아티팩트 저장됨');
    setMessage(`${def.name} 획득. ${def.desc}`, 'ok');
    uiDirty = true;
    renderPanel(true);
  }

  function toggleArtifact(id){
    const def = artifactDefs.find(a => a.id === id);
    if(!def || !isOwned(id)) return;
    if(isEquipped(id)){
      save.artifacts.equipped = save.artifacts.equipped.filter(x => x !== id);
      setMessage(`${def.name} 해제.`, 'normal');
    }else{
      if(save.artifacts.equipped.length >= currentArtifactSlots()){
        setMessage(`장착 슬롯이 부족합니다. 현재 ${currentArtifactSlots()}칸.`, 'warn');
        return;
      }
      const sameGroup = artifactDefs.filter(a => a.group === def.group && isEquipped(a.id));
      if((def.group === 'revival' || def.group === 'economy') && sameGroup.length >= 1){
        setMessage('같은 핵심 계열은 중복 장착할 수 없습니다.', 'warn');
        return;
      }
      if(def.group === 'startWeapon'){
        const startWeaponEquipped = artifactDefs.filter(a => a.group === 'startWeapon' && isEquipped(a.id));
        if(startWeaponEquipped.length >= 2){
          setMessage('시작 무기 레벨 증가 아티팩트는 최대 2개까지 장착됩니다.', 'warn');
          return;
        }
      }
      save.artifacts.equipped.push(id);
      setMessage(`${def.name} 장착.`, 'ok');
    }
    saveGame('장착 저장됨');
    uiDirty = true;
    renderPanel(true);
  }

  function createRun(stage){
    const up = save.permanentUpgrades;
    const st = save.skillTree;
    const equipped = save.artifacts.equipped;
    const has = id => equipped.includes(id);

    const run = {
      stage,
      kuEarned:0,
      kills:0,
      bossesKilled:0,
      weapons:{front:1, side:0, missile:0, laser:0},
      weaponBonus:{front:1, side:1, missile:1, laser:1},
      stats:{
        attackMultiplier:1 + (up.attack || 0) * 0.08,
        fireRateMultiplier:1 + (up.fireRate || 0) * 0.05,
        moveSpeedMultiplier:1 + (up.moveSpeed || 0) * 0.05,
        kuGainMultiplier:1 + (up.kuGain || 0) * 0.09,
        bounce:0,
        critChance:Math.min(0.7, 0.05 + (up.critChance || 0) * 0.015),
        critDamage:1.5 + (up.critDamage || 0) * 0.06,
        shield:0,
        maxShield:3,
        bossDamageMultiplier:1 + (up.bossDamage || 0) * 0.05,
        antiBitik:(up.antiBitik || 0) * 0.03,
        enhancedDamageMultiplier:1
      },
      levelBreakthrough: !!st.levelBreakthrough,
      revivalAvailable:false,
      startedAt:performance.now()
    };

    if(st.noTalentAwakening) run.stats.attackMultiplier += 0.05;
    if(st.jjamAccumulation) run.stats.attackMultiplier += 0.10;
    if(st.rapidFireTraining) run.stats.fireRateMultiplier += 0.08;
    if(st.revelationBoost) run.stats.kuGainMultiplier += 0.10;
    if(st.bossDismantle) run.stats.bossDamageMultiplier += 0.15;
    if(st.enhancedBullet) run.stats.enhancedDamageMultiplier += 0.20;
    if(st.protectionPrayer && chance(0.25)) run.stats.shield += 1;
    if(st.levelBreakthrough) run.stats.maxShield += 1;

    if(has('front_manual')) run.weapons.front = Math.min(run.weapons.front + 1, maxForWeapon('front', run));
    if(has('side_wing')) run.weapons.side = Math.min(run.weapons.side + 1, maxForWeapon('side', run));
    if(has('missile_call')) run.weapons.missile = Math.min(run.weapons.missile + 1, maxForWeapon('missile', run));
    if(has('laser_book')) run.weapons.laser = Math.min(run.weapons.laser + 1, maxForWeapon('laser', run));
    if(has('cracked_shield_charm')) run.stats.shield += 1;
    if(has('ku_rosary')) run.stats.kuGainMultiplier += 0.15;
    if(has('bounce_coin')) run.stats.bounce += 1;
    if(has('boss_stamp')) run.stats.bossDamageMultiplier += 0.20;
    if(has('wrist_guard')) run.stats.fireRateMultiplier += 0.10;
    if(has('pixel_engine')){
      run.stats.moveSpeedMultiplier += 0.15;
      run.stats.fireRateMultiplier += 0.05;
    }
    if(has('anti_bitik_charm')) run.stats.antiBitik += 0.25;
    if(has('jakud_revival')) run.revivalAvailable = true;
    if(has('jakud_fragment')){
      run.stats.attackMultiplier += 0.12;
      run.stats.enhancedDamageMultiplier += 0.12;
    }
    if((up.shieldBase || 0) > 0 && chance(Math.min(0.6, (up.shieldBase || 0) * 0.055))) run.stats.shield += 1;
    run.stats.shield = clamp(run.stats.shield, 0, run.stats.maxShield);
    return run;
  }

  function maxForWeapon(key, run = game.run){
    return run && run.levelBreakthrough ? weaponMax[key].break : weaponMax[key].base;
  }

  function startRun(){
    if(game.running){ setMessage('이미 출격 중입니다.', 'warn'); return; }
    const unlocked = highestUnlockedRank();
    if(save.selectedRank > unlocked){ save.selectedRank = unlocked; }
    const stage = rankToStage(save.selectedRank);
    game.stage = stage;
    game.running = true;
    game.paused = false;
    game.powerupOpen = false;
    game.run = createRun(stage);
    game.enemies = [];
    game.bullets = [];
    game.missiles = [];
    game.bossBullets = [];
    game.particles = [];
    game.lasers = [];
    game.warnings = [];
    game.boss = null;
    game.player.x = W/2;
    game.player.y = H - 82;
    game.player.targetX = W/2;
    game.player.targetY = H - 82;
    game.shootTimer = 0.15;
    game.missileTimer = 0.8;
    game.laserTimer = 1.4;
    game.nextKillPowerup = 5;
    game.powerupCount = 0;
    game.sequence = stageSequence(stage);
    game.phaseIndex = 0;
    save.stats.runs += 1;
    saveGame('출격 저장됨');
    setMessage(`${stageText(stage)} 출격. 재능에 맞서 싸워라.`, 'ok');
    startPhase();
    uiDirty = true;
  }

  function stageSequence(stage){
    const longStage = save.highestClearedRank >= stageRank(3,5) || save.skillTree.levelBreakthrough || stage.rank > stageRank(3,5);
    return longStage ? ['wave','wave','miniboss','wave','wave','boss'] : ['wave','wave','boss'];
  }

  function startPhase(){
    const name = game.sequence[game.phaseIndex];
    if(!name){ completeRun(); return; }
    if(name === 'wave'){
      const ch = game.stage.chapter;
      const lv = game.stage.level;
      const target = clamp(2 + Math.floor((ch + lv) / 2), 2, 7);
      game.phase = { type:'wave', spawned:0, target, spawnTimer:0.2, label:`${game.phaseIndex + 1}번째 웨이브` };
      setMessage(`${game.phase.label}: 4칸 재능 타일 접근 중.`);
    }else{
      spawnBoss(name === 'miniboss');
      game.phase = { type:name, label:name === 'miniboss' ? '미니 보스' : 'BOSS' };
    }
  }

  function phaseComplete(){
    const phase = game.phase;
    if(!phase) return;
    if(phase.type === 'boss'){
      completeRun();
      return;
    }
    const text = phase.type === 'miniboss' ? '미니 보스 격파. 자쿠드가 카드 3장을 던졌습니다.' : '웨이브 정리. 파워업을 선택합니다.';
    offerPowerups(() => {
      game.phaseIndex += 1;
      startPhase();
    }, text);
  }

  function completeRun(){
    const run = game.run;
    if(!run) return;
    const st = run.stage;
    const clearBonus = Math.floor((80 + st.chapter * 55 + st.level * 25) * run.stats.kuGainMultiplier);
    run.kuEarned += clearBonus;
    save.ku += run.kuEarned;
    save.stats.totalKuEarned += run.kuEarned;
    save.stats.highestKuInRun = Math.max(save.stats.highestKuInRun, run.kuEarned);
    save.stats.clears += 1;
    save.highestClearedRank = Math.max(save.highestClearedRank, st.rank);
    save.selectedRank = nextRank(st.rank);
    game.running = false;
    game.paused = false;
    game.phase = null;
    hidePowerup();

    let msg = `${stageText(st)} 클리어. ${format(run.kuEarned)} KU 정산.`;
    let ending = null;
    if(st.rank === stageRank(3,5) && !save.normalEndingSeen){
      save.normalEndingSeen = true;
      ending = {
        title:'노멀 엔딩',
        text:'재능단의 중간 거점이 무너졌다.\n하지만 진짜 비틱은 아직 웃고 있다.\n\n3-5 클리어로 레벨 돌파 조건이 열렸습니다.'
      };
    }
    if(st.rank === stageRank(6,5)){
      if(save.skillTree.trueEndingTrace && !save.trueEndingSeen){
        save.trueEndingSeen = true;
        ending = {
          title:'진엔딩',
          text:'재능은 졌다.\n짬은 남았다.\nKU는 증명했다.\n\n자쿠드는 아무 말도 하지 않았다.\n노재능단은 그 침묵을 허락으로 받아들였다.'
        };
      }else{
        ending = {
          title:'최종 보스 격파',
          text:'6-5를 클리어했습니다.\n진엔딩 추적 노드를 습득하면 진엔딩 문구가 열립니다.'
        };
      }
    }
    saveGame('클리어 저장됨');
    setMessage(msg, 'ok');
    if(ending) showEnding(ending.title, ending.text);
    uiDirty = true;
    renderPanel(true);
  }

  function failRun(reason){
    const run = game.run;
    if(!run) return;
    save.ku += run.kuEarned;
    save.stats.deaths += 1;
    save.stats.totalKuEarned += run.kuEarned;
    save.stats.highestKuInRun = Math.max(save.stats.highestKuInRun, run.kuEarned);
    game.running = false;
    game.paused = false;
    game.phase = null;
    hidePowerup();
    saveGame('사망 정산 저장됨');
    setMessage(`패배했습니다. ${reason} / ${format(run.kuEarned)} KU 정산. 재능 때문은 아닙니다. 아마도.`, 'danger');
    spawnBurst(game.player.x, game.player.y, '#ff5769', 32);
    uiDirty = true;
    renderPanel(true);
  }

  function showEnding(title, text){
    el.endingTitle.textContent = title;
    el.endingText.textContent = text;
    el.endingModal.classList.add('show');
  }
  el.endingClose.addEventListener('click', () => el.endingModal.classList.remove('show'));

  function togglePause(){
    if(!game.running || game.powerupOpen) return;
    game.paused = !game.paused;
    setMessage(game.paused ? '일시정지. 자쿠드는 보고 있다.' : '재개. 재능에 맞서 싸워라.', game.paused ? 'warn' : 'ok');
  }

  function spawnTileWave(){
    const y = -65;
    for(let lane = 0; lane < 4; lane++){
      const type = chooseEnemyType();
      game.enemies.push(createEnemy(type, lane, y + rand(-16, 14)));
    }
  }

  function chooseEnemyType(){
    const ch = game.stage.chapter;
    const pool = ['basic'];
    if(ch >= 2) pool.push('fast','bitik');
    if(ch >= 3) pool.push('split');
    if(ch >= 4) pool.push('shield','jjam');
    if(ch >= 5) pool.push('healer');
    if(ch >= 6) pool.push('ranker');
    if(game.phase && game.phase.type === 'boss') pool.push('shield','bitik');
    return pick(pool);
  }

  function createEnemy(typeKey, lane, y){
    const def = enemyTypes[typeKey] || enemyTypes.basic;
    const laneW = W / 4;
    const sizeW = Math.min(108, laneW * 0.82);
    const sizeH = typeKey === 'ranker' ? 62 : 56;
    const ch = game.stage.chapter;
    const lv = game.stage.level;
    const waveFactor = 1 + (game.phaseIndex || 0) * 0.10;
    const anti = game.run ? game.run.stats.antiBitik : 0;
    let typeMult = def.hp;
    if(['bitik','shield','healer'].includes(typeKey)) typeMult *= (1 - Math.min(0.45, anti));
    const hp = Math.max(3, Math.floor((7 + ch * 4 + lv * 2.2) * (1 + ch * 0.28) * waveFactor * typeMult * rand(0.92,1.12)));
    const speed = (32 + ch * 8 + lv * 2.2) * def.speed;
    const x = laneW * lane + laneW / 2;
    return {
      id:Math.random().toString(36).slice(2),
      typeKey, type:def, lane, x, y, w:sizeW, h:sizeH,
      hp, maxHp:hp,
      speed,
      reward:def.reward,
      shielded:typeKey === 'shield',
      growTimer:0,
      healTimer:1.7,
      phase:rand(0,Math.PI*2),
      vx:typeKey === 'ranker' ? rand(28,55) * (chance(0.5)?1:-1) : 0,
      hurt:0
    };
  }

  function spawnBoss(mini=false){
    const ch = game.stage.chapter;
    const lv = game.stage.level;
    const names = [
      '원트클의 재능','비틱술사','감각파 천재','랭커의 손목','재능의 대성당','재능단장 비틱의 화신'
    ];
    const hpBase = (mini ? 75 : 145) * (1 + ch * 0.52) + lv * 45;
    game.boss = {
      mini,
      chapter:ch,
      name: mini ? `미니 ${names[Math.max(0,ch-1)]}` : names[Math.max(0,ch-1)],
      x:W/2,
      y:mini ? 85 : 102,
      w:mini ? 150 : 220,
      h:mini ? 58 : 76,
      hp:Math.floor(hpBase),
      maxHp:Math.floor(hpBase),
      timer:0,
      shootTimer:mini ? 1.2 : 0.65,
      summonTimer:mini ? 3.2 : 2.3,
      specialTimer:mini ? 4.0 : 3.0,
      shieldUsed:false,
      direction:1,
      rage:false,
      hitFlash:0
    };
    const line = bossLine(ch, mini);
    setMessage(`${mini ? '미니 보스' : 'BOSS'} 등장: ${game.boss.name} — “${line}”`, 'warn');
    if(save.skillTree.revivalPrep && !mini && game.run){
      game.run.stats.shield = clamp(game.run.stats.shield + 1, 0, game.run.stats.maxShield);
      setMessage('재림 준비: 보스전 보호막 +1', 'ok');
    }
  }

  function bossLine(ch, mini){
    const lines = [
      '이거 그냥 한 번에 되던데요?',
      '저 별로 안 했는데요?',
      '계산을 왜 해요? 감으로 하면 되는데.',
      '손목 차이네요.',
      '재능은 증명할 필요가 없다. 이미 결과니까.',
      '노력하셨군요. 저는 그냥 됐습니다.'
    ];
    return mini ? '많이 하셨나 봐요.' : lines[ch-1] || lines[0];
  }

  function update(dt){
    if(!game.running || game.paused || game.powerupOpen) return;
    if(messageTimer > 0) messageTimer -= dt;
    updatePlayer(dt);
    updatePhase(dt);
    updateWeapons(dt);
    updateBullets(dt);
    updateMissiles(dt);
    updateLasers(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateBossBullets(dt);
    updateWarnings(dt);
    updateParticles(dt);
    checkPlayerCollisions();
    if(uiDirty || performance.now() - lastPanelRender > 700){
      renderPanel(false);
      lastPanelRender = performance.now();
    }
  }

  function updatePlayer(dt){
    const p = game.player;
    const speed = 13 * (game.run ? game.run.stats.moveSpeedMultiplier : 1);
    p.x += (p.targetX - p.x) * clamp(dt * speed, 0, 1);
    p.y += (p.targetY - p.y) * clamp(dt * speed, 0, 1);
    p.x = clamp(p.x, 18, W - 18);
    p.y = clamp(p.y, H * 0.44, H - 24);
    if(p.hitFlash > 0) p.hitFlash -= dt;
  }

  function updatePhase(dt){
    const phase = game.phase;
    if(!phase) return;
    if(phase.type === 'wave'){
      phase.spawnTimer -= dt;
      if(phase.spawned < phase.target && phase.spawnTimer <= 0){
        spawnTileWave();
        phase.spawned += 1;
        phase.spawnTimer = clamp(1.85 - game.stage.chapter * 0.12, 0.92, 1.85);
      }
      if(phase.spawned >= phase.target && game.enemies.length === 0){
        phaseComplete();
      }
    }
  }

  function updateWeapons(dt){
    const run = game.run;
    if(!run) return;
    game.shootTimer -= dt;
    game.missileTimer -= dt;
    game.laserTimer -= dt;
    const fireInterval = clamp(0.27 / run.stats.fireRateMultiplier, 0.075, 0.35);
    if(game.shootTimer <= 0){
      fireBullets();
      game.shootTimer += fireInterval;
    }
    if(run.weapons.missile > 0 && game.missileTimer <= 0){
      fireMissiles();
      game.missileTimer += clamp(1.10 / run.stats.fireRateMultiplier, 0.38, 1.2);
    }
    if(run.weapons.laser > 0 && game.laserTimer <= 0){
      fireLaser();
      game.laserTimer += clamp(2.15 / Math.sqrt(run.stats.fireRateMultiplier), 0.8, 2.25);
    }
  }

  function damageRoll(base, weaponKey, enhanced=false, targetBoss=false){
    const run = game.run;
    let dmg = base * run.stats.attackMultiplier * (run.weaponBonus[weaponKey] || 1);
    if(enhanced) dmg *= run.stats.enhancedDamageMultiplier * 1.55;
    if(targetBoss) dmg *= run.stats.bossDamageMultiplier;
    const crit = Math.random() < run.stats.critChance;
    if(crit) dmg *= run.stats.critDamage;
    return {dmg, crit};
  }

  function fireBullets(){
    const run = game.run;
    const p = game.player;
    const frontLv = run.weapons.front;
    const sideLv = run.weapons.side;
    const enhancedFront = Math.max(0, frontLv - weaponMax.front.base);
    const normalFront = Math.min(frontLv, weaponMax.front.base);
    if(normalFront > 0){
      for(let i=0; i<normalFront; i++){
        const offset = (i - (normalFront - 1) / 2) * 11;
        const roll = damageRoll(2.2, 'front');
        game.bullets.push(makeBullet(p.x + offset, p.y - 18, offset * 0.025, -450, 4.2, roll.dmg, roll.crit, 'front', false));
      }
    }
    for(let i=0; i<enhancedFront; i++){
      const offset = (i - (enhancedFront - 1) / 2) * 18;
      const roll = damageRoll(3.2, 'front', true);
      game.bullets.push(makeBullet(p.x + offset, p.y - 22, offset * 0.018, -430, 7.5, roll.dmg, roll.crit, 'front', true));
    }

    const sideNormal = Math.min(sideLv, weaponMax.side.base);
    const sideEnhanced = Math.max(0, sideLv - weaponMax.side.base);
    if(sideNormal > 0){
      for(let i=0; i<sideNormal; i++){
        const spread = 140 + i * 28;
        const vy = -350 + i * -12;
        let roll = damageRoll(1.45, 'side');
        game.bullets.push(makeBullet(p.x - 10, p.y - 9, -spread, vy, 3.8, roll.dmg, roll.crit, 'side', false));
        roll = damageRoll(1.45, 'side');
        game.bullets.push(makeBullet(p.x + 10, p.y - 9, spread, vy, 3.8, roll.dmg, roll.crit, 'side', false));
      }
    }
    if(sideEnhanced > 0){
      for(let i=0; i<sideEnhanced; i++){
        const spread = 180 + i * 34;
        const vy = -330 + i * -10;
        let roll = damageRoll(2.3, 'side', true);
        game.bullets.push(makeBullet(p.x - 14, p.y - 12, -spread, vy, 7.0, roll.dmg, roll.crit, 'side', true));
        roll = damageRoll(2.3, 'side', true);
        game.bullets.push(makeBullet(p.x + 14, p.y - 12, spread, vy, 7.0, roll.dmg, roll.crit, 'side', true));
      }
    }
  }

  function makeBullet(x,y,vx,vy,r,dmg,crit,weapon,enhanced){
    return {x,y,vx,vy,r,dmg,crit,weapon,enhanced,bounceLeft:game.run.stats.bounce, life:3.2};
  }

  function fireMissiles(){
    const run = game.run;
    const p = game.player;
    const lv = run.weapons.missile;
    const normal = Math.min(lv, weaponMax.missile.base);
    const enhanced = Math.max(0, lv - weaponMax.missile.base);
    for(let i=0;i<normal;i++){
      const side = i % 2 === 0 ? -1 : 1;
      const roll = damageRoll(6.0, 'missile');
      game.missiles.push({x:p.x + side * 30, y:p.y - 8, vx:side * 32, vy:-180, r:6, dmg:roll.dmg, crit:roll.crit, enhanced:false, life:4.8, target:null, trail:[]});
    }
    for(let i=0;i<enhanced;i++){
      const side = i % 2 === 0 ? -1 : 1;
      const roll = damageRoll(8.4, 'missile', true);
      game.missiles.push({x:p.x + side * 42, y:p.y - 12, vx:side * 42, vy:-170, r:9, dmg:roll.dmg, crit:roll.crit, enhanced:true, life:5.2, target:null, trail:[]});
    }
  }

  function fireLaser(){
    const run = game.run;
    const lv = run.weapons.laser;
    const beams = laserAngles(lv);
    for(const beam of beams){
      const enhanced = beam.enhanced;
      const roll = damageRoll(enhanced ? 16 : 10, 'laser', enhanced);
      game.lasers.push({
        x:game.player.x, y:game.player.y - 22,
        angle:beam.angle, width:enhanced ? 18 : 9,
        dmg:roll.dmg, crit:roll.crit,
        duration:enhanced ? 0.28 : 0.18,
        tick:0,
        enhanced
      });
    }
  }

  function laserAngles(lv){
    const normalLv = Math.min(lv, weaponMax.laser.base);
    const enhanced = Math.max(0, lv - weaponMax.laser.base);
    let angles = [];
    if(normalLv === 1) angles = [-Math.PI/2];
    if(normalLv === 2) angles = [-Math.PI/2 - 0.23, -Math.PI/2 + 0.23];
    if(normalLv === 3) angles = [-Math.PI/2 - 0.27, -Math.PI/2, -Math.PI/2 + 0.27];
    if(normalLv >= 4) angles = [-Math.PI/2 - 0.42, -Math.PI/2 - 0.22, -Math.PI/2, -Math.PI/2 + 0.22, -Math.PI/2 + 0.42];
    const out = angles.map(a => ({angle:a, enhanced:false}));
    for(let i=0; i<enhanced; i++){
      const spread = (i - (enhanced - 1) / 2) * 0.16;
      out.push({angle:-Math.PI/2 + spread, enhanced:true});
    }
    return out;
  }

  function updateBullets(dt){
    for(let i=game.bullets.length-1; i>=0; i--){
      const b = game.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if((b.x < b.r || b.x > W - b.r) && b.bounceLeft > 0){
        b.vx *= -1;
        b.bounceLeft -= 1;
        b.x = clamp(b.x, b.r, W - b.r);
      }
      if(b.life <= 0 || b.y < -40 || b.y > H + 60 || b.x < -60 || b.x > W + 60){
        game.bullets.splice(i,1); continue;
      }
      if(hitBossWithProjectile(b)){
        game.bullets.splice(i,1); continue;
      }
      let hit = false;
      for(let j=game.enemies.length-1; j>=0; j--){
        const e = game.enemies[j];
        if(circleRect(b.x,b.y,b.r,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
          damageEnemy(e, b.dmg, b.crit, b.weapon, b.enhanced);
          spawnBurst(b.x,b.y,b.enhanced ? '#ffe66d' : (b.crit ? '#ff5de1' : '#5df0ff'), b.enhanced ? 8 : 4);
          hit = true;
          break;
        }
      }
      if(hit) game.bullets.splice(i,1);
    }
  }

  function updateMissiles(dt){
    for(let i=game.missiles.length-1; i>=0; i--){
      const m = game.missiles[i];
      m.life -= dt;
      m.trail.push({x:m.x,y:m.y,life:.25});
      if(m.trail.length > 10) m.trail.shift();
      m.trail.forEach(t => t.life -= dt);
      m.trail = m.trail.filter(t => t.life > 0);
      const target = findMissileTarget(m);
      if(target){
        const tx = target.x;
        const ty = target.y;
        const dx = tx - m.x;
        const dy = ty - m.y;
        const len = Math.hypot(dx,dy) || 1;
        const acc = m.enhanced ? 520 : 420;
        m.vx += (dx/len) * acc * dt;
        m.vy += (dy/len) * acc * dt;
        const sp = Math.hypot(m.vx,m.vy) || 1;
        const maxSp = m.enhanced ? 430 : 370;
        if(sp > maxSp){ m.vx = m.vx / sp * maxSp; m.vy = m.vy / sp * maxSp; }
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if(m.life <= 0 || m.y < -80 || m.x < -80 || m.x > W + 80){ game.missiles.splice(i,1); continue; }
      if(hitBossWithProjectile(m)){
        missileExplosion(m.x,m.y,m.enhanced,m.dmg*0.45,m.crit);
        game.missiles.splice(i,1); continue;
      }
      let hit = false;
      for(let j=game.enemies.length-1; j>=0; j--){
        const e = game.enemies[j];
        if(circleRect(m.x,m.y,m.r,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
          damageEnemy(e, m.dmg, m.crit, 'missile', m.enhanced);
          missileExplosion(m.x,m.y,m.enhanced,m.dmg*0.45,m.crit);
          hit = true;
          break;
        }
      }
      if(hit) game.missiles.splice(i,1);
    }
  }

  function findMissileTarget(m){
    let best = null;
    let bestScore = Infinity;
    for(const e of game.enemies){
      const d = Math.hypot(e.x-m.x,e.y-m.y);
      const score = d - e.hp * 4;
      if(score < bestScore){ bestScore = score; best = e; }
    }
    if(game.boss){
      const d = Math.hypot(game.boss.x-m.x, game.boss.y-m.y);
      if(d - game.boss.hp * 0.2 < bestScore) best = game.boss;
    }
    return best;
  }

  function updateLasers(dt){
    for(let i=game.lasers.length-1; i>=0; i--){
      const l = game.lasers[i];
      l.duration -= dt;
      l.tick -= dt;
      if(l.tick <= 0){
        l.tick = 0.075;
        applyLaserDamage(l, l.dmg * 0.18);
      }
      if(l.duration <= 0) game.lasers.splice(i,1);
    }
  }

  function applyLaserDamage(laser, dmg){
    const ex = laser.x + Math.cos(laser.angle) * 1000;
    const ey = laser.y + Math.sin(laser.angle) * 1000;
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      const d = distPointToSegment(e.x, e.y, laser.x, laser.y, ex, ey);
      if(d < laser.width + Math.min(e.w,e.h) * 0.38){
        damageEnemy(e, dmg, laser.crit, 'laser', laser.enhanced);
      }
    }
    if(game.boss){
      const d = distPointToSegment(game.boss.x, game.boss.y, laser.x, laser.y, ex, ey);
      if(d < laser.width + game.boss.w * 0.33){
        damageBoss(dmg * game.run.stats.bossDamageMultiplier, laser.crit, 'laser');
      }
    }
  }

  function updateEnemies(dt){
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      e.hurt = Math.max(0, e.hurt - dt);
      if(e.typeKey === 'ranker'){
        e.x += e.vx * dt;
        if(e.x < e.w/2 + 6 || e.x > W - e.w/2 - 6) e.vx *= -1;
        e.y += e.speed * dt * 0.55;
        if(chance(0.008 + game.stage.chapter * 0.002)) spawnBossBullet(e.x,e.y + 24, rand(-55,55), rand(120,180), 5, '#ffe66d');
      }else{
        e.y += e.speed * dt;
      }
      if(e.typeKey === 'jjam'){
        e.growTimer += dt;
        if(e.growTimer > 0.8){
          e.growTimer = 0;
          e.hp += 1;
          e.maxHp += 1;
        }
      }
      if(e.typeKey === 'healer'){
        e.healTimer -= dt;
        if(e.healTimer <= 0){
          e.healTimer = save.skillTree.healBlock || isEquipped('anti_bitik_charm') ? 2.8 : 1.9;
          const healMult = save.skillTree.healBlock ? 0.42 : 1;
          for(const other of game.enemies){
            if(other !== e && Math.abs(other.x - e.x) < W/2 && Math.abs(other.y - e.y) < 95){
              other.hp = Math.min(other.maxHp, other.hp + Math.max(1, Math.floor(other.maxHp * 0.08 * healMult)));
              spawnBurst(other.x, other.y, '#70ff9a', 5);
            }
          }
        }
      }
      if(e.y > H + 70){
        game.enemies.splice(i,1);
      }
    }
  }

  function updateBoss(dt){
    const b = game.boss;
    if(!b) return;
    b.timer += dt;
    b.hitFlash = Math.max(0, b.hitFlash - dt);
    const ch = b.chapter;
    if(ch === 3 || ch === 6){
      b.x = W/2 + Math.sin(b.timer * (b.mini ? 1.6 : 2.1)) * (b.mini ? 105 : 155);
    }else if(ch === 4){
      b.x += b.direction * (b.mini ? 80 : 120) * dt;
      if(b.x < b.w/2+12 || b.x > W-b.w/2-12) b.direction *= -1;
    }else if(ch === 5){
      b.x = W/2 + Math.sin(b.timer * 0.7) * 70;
    }else{
      b.x = W/2 + Math.sin(b.timer * 0.8) * 90;
    }

    b.shootTimer -= dt;
    b.summonTimer -= dt;
    b.specialTimer -= dt;
    if(b.hp / b.maxHp < 0.4) b.rage = true;

    if(b.shootTimer <= 0){
      bossShootPattern(b);
      b.shootTimer = b.rage ? (b.mini ? 0.65 : 0.42) : (b.mini ? 1.15 : 0.72);
    }
    if(b.summonTimer <= 0){
      bossSummonPattern(b);
      b.summonTimer = b.rage ? (b.mini ? 2.8 : 2.0) : (b.mini ? 3.4 : 2.6);
    }
    if(b.specialTimer <= 0){
      bossSpecialPattern(b);
      b.specialTimer = b.rage ? (b.mini ? 3.4 : 2.5) : (b.mini ? 4.5 : 3.4);
    }
  }

  function bossShootPattern(b){
    const ch = b.chapter;
    if(ch === 1){
      for(let i=-1;i<=1;i++) spawnBossBullet(b.x,b.y+40,i*58,170,5,'#ff7a88');
    }else if(ch === 2){
      for(let i=0;i<6;i++){
        const a = Math.PI*0.20 + i * Math.PI*0.12;
        spawnBossBullet(b.x,b.y+40,Math.cos(a)*110,Math.sin(a)*170,5,'#ff5de1');
      }
    }else if(ch === 3){
      const lanes = [W*0.125,W*0.375,W*0.625,W*0.875];
      for(const x of lanes) spawnBossBullet(x,b.y+35,(game.player.x-x)*0.15,180,5,'#ffd166');
    }else if(ch === 4){
      for(let i=0;i<9;i++) spawnBossBullet(b.x,b.y+40,rand(-160,160),rand(150,245),4.2,'#ffe66d');
    }else if(ch === 5){
      for(let i=-2;i<=2;i++) spawnBossBullet(b.x + i*25,b.y+45,i*30,190,6,'#7f8cff');
    }else{
      for(let i=0;i<12;i++){
        const a = Math.PI*0.10 + i * Math.PI*0.075 + Math.sin(b.timer)*0.2;
        spawnBossBullet(b.x,b.y+38,Math.cos(a)*155,Math.sin(a)*210,4.8,i%2?'#ff5de1':'#5df0ff');
      }
    }
  }

  function bossSummonPattern(b){
    const ch = b.chapter;
    if(ch === 1){
      spawnTileWave();
    }else if(ch === 2){
      game.enemies.push(createEnemy('healer', Math.floor(rand(0,4)), -55));
      for(let lane=0; lane<4; lane++) if(chance(0.45)) game.enemies.push(createEnemy('shield', lane, -70-rand(0,40)));
    }else if(ch === 3){
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(chance(0.5)?'fast':'split', lane, -55-rand(0,20)));
    }else if(ch === 4){
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(chance(0.55)?'ranker':'fast', lane, -55-rand(0,50)));
    }else if(ch === 5){
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(chance(0.5)?'shield':'bitik', lane, -55-rand(0,30)));
    }else{
      for(let lane=0; lane<4; lane++) game.enemies.push(createEnemy(pick(['shield','healer','ranker','bitik']), lane, -55-rand(0,50)));
    }
  }

  function bossSpecialPattern(b){
    const ch = b.chapter;
    if(ch === 1 && !b.shieldUsed){
      b.shieldUsed = true;
      spawnBurst(b.x,b.y,'#ffe66d',24);
      setMessage('원트클 방패: 다음 큰 피해 일부 무효.', 'warn');
    }else if(ch === 2){
      for(const e of game.enemies){ e.hp = Math.min(e.maxHp + 8, e.hp + Math.floor(e.maxHp * 0.16)); spawnBurst(e.x,e.y,'#70ff9a',6); }
      setMessage('비틱 회복: 주변 타일 체력이 회복됩니다.', 'warn');
    }else if(ch === 3){
      addLaneWarning(Math.floor(rand(0,4)), 0.85, 0.30, '#ffd166');
      addLaneWarning(Math.floor(rand(0,4)), 0.85, 0.30, '#ffd166');
    }else if(ch === 4){
      addSweepWarning(b.direction > 0 ? 'right' : 'left');
    }else if(ch === 5){
      addLaneWarning(0, 1.0, 0.42, '#7f8cff');
      addLaneWarning(2, 1.0, 0.42, '#7f8cff');
    }else{
      for(let lane=0; lane<4; lane++) if(chance(0.75)) addLaneWarning(lane, 0.75, 0.32, lane % 2 ? '#ff5de1' : '#5df0ff');
    }
  }

  function addLaneWarning(lane, warnTime, activeTime, color){
    const laneW = W/4;
    game.warnings.push({type:'lane', lane, x:lane*laneW, w:laneW, warnTime, activeTime, totalWarn:warnTime, color, hit:false});
    setMessage('경고 라인: 레인을 벗어나십시오.', 'warn');
  }
  function addSweepWarning(dir){
    game.warnings.push({type:'sweep', dir, x:dir === 'right' ? 0 : W, warnTime:0.75, activeTime:0.45, totalWarn:0.75, color:'#ffe66d', hit:false});
    setMessage('랭커 스윕: 손목 차이 공격이 옵니다.', 'warn');
  }

  function updateWarnings(dt){
    for(let i=game.warnings.length-1; i>=0; i--){
      const w = game.warnings[i];
      if(w.warnTime > 0){
        w.warnTime -= dt;
      }else{
        w.activeTime -= dt;
        if(w.type === 'sweep'){
          const speed = 760;
          w.x += (w.dir === 'right' ? 1 : -1) * speed * dt;
        }
        if(!w.hit && warningHitsPlayer(w)){
          w.hit = true;
          playerTakeHit('특수 패턴 피격');
        }
        if(w.activeTime <= 0) game.warnings.splice(i,1);
      }
    }
  }

  function warningHitsPlayer(w){
    const p = game.player;
    if(w.type === 'lane'){
      return p.x > w.x + 6 && p.x < w.x + w.w - 6;
    }
    if(w.type === 'sweep'){
      return Math.abs(p.x - w.x) < 20;
    }
    return false;
  }

  function spawnBossBullet(x,y,vx,vy,r,color){
    game.bossBullets.push({x,y,vx,vy,r,color,life:6});
  }

  function updateBossBullets(dt){
    for(let i=game.bossBullets.length-1; i>=0; i--){
      const b = game.bossBullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if(b.life <= 0 || b.y > H + 40 || b.x < -40 || b.x > W + 40){ game.bossBullets.splice(i,1); continue; }
      if(Math.hypot(b.x - game.player.x, b.y - game.player.y) < b.r + game.player.r){
        game.bossBullets.splice(i,1);
        playerTakeHit('보스 탄막 피격');
      }
    }
  }

  function checkPlayerCollisions(){
    if(!game.running) return;
    const p = game.player;
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      if(circleRect(p.x,p.y,p.r,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
        game.enemies.splice(i,1);
        playerTakeHit(`${e.type.name} 직접 충돌`);
        break;
      }
    }
  }

  function playerTakeHit(reason){
    const run = game.run;
    if(!run || !game.running) return;
    if(game.player.hitFlash > 0) return;
    if(run.stats.shield > 0){
      run.stats.shield -= 1;
      game.player.hitFlash = 1.0;
      spawnBurst(game.player.x, game.player.y, '#5df0ff', 22);
      setMessage(`보호막 소모: ${reason}. 남은 보호막 ${run.stats.shield}`, 'warn');
      uiDirty = true;
      return;
    }
    if(run.revivalAvailable){
      run.revivalAvailable = false;
      run.stats.shield = Math.min(1, run.stats.maxShield);
      game.player.hitFlash = 1.2;
      spawnBurst(game.player.x, game.player.y, '#ffe66d', 42);
      setMessage('자쿠드 재림권 발동: 한 번쯤은 실수도 신앙입니다.', 'ok');
      uiDirty = true;
      return;
    }
    failRun(reason);
  }

  function damageEnemy(e, amount, crit=false, weapon='front', enhanced=false){
    if(!game.running) return;
    if(e.shielded){
      const pierce = save.skillTree.shieldBreak || isEquipped('anti_bitik_charm') || weapon === 'laser';
      if(!pierce){
        e.shielded = false;
        e.hurt = 0.12;
        spawnBurst(e.x,e.y,'#7f8cff',10);
        return;
      }
      e.shielded = false;
      amount *= 1.35;
    }
    e.hp -= amount;
    e.hurt = 0.08;
    if(crit) spawnText(e.x,e.y-14,'CRIT','#ff5de1');
    if(enhanced) spawnText(e.x,e.y+12,'강화','#ffe66d');
    if(e.hp <= 0) destroyEnemy(e);
  }

  function destroyEnemy(e){
    const idx = game.enemies.indexOf(e);
    if(idx >= 0) game.enemies.splice(idx,1);
    const ch = game.stage.chapter;
    const rewardBase = 3 + ch + game.stage.level + e.reward * 2;
    let reward = Math.floor(rewardBase * game.run.stats.kuGainMultiplier);
    if(save.skillTree.antiBitikScan && ['bitik','shield','healer'].includes(e.typeKey)) reward += 2;
    game.run.kuEarned += reward;
    game.run.kills += 1;
    save.stats.tilesDestroyed += 1;
    spawnBurst(e.x,e.y,e.type.color,18);
    if(e.typeKey === 'split'){
      for(let lane=0; lane<4; lane++){
        const frag = createEnemy('basic', lane, e.y - rand(20,60));
        frag.hp = Math.max(2, Math.floor(e.maxHp * 0.28));
        frag.maxHp = frag.hp;
        frag.speed *= 1.18;
        game.enemies.push(frag);
      }
      setMessage('연타수저 분열: 파편 4칸 추가.', 'warn');
    }
    if(game.run.kills >= game.nextKillPowerup && !game.powerupOpen && game.running){
      game.nextKillPowerup += 5 + game.powerupCount * 5;
      offerPowerups(() => {}, `${game.run.kills}킬 달성. KU 노동자의 파워업 선택.`);
    }
    uiDirty = true;
  }

  function hitBossWithProjectile(p){
    const b = game.boss;
    if(!b) return false;
    if(circleRect(p.x,p.y,p.r,b.x-b.w/2,b.y-b.h/2,b.w,b.h)){
      const dmg = p.dmg * game.run.stats.bossDamageMultiplier;
      damageBoss(dmg, p.crit, p.weapon || 'front');
      return true;
    }
    return false;
  }

  function damageBoss(amount, crit=false, weapon='front'){
    const b = game.boss;
    if(!b) return;
    if(b.chapter === 1 && b.shieldUsed && amount > b.maxHp * 0.06){
      amount *= 0.35;
      b.shieldUsed = false;
      spawnText(b.x,b.y-38,'원트클 방패','#ffe66d');
    }
    b.hp -= amount;
    b.hitFlash = 0.10;
    if(crit) spawnText(b.x,b.y-50,'BOSS CRIT','#ff5de1');
    if(b.hp <= 0){
      const reward = Math.floor((b.mini ? 55 : 125) * game.stage.chapter * game.run.stats.kuGainMultiplier);
      game.run.kuEarned += reward;
      game.run.bossesKilled += 1;
      save.stats.bossKills += 1;
      spawnBurst(b.x,b.y,'#ffe66d',70);
      setMessage(`${b.name} 격파. ${format(reward)} KU 보상.`, 'ok');
      game.boss = null;
      game.bossBullets = [];
      game.warnings = game.warnings.filter(w => w.type !== 'lane');
      setTimeout(() => { if(game.running && game.phase && (game.phase.type === 'boss' || game.phase.type === 'miniboss')) phaseComplete(); }, 60);
    }
    uiDirty = true;
  }

  function missileExplosion(x,y,enhanced,dmg,crit){
    const radius = enhanced ? 55 : 34;
    for(let i=game.enemies.length-1; i>=0; i--){
      const e = game.enemies[i];
      if(Math.hypot(e.x-x,e.y-y) < radius){
        damageEnemy(e, dmg, crit, 'missile', enhanced);
      }
    }
    if(game.boss && Math.hypot(game.boss.x-x,game.boss.y-y) < radius + game.boss.w/2){
      damageBoss(dmg * 0.8 * game.run.stats.bossDamageMultiplier, crit, 'missile');
    }
    spawnBurst(x,y,enhanced ? '#ffe66d' : '#ffd166', enhanced ? 28 : 16);
  }

  function circleRect(cx,cy,r,rx,ry,rw,rh){
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    return Math.hypot(cx - nx, cy - ny) <= r;
  }

  function distPointToSegment(px,py,x1,y1,x2,y2){
    const dx = x2-x1, dy=y2-y1;
    const l2 = dx*dx + dy*dy || 1;
    let t = ((px-x1)*dx + (py-y1)*dy) / l2;
    t = clamp(t,0,1);
    return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
  }

  function spawnBurst(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = rand(0, Math.PI*2);
      const s = rand(30, 190);
      game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.18,.65),maxLife:.65,color,size:rand(1.5,4)});
    }
  }

  function spawnText(x,y,text,color){
    game.particles.push({x,y,vx:0,vy:-34,life:.75,maxLife:.75,color,text,size:12});
  }

  function updateParticles(dt){
    for(let i=game.particles.length-1; i>=0; i--){
      const p = game.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 60 * dt;
      p.life -= dt;
      if(p.life <= 0) game.particles.splice(i,1);
    }
  }

  function offerPowerups(after, title){
    if(!game.running || game.powerupOpen) return;
    game.powerupOpen = true;
    game.paused = true;
    game.afterPowerup = after || (() => {});
    game.offeredPowerups = generatePowerups(3);
    game.powerupCount += 1;
    renderPowerCards(title);
    el.powerupModal.classList.add('show');
    el.powerupModal.setAttribute('aria-hidden','false');
    setMessage(title || '파워업 선택. 카드 클릭 또는 숫자키 1~3.', 'warn');
  }

  function hidePowerup(){
    game.powerupOpen = false;
    el.powerupModal.classList.remove('show');
    el.powerupModal.setAttribute('aria-hidden','true');
    el.powerCards.innerHTML = '';
  }

  function generatePowerups(count){
    const selected = [];
    const candidates = powerups.map(p => ({...p, dynamicWeight:dynamicPowerWeight(p)}));
    while(selected.length < count && candidates.length){
      const total = candidates.reduce((s,p)=>s+p.dynamicWeight,0);
      let r = Math.random() * total;
      let idx = 0;
      for(; idx<candidates.length; idx++){
        r -= candidates[idx].dynamicWeight;
        if(r <= 0) break;
      }
      selected.push(candidates[idx]);
      candidates.splice(idx,1);
    }
    return selected;
  }

  function dynamicPowerWeight(p){
    let w = p.weight;
    const run = game.run;
    if(!run) return w;
    if(p.type === 'weapon'){
      if(save.skillTree.repeatMastery) w *= 1.22;
      const level = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      if(level >= max) w *= 0.55;
      else if(level < weaponMax[p.key].base) w *= 1.08;
    }
    if(p.id === 'shield'){
      if(run.stats.shield <= 0) w += 10;
      if(run.stats.shield >= run.stats.maxShield) w *= 0.25;
    }
    if(game.phase && (game.phase.type === 'boss' || game.phase.type === 'miniboss')){
      if(['missile','laser','attack'].includes(p.id)) w *= 1.22;
    }
    return Math.max(1, w);
  }

  function renderPowerCards(title){
    const cards = game.offeredPowerups.map((p, i) => {
      const meta = powerMeta(p);
      const desc = powerDesc(p);
      return `<button class="powerCard" data-index="${i}" aria-label="${p.name}">
        <div class="powerIcon">${p.icon}</div>
        <div class="powerTitle">${i + 1}. ${p.name}</div>
        <div class="powerDesc">${escapeHtml(desc)}</div>
        <div class="powerMeta">${escapeHtml(meta)}</div>
      </button>`;
    }).join('');
    el.powerCards.innerHTML = cards;
    el.powerCards.querySelectorAll('.powerCard').forEach(btn => {
      btn.addEventListener('click', () => choosePowerup(Number(btn.dataset.index)));
    });
  }

  function powerMeta(p){
    const run = game.run;
    if(!run) return '';
    if(p.type === 'weapon'){
      const lv = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      const baseMax = weaponMax[p.key].base;
      if(lv >= max) return `현재 Lv.${lv} / MAX — 선택 시 피해 강화`;
      if(lv >= baseMax && run.levelBreakthrough) return `현재 Lv.${lv} → Lv.${lv+1} / 강화 구간`;
      if(lv >= baseMax && !run.levelBreakthrough) return `현재 Lv.${lv} / 기본 MAX — 선택 시 피해 강화`;
      return `현재 Lv.${lv} → Lv.${lv+1}`;
    }
    if(p.id === 'shield') return `현재 보호막 ${run.stats.shield}/${run.stats.maxShield}`;
    if(p.id === 'critChance') return `현재 ${Math.round(run.stats.critChance*100)}%`;
    if(p.id === 'critDamage') return `현재 ${Math.round(run.stats.critDamage*100)}%`;
    if(p.id === 'bounce') return `현재 ${run.stats.bounce}회 반사`;
    return '중첩 가능';
  }

  function powerDesc(p){
    const run = game.run;
    if(p.type === 'weapon' && run){
      const lv = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      if(lv >= max) return `${p.desc}\n\n이미 최대 레벨입니다. 선택하면 해당 무기 피해 +15%.`;
      if(lv >= weaponMax[p.key].base && run.levelBreakthrough) return `${p.desc}\n\n레벨 돌파 적용 중: 강화 탄환/강화 무기 해금.`;
      if(lv >= weaponMax[p.key].base && !run.levelBreakthrough) return `${p.desc}\n\n레벨 돌파 전: 레벨 대신 피해가 증가합니다.`;
    }
    return p.desc;
  }

  function choosePowerup(index){
    if(!game.powerupOpen) return;
    const p = game.offeredPowerups[index];
    if(!p) return;
    applyPowerup(p);
    const after = game.afterPowerup || (() => {});
    hidePowerup();
    game.paused = false;
    game.afterPowerup = null;
    after();
    uiDirty = true;
  }

  function applyPowerup(p){
    const run = game.run;
    if(!run) return;
    if(p.type === 'weapon'){
      const lv = run.weapons[p.key];
      const max = maxForWeapon(p.key, run);
      if(lv < max){
        run.weapons[p.key] += 1;
        const enhanced = run.weapons[p.key] > weaponMax[p.key].base;
        setMessage(`${p.name} Lv.${run.weapons[p.key]}${enhanced ? ' — 강화 구간 진입' : ''}`, 'ok');
      }else{
        run.weaponBonus[p.key] *= 1.15;
        setMessage(`${p.name} MAX 초과: 해당 무기 피해 +15%`, 'ok');
      }
      return;
    }
    switch(p.id){
      case 'attack': run.stats.attackMultiplier *= 1.18; setMessage('공격력 증가. 잠재력이 실력으로 환전되었습니다.', 'ok'); break;
      case 'fireRate': run.stats.fireRateMultiplier *= 1.14; setMessage('공격속도 증가. 손목이 적응했습니다.', 'ok'); break;
      case 'bounce': run.stats.bounce += 1; setMessage(`벽에 튕기기 +1. 현재 ${run.stats.bounce}회 반사.`, 'ok'); break;
      case 'critChance': run.stats.critChance = Math.min(0.7, run.stats.critChance + 0.05); setMessage(`크리티컬 확률 ${Math.round(run.stats.critChance*100)}%.`, 'ok'); break;
      case 'critDamage': run.stats.critDamage += 0.25; setMessage(`크리티컬 대미지 ${Math.round(run.stats.critDamage*100)}%.`, 'ok'); break;
      case 'shield': run.stats.shield = Math.min(run.stats.maxShield, run.stats.shield + 1); setMessage(`보호막 +1. 현재 ${run.stats.shield}/${run.stats.maxShield}.`, 'ok'); break;
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawLanes();
    drawWarnings();
    drawEnemies();
    drawBoss();
    drawLasers();
    drawBullets();
    drawMissiles();
    drawBossBullets();
    drawPlayer();
    drawParticles();
    drawHUD();
    if(!game.running) drawIdleOverlay();
    if(game.paused && game.running && !game.powerupOpen) drawPauseOverlay();
  }

  function drawBackground(){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#050814'); grad.addColorStop(1,'#081226');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 0.24;
    ctx.strokeStyle = '#163156'; ctx.lineWidth = 1;
    for(let y=0;y<H;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for(let x=0;x<W;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const t = performance.now() * 0.00005;
    for(let i=0;i<42;i++){
      const x = (i * 97 + Math.sin(i)*33) % W;
      const y = (i * 71 + (performance.now()*0.018*(i%3+1))) % H;
      ctx.fillStyle = i%5===0 ? 'rgba(255,230,109,.55)' : 'rgba(93,240,255,.35)';
      ctx.fillRect(Math.floor(x), Math.floor(y), 2, 2);
    }
  }

  function drawLanes(){
    const laneW = W/4;
    for(let i=1;i<4;i++){
      ctx.strokeStyle = 'rgba(93,240,255,.23)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(i*laneW,0); ctx.lineTo(i*laneW,H); ctx.stroke();
    }
    for(let i=0;i<4;i++){
      ctx.fillStyle = 'rgba(93,240,255,.05)';
      ctx.fillRect(i*laneW+2,0,laneW-4,H);
      ctx.fillStyle = 'rgba(139,164,200,.38)';
      ctx.font = '12px monospace'; ctx.textAlign='center';
      ctx.fillText(`LANE ${i+1}`, i*laneW + laneW/2, 22);
    }
  }

  function drawWarnings(){
    for(const w of game.warnings){
      if(w.type === 'lane'){
        const active = w.warnTime <= 0;
        ctx.globalAlpha = active ? 0.48 : 0.18 + Math.sin(performance.now()*0.02)*0.08;
        ctx.fillStyle = w.color;
        ctx.fillRect(w.x, 0, w.w, H);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = w.color;
        ctx.lineWidth = active ? 5 : 2;
        ctx.strokeRect(w.x+3, 3, w.w-6, H-6);
      }else if(w.type === 'sweep'){
        ctx.globalAlpha = w.warnTime > 0 ? 0.25 : 0.72;
        ctx.fillStyle = w.color;
        ctx.fillRect(w.x - 18,0,36,H);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawEnemies(){
    for(const e of game.enemies){
      const x = Math.round(e.x - e.w/2), y = Math.round(e.y - e.h/2);
      ctx.save();
      ctx.shadowColor = e.type.color; ctx.shadowBlur = e.hurt > 0 ? 18 : 7;
      ctx.fillStyle = '#071124'; ctx.fillRect(x,y,e.w,e.h);
      ctx.fillStyle = e.type.color; ctx.globalAlpha = e.hurt > 0 ? 0.58 : 0.26; ctx.fillRect(x+4,y+4,e.w-8,e.h-8); ctx.globalAlpha=1;
      ctx.strokeStyle = e.shielded ? '#ffffff' : e.type.border; ctx.lineWidth = e.shielded ? 4 : 2; ctx.strokeRect(x+1,y+1,e.w-2,e.h-2);
      drawPixelCorners(x,y,e.w,e.h,e.type.border);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(Math.max(0, Math.ceil(e.hp))), e.x, e.y + 5);
      ctx.font = 'bold 13px monospace'; ctx.fillStyle = e.type.border;
      ctx.fillText(e.type.icon, e.x, e.y - 17);
      if(e.shielded){ ctx.font = '10px monospace'; ctx.fillStyle = '#fff'; ctx.fillText('SHIELD', e.x, e.y + 22); }
      ctx.restore();
    }
  }

  function drawPixelCorners(x,y,w,h,color){
    ctx.fillStyle = color;
    const s = 6;
    ctx.fillRect(x,y,s,2); ctx.fillRect(x,y,2,s);
    ctx.fillRect(x+w-s,y,s,2); ctx.fillRect(x+w-2,y,2,s);
    ctx.fillRect(x,y+h-2,s,2); ctx.fillRect(x,y+h-s,2,s);
    ctx.fillRect(x+w-s,y+h-2,s,2); ctx.fillRect(x+w-2,y+h-s,2,s);
  }

  function drawBoss(){
    const b = game.boss;
    if(!b) return;
    const x = b.x - b.w/2, y = b.y - b.h/2;
    ctx.save();
    ctx.shadowColor = b.hitFlash > 0 ? '#ff5de1' : '#ff5769'; ctx.shadowBlur = b.hitFlash > 0 ? 28 : 14;
    ctx.fillStyle = b.mini ? '#22152d' : '#2b1020';
    ctx.fillRect(x,y,b.w,b.h);
    ctx.strokeStyle = b.mini ? '#ffd166' : '#ff5769'; ctx.lineWidth = b.mini ? 3 : 4; ctx.strokeRect(x,y,b.w,b.h);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    for(let i=0;i<8;i++) ctx.fillRect(x + i*b.w/8 + 4, y+8, 8, b.h-16);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font='bold 16px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.name, b.x, b.y-4);
    ctx.font='12px monospace'; ctx.fillStyle=colors.muted; ctx.fillText(b.rage ? '발악 패턴' : (b.mini ? 'MINI BOSS' : 'BOSS'), b.x, b.y+18);
    const barW = W - 60;
    const hpRatio = clamp(b.hp/b.maxHp,0,1);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(30,52,barW,12);
    ctx.fillStyle = b.rage ? '#ff5de1' : '#ff5769'; ctx.fillRect(30,52,barW*hpRatio,12);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeRect(30,52,barW,12);
    ctx.restore();
  }

  function drawBullets(){
    for(const b of game.bullets){
      ctx.save();
      ctx.shadowColor = b.enhanced ? '#ffe66d' : (b.crit ? '#ff5de1' : '#5df0ff');
      ctx.shadowBlur = b.enhanced ? 14 : 8;
      ctx.fillStyle = b.enhanced ? '#ffe66d' : (b.crit ? '#ff5de1' : '#bdfbff');
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawMissiles(){
    for(const m of game.missiles){
      for(const t of m.trail){
        ctx.globalAlpha = clamp(t.life / 0.25, 0, 1) * 0.42;
        ctx.fillStyle = m.enhanced ? '#ffe66d' : '#ffd166';
        ctx.beginPath(); ctx.arc(t.x,t.y,m.r*0.7,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(m.x,m.y);
      ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);
      ctx.shadowColor = m.enhanced ? '#ffe66d' : '#ffd166'; ctx.shadowBlur = 12;
      ctx.fillStyle = m.enhanced ? '#ffe66d' : '#ffd166';
      ctx.beginPath(); ctx.moveTo(0,-m.r*1.6); ctx.lineTo(m.r, m.r); ctx.lineTo(-m.r,m.r); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawLasers(){
    for(const l of game.lasers){
      const ex = l.x + Math.cos(l.angle) * 1000;
      const ey = l.y + Math.sin(l.angle) * 1000;
      ctx.save();
      ctx.globalAlpha = clamp(l.duration / 0.25, 0.25, 1);
      ctx.shadowColor = l.enhanced ? '#ffe66d' : '#5df0ff'; ctx.shadowBlur = l.enhanced ? 26 : 16;
      ctx.strokeStyle = l.enhanced ? '#ffe66d' : '#5df0ff'; ctx.lineWidth = l.width;
      ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2,l.width*0.32); ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.restore();
    }
  }


  function drawBossBullets(){
    for(const b of game.bossBullets){
      ctx.save();
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(b.x - b.r*0.25,b.y - b.r*0.25,Math.max(1.5,b.r*0.34),0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function drawPlayer(){
    const p = game.player;
    const run = game.run;
    ctx.save();
    if(run && run.weapons.missile > 0){
      drawCompanion(p.x - 35, p.y + 6);
      drawCompanion(p.x + 35, p.y + 6);
    }
    ctx.translate(p.x,p.y);
    ctx.shadowColor = p.hitFlash > 0 ? '#ff5769' : '#5df0ff'; ctx.shadowBlur = p.hitFlash > 0 ? 24 : 12;
    ctx.fillStyle = p.hitFlash > 0 ? '#ffccd2' : '#bdfbff';
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(15,15); ctx.lineTo(0,8); ctx.lineTo(-15,15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5df0ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffe66d'; ctx.fillRect(-4,0,8,9);
    ctx.restore();
    if(run && run.stats.shield > 0){
      ctx.save();
      ctx.strokeStyle = run.stats.shield > 1 ? '#ffe66d' : '#5df0ff';
      ctx.lineWidth = 2 + run.stats.shield;
      ctx.globalAlpha = 0.55 + Math.sin(performance.now()*0.008)*0.1;
      ctx.beginPath(); ctx.arc(p.x,p.y,24 + run.stats.shield*2,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawCompanion(x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle = '#7f8cff'; ctx.strokeStyle = '#d1d5ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(10,10); ctx.lineTo(0,5); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawParticles(){
    for(const p of game.particles){
      const alpha = clamp(p.life / (p.maxLife || .65), 0, 1);
      ctx.globalAlpha = alpha;
      if(p.text){
        ctx.fillStyle = p.color; ctx.font = 'bold 12px monospace'; ctx.textAlign='center'; ctx.fillText(p.text,p.x,p.y);
      }else{
        ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,p.size,p.size);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD(){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fillRect(0,H-56,W,56);
    ctx.strokeStyle = 'rgba(93,240,255,.22)'; ctx.beginPath(); ctx.moveTo(0,H-56); ctx.lineTo(W,H-56); ctx.stroke();
    ctx.fillStyle = colors.text; ctx.font = '13px monospace'; ctx.textAlign='left';
    if(game.running && game.run){
      const r = game.run;
      ctx.fillText(`STAGE ${stageText(game.stage)}  KU ${format(r.kuEarned)}  KILL ${r.kills}`, 12, H-34);
      ctx.fillText(`SHIELD ${r.stats.shield}/${r.stats.maxShield}  F${r.weapons.front} S${r.weapons.side} M${r.weapons.missile} L${r.weapons.laser}${r.levelBreakthrough?'  BREAK':''}`, 12, H-14);
      ctx.textAlign='right';
      const phase = game.phase ? game.phase.label : '작전 중';
      ctx.fillStyle = colors.muted; ctx.fillText(phase, W-12, H-24);
    }else{
      ctx.fillText(`보유 KU ${format(save.ku)} · 최고 클리어 ${save.highestClearedRank ? stageText(rankToStage(save.highestClearedRank)) : '없음'}`, 12, H-25);
      ctx.textAlign='right'; ctx.fillStyle = colors.muted; ctx.fillText('Space 또는 작전 패널에서 출격', W-12, H-25);
    }
    ctx.restore();
  }

  function drawIdleOverlay(){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(70,170,W-140,210);
    ctx.strokeStyle = 'rgba(93,240,255,.35)'; ctx.strokeRect(70,170,W-140,210);
    ctx.textAlign='center';
    ctx.fillStyle = colors.gold; ctx.font='bold 28px monospace'; ctx.fillText('재능이 없다.', W/2, 226);
    ctx.fillStyle = colors.text; ctx.font='16px monospace'; ctx.fillText('하지만 노재능은 자쿠드를 숭배한다.', W/2, 262);
    ctx.fillStyle = colors.muted; ctx.font='13px monospace';
    ctx.fillText('4칸 타일을 부수고 KU를 모아 성장하십시오.', W/2, 298);
    ctx.fillText(`다음 출격: ${stageText(rankToStage(save.selectedRank))}`, W/2, 330);
    ctx.restore();
  }

  function drawPauseOverlay(){
    ctx.save(); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle=colors.gold; ctx.font='bold 32px monospace'; ctx.fillText('일시정지', W/2, H/2);
    ctx.font='14px monospace'; ctx.fillStyle=colors.muted; ctx.fillText('Esc로 재개', W/2, H/2+28); ctx.restore();
  }

  function renderTabs(){
    el.tabs.innerHTML = tabs.map(([id,label]) => `<button class="tabBtn ${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');
    el.tabs.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderTabs(); renderPanel(true); }));
  }

  function renderPanel(force=false){
    if(!force && !uiDirty && activeTab !== 'status' && activeTab !== 'operation') return;
    uiDirty = false;
    if(activeTab === 'operation') renderOperationPanel();
    else if(activeTab === 'status') renderStatusPanel();
    else if(activeTab === 'upgrade') renderUpgradePanel();
    else if(activeTab === 'artifact') renderArtifactPanel();
    else if(activeTab === 'skill') renderSkillPanel();
    else if(activeTab === 'scripture') renderScripturePanel();
    else if(activeTab === 'record') renderRecordPanel();
    else renderHelpPanel();
  }

  function renderOperationPanel(){
    const selected = rankToStage(save.selectedRank);
    const unlocked = highestUnlockedRank();
    const canNext = save.selectedRank < unlocked;
    el.panelBody.innerHTML = `
      <h3 class="sectionTitle"><span>작전 콘솔</span><span class="pill ${game.running?'warn':'ok'}">${game.running?'출격 중':'대기'}</span></h3>
      <div class="box">
        <div class="mini">현재 출격 스테이지</div>

        <div class="statLine"><span>구성</span><b>${stageSequence(selected).join(' → ').replaceAll('wave','WAVE').replace('miniboss','MINI').replace('boss','BOSS')}</b></div>
        <div class="statLine"><span>최고 클리어</span><b>${save.highestClearedRank ? stageText(rankToStage(save.highestClearedRank)) : '없음'}</b></div>
        <div class="stageControls">
          <button id="prevStage" ${game.running || save.selectedRank<=1?'disabled':''}>이전</button>

        </div>
        <div class="grid2" style="margin-top:8px">
          <button id="pauseBtn" class="pauseBtn" ${!game.running || game.powerupOpen?'disabled':''}>${game.paused?'재개':'일시정지'}</button>
          <button id="safeSave">수동 저장</button>
        </div>
      </div>
      <div class="box">
        <div class="sectionTitle">P0 규칙 상태</div>
        <span class="pill ok">4칸 타일 웨이브</span>
        <span class="pill ok">플레이어 HP 없음</span>
        <span class="pill ok">보호막 없으면 즉사</span>
        <span class="pill ok">하단 통과 피해 없음</span>
        <span class="pill ok">HTML 카드 클릭 파워업</span>
      </div>
      <div class="quote">자쿠드는 보고 있다. 재능에 맞서 싸워라.</div>
    `;
    document.getElementById('prevStage').addEventListener('click', () => { save.selectedRank = clamp(save.selectedRank-1,1,highestUnlockedRank()); saveGame('스테이지 저장됨'); renderPanel(true); });
    document.getElementById('nextStage').addEventListener('click', () => { save.selectedRank = clamp(save.selectedRank+1,1,highestUnlockedRank()); saveGame('스테이지 저장됨'); renderPanel(true); });
    document.getElementById('launch').addEventListener('click', startRun);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('safeSave').addEventListener('click', () => saveGame('수동 저장됨'));
  }

    const r = game.run;
    const highest = save.highestClearedRank ? stageText(rankToStage(save.highestClearedRank)) : '없음';
    let runHtml = '';
    if(r){
      runHtml = `

        <h3 class="sectionTitle"><span>런 상태</span><span class="pill ${game.running?'ok':'warn'}">${game.running?'진행 중':'종료'}</span></h3>
        <div class="statLine"><span>스테이지</span><b>${stageText(r.stage)}</b></div>

        <div class="statLine"><span>보호막</span><b>${r.stats.shield}/${r.stats.maxShield}</b></div>

      </div>

      </div>`;

  function renderUpgradePanel(){
    el.panelBody.innerHTML = `<h3 class="sectionTitle"><span>KU 영구 강화</span><span>KU ${format(save.ku)}</span></h3>` + upgradeDefs.map(def => {
      const lv = save.permanentUpgrades[def.key] || 0;

      </div>`;
