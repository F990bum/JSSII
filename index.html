<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>J. S. S. II — 재능 격파 시뮬레이터</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#0a1020" />
  <style>
    :root{
      --bg:#070b16;
      --panel:#0d1425;
      --panel2:#111b32;
      --line:#26385e;
      --text:#e6f1ff;
      --muted:#8ba4c8;
      --accent:#5df0ff;
      --accent2:#ff5de1;
      --danger:#ff5769;
      --ok:#70ff9a;
      --warn:#ffd166;
      --gold:#ffe66d;
      --dark:#050812;
      --card:#141f38;
      --shadow:rgba(0,0,0,.35);
      --logo-url:url("logo.png");
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at 18% 10%, rgba(93,240,255,.12), transparent 28%),
        radial-gradient(circle at 88% 16%, rgba(255,93,225,.10), transparent 26%),
        linear-gradient(180deg, #060912 0%, #090d19 48%, #050710 100%);
      color:var(--text);
      font-family: "Pretendard", "SUIT", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      overflow:hidden;
    }
    button, input, select{font:inherit}
    button{
      min-height:34px;
      border:1px solid rgba(93,240,255,.35);
      background:linear-gradient(180deg, #172542, #0c1528);
      color:var(--text);
      border-radius:12px;
      padding:9px 12px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      transition:transform .08s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
    }
    button:hover{border-color:rgba(93,240,255,.9); transform:translateY(-1px)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.45; cursor:not-allowed; transform:none}
    .app{
      display:grid;
      grid-template-rows:auto 1fr auto;
      height:100vh;
      gap:10px;
      padding:10px;
    }
    header{
      min-height:78px;
      border:1px solid rgba(93,240,255,.22);
      background:linear-gradient(90deg, rgba(13,20,37,.96), rgba(10,15,29,.92));
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
    }
    .brand{
      display:grid;
      grid-template-columns:60px 1fr;
      gap:13px;
      align-items:center;
    }
    .logo{
      width:60px;height:60px;
      border:2px solid rgba(255,255,255,.72);
      border-radius:16px;
      background-image:var(--logo-url);
      background-size:cover;
      background-position:center;
      box-shadow:0 0 20px rgba(93,240,255,.28), 0 0 34px rgba(255,93,225,.14), inset 0 0 0 1px rgba(0,0,0,.3);
      image-rendering:auto;
      overflow:hidden;
      flex:0 0 auto;
    }
    .titleBlock h1{margin:0;font-size:30px;letter-spacing:2.4px;line-height:1.02;font-weight:900}
    .titleBlock p{margin:4px 0 0;color:var(--muted);font-size:14px;letter-spacing:.5px;font-weight:700}
    .saveState{font-size:12px;color:var(--muted);text-align:right;line-height:1.55}
    .saveState strong{color:var(--accent);font-weight:700}
    .main{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(420px, 1fr) 440px;
      gap:10px;
    }
    .gamePanel,.console{
      min-height:0;
      border:1px solid rgba(93,240,255,.22);
      background:rgba(13,20,37,.9);
      box-shadow:0 18px 42px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .gamePanel{
      display:grid;
      grid-template-rows:1fr;
      position:relative;
    }
    .canvasWrap{
      position:relative;
      display:grid;
      place-items:center;
      padding:10px;
      min-height:0;
    }
    canvas{
      max-width:100%;
      max-height:100%;
      aspect-ratio:640/820;
      background:#050814;
      border:1px solid rgba(93,240,255,.25);
      image-rendering:pixelated;
      cursor:crosshair;
      touch-action:none;
    }
    .powerupModal{
      position:absolute;
      inset:10px;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(3,6,13,.62);
      backdrop-filter: blur(3px);
      z-index:20;
      border:1px solid rgba(255,230,109,.18);
    }
    .powerupModal.show{display:flex}
    .powerupPanel{
      width:min(96%, 920px);
      border:1px solid rgba(255,230,109,.55);
      background:linear-gradient(180deg, rgba(14,20,35,.98), rgba(10,12,22,.98));
      box-shadow:0 0 34px rgba(255,230,109,.20), 0 20px 60px rgba(0,0,0,.45);
      padding:18px;
    }
    .powerupPanel h2{margin:0 0 4px;font-size:22px;color:var(--gold)}
    .powerupPanel .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
    .cards{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    .powerCard{
      min-height:190px;
      padding:15px;
      text-align:left;
      background:
        linear-gradient(180deg, rgba(26,41,73,.98), rgba(13,22,41,.98));
      border-color:rgba(93,240,255,.35);
      border-radius:14px;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:8px;
    }
    .powerCard:hover{border-color:var(--gold); box-shadow:0 0 22px rgba(255,230,109,.22)}
    .powerIcon{font-size:30px;line-height:1}
    .powerTitle{font-size:18px;color:#fff;font-weight:800}
    .powerDesc{font-size:13px;color:var(--muted);line-height:1.5;white-space:pre-line}
    .powerMeta{font-size:12px;color:var(--accent)}
    .console{
      display:grid;
      grid-template-rows:auto 1fr;
    }
    .tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      padding:8px;
      background:rgba(5,8,18,.55);
      border-bottom:1px solid rgba(93,240,255,.18);
    }
    .tabBtn{
      padding:7px 4px;
      font-size:12px;
      border-radius:8px;
      color:var(--muted);
      background:#0a1223;
      border-color:rgba(139,164,200,.18);
      box-shadow:none;
    }
    .tabBtn.active{color:#06101a;background:linear-gradient(180deg,var(--accent),#55b8ff);border-color:transparent;font-weight:800}
    .panelBody{
      overflow:auto;
      padding:12px;
      min-height:0;
    }
    .sectionTitle{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      margin:0 0 10px;
      color:var(--accent);
      font-size:15px;
      letter-spacing:.3px;
    }
    .box{
      border:1px solid rgba(93,240,255,.16);
      background:rgba(7,12,24,.68);
      padding:10px;
      border-radius:12px;
      margin:0 0 10px;
    }
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .statLine{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;margin:7px 0;color:var(--muted)}
    .statLine b{color:var(--text)}
    .bigNumber{font-size:28px;color:var(--gold);font-weight:900;text-shadow:0 0 12px rgba(255,230,109,.25)}
    .mini{font-size:12px;color:var(--muted);line-height:1.55}
    .quote{font-size:13px;line-height:1.65;color:#d8e8ff;background:rgba(255,255,255,.03);border-left:3px solid var(--accent);padding:9px 10px;margin:8px 0}
    .upgradeRow,.artifactRow{
      display:grid;
      grid-template-columns:1fr auto;
      gap:9px;
      align-items:center;
      border:1px solid rgba(139,164,200,.13);
      background:rgba(18,29,52,.5);
      border-radius:11px;
      padding:9px;
      margin:8px 0;
    }
    .upgradeRow h4,.artifactRow h4{margin:0 0 4px;font-size:13px;color:#fff}
    .upgradeRow p,.artifactRow p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .pill{
      display:inline-block;
      border:1px solid rgba(93,240,255,.24);
      color:var(--muted);
      border-radius:999px;
      padding:3px 7px;
      font-size:11px;
      margin:2px 3px 2px 0;
      background:rgba(93,240,255,.05);
    }
    .pill.ok{color:var(--ok);border-color:rgba(112,255,154,.4)}
    .pill.warn{color:var(--warn);border-color:rgba(255,209,102,.45)}
    .pill.danger{color:var(--danger);border-color:rgba(255,87,105,.45)}
    .dangerBtn{border-color:rgba(255,87,105,.45);color:#ffd9de;background:linear-gradient(180deg,#371727,#1a0a11)}
    .goodBtn{border-color:rgba(112,255,154,.45);color:#ddffe7;background:linear-gradient(180deg,#17372c,#0b1a13)}
    .stageControls{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:10px}
    .launchBtn{font-size:16px;font-weight:900;padding:12px;background:linear-gradient(180deg,#2be8ff,#1883ff);color:#04101b;border:0}
    .pauseBtn{background:linear-gradient(180deg,#272e4f,#11172b)}
    .skillTreeWrap{
      position:relative;
      height:520px;
      border:1px solid rgba(93,240,255,.16);
      border-radius:14px;
      background:
        radial-gradient(circle at 50% 17%, rgba(93,240,255,.10), transparent 20%),
        radial-gradient(circle at 50% 68%, rgba(255,230,109,.08), transparent 24%),
        rgba(5,8,18,.70);
      overflow:hidden;
    }
    .skillTreeWrap svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .skillNode{
      position:absolute;
      transform:translate(-50%,-50%);
      width:92px;
      min-height:52px;
      border-radius:15px;
      border:1px solid rgba(139,164,200,.25);
      background:#0b1325;
      color:var(--muted);
      display:grid;
      place-items:center;
      text-align:center;
      font-size:11px;
      line-height:1.25;
      padding:6px;
      z-index:1;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }
    .skillNode.unlocked{border-color:rgba(112,255,154,.75);color:#07120b;background:linear-gradient(180deg,#8fffb1,#42e77a);font-weight:900}
    .skillNode.available{border-color:rgba(255,230,109,.85);color:#fff;box-shadow:0 0 18px rgba(255,230,109,.26)}
    .skillNode.locked:after{content:"🔒";position:absolute;right:5px;top:4px;font-size:11px;opacity:.85}
    .skillNode.core{width:112px;min-height:60px;border-radius:18px;font-size:12px}
    .skillNode.break{width:120px;min-height:64px;border-color:rgba(255,93,225,.55)}
    .bottomBar{
      min-height:42px;
      border:1px solid rgba(93,240,255,.22);
      background:rgba(13,20,37,.92);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:8px 12px;
      color:var(--muted);
      font-size:13px;
      box-shadow:0 -10px 32px rgba(0,0,0,.18);
    }
    .message{color:#d9e9ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kbd{border:1px solid rgba(139,164,200,.35);background:#071124;color:#dfefff;border-radius:6px;padding:1px 6px;font-size:12px}
    .endingModal{
      position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.72);z-index:40;
    }
    .endingModal.show{display:grid}
    .endingCard{
      width:min(92vw, 700px);
      border:1px solid rgba(255,230,109,.55);
      background:linear-gradient(180deg,#111b32,#050814);
      box-shadow:0 0 70px rgba(255,230,109,.18);
      padding:28px;
      text-align:center;
    }
    .endingCard h2{margin:0 0 10px;color:var(--gold);font-size:30px}
    .endingCard p{color:#dbeaff;line-height:1.8;white-space:pre-line}

    .resourcePair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
    .resourceBox{border:1px solid rgba(93,240,255,.16);background:rgba(255,255,255,.035);border-radius:12px;padding:9px}
    .resourceBox .label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.3px}
    .resourceBox .value{font-size:20px;color:var(--gold);font-weight:900;line-height:1.25}
    .bar{height:9px;border:1px solid rgba(139,164,200,.25);background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden}
    .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(93,240,255,.35)}
    .grade{font-weight:900}
    .grade-common{color:#f3f6ff;border-color:rgba(255,255,255,.45)}
    .grade-uncommon{color:#70ff9a;border-color:rgba(112,255,154,.55)}
    .grade-rare{color:#62a8ff;border-color:rgba(98,168,255,.6)}
    .grade-hero{color:#62a8ff;border-color:rgba(98,168,255,.6)}
    .grade-epic{color:#c184ff;border-color:rgba(193,132,255,.62)}
    .grade-legend{color:#ffe66d;border-color:rgba(255,230,109,.7)}
    .grade-jakud{color:#ff5769;border-color:rgba(255,87,105,.72);text-shadow:0 0 10px rgba(255,87,105,.45)}
    .artifactRow.grade-common,.partRow.grade-common{border-color:rgba(255,255,255,.22)}
    .artifactRow.grade-uncommon,.partRow.grade-uncommon{border-color:rgba(112,255,154,.24)}
    .artifactRow.grade-rare,.partRow.grade-rare{border-color:rgba(98,168,255,.28)}
    .artifactRow.grade-hero,.partRow.grade-hero{border-color:rgba(98,168,255,.28)}
    .artifactRow.grade-epic,.partRow.grade-epic{border-color:rgba(193,132,255,.32)}
    .artifactRow.grade-legend,.partRow.grade-legend{border-color:rgba(255,230,109,.38)}
    .artifactRow.grade-jakud,.partRow.grade-jakud{border-color:rgba(255,87,105,.44);box-shadow:0 0 18px rgba(255,87,105,.08)}
    .gachaButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .partRow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border:1px solid rgba(139,164,200,.13);background:rgba(18,29,52,.5);border-radius:11px;padding:9px;margin:7px 0}
    .partRow h4{margin:0 0 4px;font-size:13px;color:#fff}.partRow p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .resultList{max-height:220px;overflow:auto;border:1px solid rgba(93,240,255,.13);background:rgba(0,0,0,.24);border-radius:12px;padding:8px;margin-top:8px}
    .enemyCard{border:1px solid rgba(139,164,200,.16);background:rgba(7,12,24,.65);border-radius:12px;padding:10px;margin:8px 0}
    .enemyCard h4{margin:0 0 6px;font-size:14px}.enemyCard p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
    .powerupPanel{max-height:calc(100% - 16px);overflow:auto}
    .powerupPanel h2{display:flex;align-items:center;gap:8px}
    .powerCard{min-height:132px;gap:6px}
    .powerIcon{font-size:34px}.powerTitle{font-size:16px}.powerDesc{font-size:12px;line-height:1.35}.powerMeta{font-size:11px}
    .skillNode{width:128px;min-height:84px;align-content:start;place-items:stretch;font-size:10px;line-height:1.22;padding:7px;gap:3px;overflow:hidden}
    .skillNode .nodeName{font-size:11px;font-weight:900;color:inherit;white-space:pre-line}.skillNode .nodeDesc{font-size:9.5px;color:inherit;opacity:.88}.skillNode .nodeCost{font-size:9.5px;color:var(--gold);margin-top:2px}
    .skillNode.core{width:140px;min-height:88px}.skillNode.break{width:148px;min-height:92px}
    .skillTreeWrap{height:820px;overflow:auto}
    .tabs{grid-template-columns:repeat(5,1fr)}
    .tabBtn{min-height:34px;white-space:normal;line-height:1.15;word-break:keep-all}

    @media (max-width: 980px){
      body{overflow:auto}
      .app{height:auto;min-height:100vh}
      .main{grid-template-columns:1fr}
      .console{min-height:560px}
      .tabs{grid-template-columns:repeat(4,1fr)}
      .bottomBar{position:sticky;bottom:0;z-index:25}
    }
    @media (max-width: 640px){
      .app{padding:6px;gap:6px}
      header{padding:8px}
      .brand{grid-template-columns:44px 1fr;gap:9px}
      .logo{width:46px;height:46px;border-radius:13px}
      .titleBlock h1{font-size:22px}.titleBlock p{font-size:12px}
      .saveState{display:none}
      .cards{grid-template-columns:1fr}
      .powerupPanel{padding:12px}
      .powerupPanel h2{font-size:18px}
      .powerCard{min-height:104px;padding:12px;grid-template-columns:42px 1fr;grid-template-rows:auto auto auto}
      .powerIcon{grid-row:1/4;font-size:30px}.powerTitle{font-size:15px}.powerDesc{font-size:12px}.powerMeta{font-size:10px}
      .tabs{grid-template-columns:repeat(3,1fr)}
      .stageControls{grid-template-columns:1fr}
    }


    /* compatibility UI/balance overrides */
    :root{--font-ui:"Pretendard", "SUIT", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
    body,button,input,select{font-family:var(--font-ui)}
    .main{grid-template-columns:minmax(460px, 1fr) 500px}
    .tabs{grid-template-columns:repeat(4,1fr)}
    .tabBtn{font-size:12px;min-height:38px;padding:8px 5px}
    .resourceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
    .resourceBox .value{font-size:19px;letter-spacing:-.2px}
    .modeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}
    .modeBtn.active{background:linear-gradient(180deg,var(--gold),#ff9f5d);color:#0b101b;border-color:transparent;font-weight:900}
    .liveStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
    .liveStats .resourceBox{background:linear-gradient(180deg,rgba(93,240,255,.08),rgba(255,255,255,.03));border-color:rgba(93,240,255,.24)}
    .resultList.fx{border-color:rgba(255,230,109,.5);box-shadow:0 0 24px rgba(255,230,109,.18), inset 0 0 18px rgba(255,93,225,.08)}
    .equipmentSlots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
    .equipSlot{border:1px solid rgba(93,240,255,.24);background:rgba(7,12,24,.76);border-radius:14px;padding:11px;min-height:118px;display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
    .equipSlot.empty{opacity:.75;border-style:dashed}
    .partShape{width:56px;height:56px;display:grid;place-items:center;font-weight:1000;color:#050814;background:linear-gradient(180deg,#5df0ff,#7f8cff);box-shadow:0 0 18px rgba(93,240,255,.25);font-size:18px}
    .shape-A{clip-path:polygon(50% 4%,96% 94%,4% 94%)}
    .shape-B{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
    .shape-C{border-radius:50%}
    .shape-D{border-radius:11px;clip-path:polygon(10% 10%,90% 10%,90% 90%,10% 90%)}
    .partRow{grid-template-columns:62px 1fr auto;min-height:84px}
    .partRow .partShape{width:48px;height:48px;font-size:15px}
    .skillTreeWrap{height:1600px;overflow:hidden}
    .skillNode{width:116px;min-height:66px;font-size:9px;line-height:1.18;padding:6px;border-radius:13px;align-content:start;place-items:stretch;gap:2px}
    .skillNode .nodeName{font-size:10px}.skillNode .nodeDesc{font-size:8.7px}.skillNode .nodeCost{font-size:8.8px}
    .skillNode.core{width:128px;min-height:74px}.skillNode.break{width:138px;min-height:78px}
    @media (max-width: 1180px){.main{grid-template-columns:minmax(420px, 1fr) 440px}}

    /* v0.8 responsive console */
    @media (max-width: 900px){
      body{overflow:auto;}
      .app{min-height:100vh;height:auto;padding:6px;grid-template-rows:auto auto auto;}
      header{min-height:64px;padding:8px 10px;}
      .brand{grid-template-columns:48px 1fr;gap:10px}.logo{width:48px;height:48px}.titleBlock h1{font-size:22px}.titleBlock p{font-size:13px}
      .main{grid-template-columns:1fr;grid-template-rows:minmax(480px, calc(100vh - 210px)) auto;}
      .console{max-height:48vh;min-height:330px;}
      .panelBody{padding:10px;}
      .cards{grid-template-columns:1fr;}.powerCard{min-height:86px;}
      .tabs{grid-template-columns:repeat(4,1fr)}
      .skillTreeWrap{height:auto;overflow:visible;display:grid;gap:8px}.skillTreeWrap svg{display:none}.skillNode{position:static!important;width:100%!important;min-height:72px;}
    }

    /* v0.8 final layout fixes */
    .main{grid-template-columns:minmax(420px, 1fr) 440px}
    .console{min-width:0}
    .skillTreeWrap{height:1680px;overflow:auto}
    .skillNode{width:128px;min-height:78px;font-size:12px;line-height:1.22;padding:7px;gap:3px}
    .skillNode .nodeName{font-size:13px}
    .skillNode .nodeDesc{font-size:11px;line-height:1.22}
    .skillNode .nodeCost{font-size:11px}
    .skillNode.core{width:140px;min-height:84px}
    .skillNode.break{width:148px;min-height:88px}
    @media (max-width: 1180px){.main{grid-template-columns:minmax(420px, 1fr) 440px}}

  function loadSave(){
    try{
      let raw = localStorage.getItem(SAVE_KEY);
      if(!raw){
        for(const key of OLD_SAVE_KEYS){
          raw = localStorage.getItem(key);
          if(raw) break;
        }
      }
      if(!raw) return defaultSave();
      const data = JSON.parse(raw);
      const base = defaultSave();
      const merged = deepMerge(base, data);
      merged.version = VERSION;
      if(!Number.isFinite(merged.selectedRank) || merged.selectedRank < 1) merged.selectedRank = Math.max(1, merged.highestClearedRank + 1);
      return merged;
    }catch(err){
      console.warn(err);
      return defaultSave();
    }
  }

  function deepMerge(base, data){
    const out = Array.isArray(base) ? [...base] : {...base};
    for(const k in data){
      if(data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && base[k]) out[k] = deepMerge(base[k], data[k]);
      else out[k] = data[k];
    }
    return out;
  }

  function stageRank(ch, lv){ return (ch - 1) * 5 + lv; }
  function rankToStage(rank){
    const r = clamp(Math.round(rank), 1, 30);
    return { chapter: Math.floor((r - 1) / 5) + 1, level: ((r - 1) % 5) + 1, rank:r, mode:'story' };
  }
  function infiniteStage(depth){
    const d = Math.max(1, Math.round(depth || 1));
    const anchorRank = clamp(Math.max(1, (save.highestClearedRank || 1) - 3), 1, 30);
    const storyLike = rankToStage(anchorRank);
    return { chapter:storyLike.chapter, level:storyLike.level, rank:anchorRank, depth:d, mode:'infinite' };
  }
  function stageText(stage){ return stage && stage.mode === 'infinite' ? `∞-${stage.depth || 1}` : `${stage.chapter}-${stage.level}`; }
  function nextRank(rank){ return clamp(rank + 1, 1, 30); }
  function highestUnlockedRank(){ return clamp((save.highestClearedRank || 0) + 1, 1, 30); }
  function skillTreeUnlocked(){ return highestUnlockedRank() >= stageRank(2,1); }
  function artifactUnlocked(){ return highestUnlockedRank() >= stageRank(3,1); }
  function infiniteUnlocked(){ return (save.highestClearedRank || 0) >= stageRank(3,5); }
  function gachaTalentUnlocked(){ return highestUnlockedRank() >= stageRank(1,3); }
  function gachaSuperUnlocked(){ return highestUnlockedRank() >= stageRank(4,1); }
  function bombUnlocked(){ return highestUnlockedRank() >= stageRank(5,1); }
  function roundNice(n){
    n = Math.max(0, Number(n) || 0);
    if(n < 100) return Math.max(1, Math.round(n));
    const exp = Math.floor(Math.log10(n));
    const step = Math.pow(10, Math.max(0, exp - 2));
    return Math.round(n / step) * step;
  }
  function storyBaseHp(rankOrStage){
    const rank = typeof rankOrStage === 'number' ? rankOrStage : (rankOrStage ? rankOrStage.rank : 1);
    const r = clamp(rank, 1, 30);
    return 20 * Math.pow(1.84, r - 1);
  }
  function stageBaseNormalHp(stage){
    if(!stage) return 20;
    if(stage.mode === 'infinite'){
      const anchor = clamp(Math.max(1, (save.highestClearedRank || 1) - 3), 1, 30);
      return storyBaseHp(anchor) * Math.pow(1.16, Math.max(0, (stage.depth || 1) - 1));
    }
    return storyBaseHp(stage.rank || 1);
  }
  function stageEconomyScale(stageOrRank){
    const base = typeof stageOrRank === 'number' ? storyBaseHp(stageOrRank) : stageBaseNormalHp(stageOrRank);
    return Math.pow(Math.max(1, base / 20), 0.72);
  }
  function enemyHpScale(stage){ return stageBaseNormalHp(stage) / 20; }
  function enemyKuReward(enemyHp, multiplier=1){ return roundNice(0.9 * Math.pow(Math.max(1, enemyHp), 0.72) * multiplier); }
  function bossKuReward(bossHp, multiplier=1){ return roundNice(12 * Math.pow(Math.max(1, bossHp), 0.70) * multiplier); }
  function clearJaReward(stage){
    let ja;
    if(stage.mode === 'infinite'){
      const wave = Math.max(10, (stage.depth || 1) * 10);
      ja = 20 + wave;
      if(wave >= 50) ja *= 1.5;
    }else{
      ja = 8 + (stage.rank || 1) * 3;
      if(stage.level === 5) ja += 20;
      if((stage.rank || 1) === stageRank(6,5)) ja += 50;
    }
    if(save.skillTree.jaSense) ja *= 1.15;
    if(isEquipped('dopamine_meter')) ja *= 1.20;
    if(isEquipped('ja_contract')) ja *= 1.35;
    if(isEquipped('jakud_fragment')) ja *= 1.50;
    return Math.max(1, Math.floor(ja));
  }
  function bossDsReward(b){
    if(!b) return 0;
    if(game.stage && game.stage.mode === 'infinite'){
      const wave = Math.max(1, (game.stage.depth || 1) * 10);
      let ds = b.mini ? (1 + Math.floor(wave / 20)) : (3 + Math.floor(wave / 10));
      if(!b.mini && wave >= 50) ds += 5;
      return Math.max(1, Math.floor(ds));
    }
    const ch = Math.min(6, b.chapter || 1);
    let ds = b.mini ? ch : (game.stage && game.stage.level === 5 ? ch * 7 : ch * 3);
    if(!b.mini && game.stage && game.stage.rank === stageRank(6,5)) ds += 50;
    if(save.skillTree.bitikExecution) ds *= 1.15;
    return Math.max(1, Math.floor(ds));
  }

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function format(n){
    const v = Number(n) || 0;
    const sign = v < 0 ? '-' : '';
    const a = Math.abs(v);
    if(a >= 1e12) return sign + (a/1e12).toFixed(a >= 1e13 ? 1 : 2) + 'T';
    if(a >= 1e9) return sign + (a/1e9).toFixed(a >= 1e10 ? 1 : 2) + 'B';
    if(a >= 1e6) return sign + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
    if(a >= 1e3) return sign + (a/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
    return sign + Math.floor(a).toLocaleString('ko-KR');
  }
  function costFormula(base, level){ return roundNice(base * Math.pow(level + 1, 2.1) * Math.pow(1.78, level)); }
  function gradeInfo(nameOrKey){
    return gradeByName[nameOrKey] || gradeByKey[nameOrKey] || gradeDefs[0];

  function gradeClass(nameOrKey){ return gradeInfo(nameOrKey).className; }

  }

  function partKey(kind,type,grade){ return `${kind}:${type}:${grade}`; }
  function parsePartKey(key){
    const [kind,type,grade] = String(key).split(':');

  }
  function partName(kind,type,grade){
    const k = partKinds[kind] || kind;

  function addPart(kind,type,grade,count=1){

  function getEquippedParts(){

  function partShapeHtml(type){

  function equipPart(key){
    const p = parsePartKey(key);
    if(!partKinds[p.kind] || !partTypes[p.type] || !gradeByKey[p.grade] || (save.parts[key] || 0) <= 0){ setMessage('장착할 수 없는 파츠입니다.', 'warn'); return; }
    if(!save.equipment) save.equipment = {jet:null, bullet:null};

  function partEffectMultiplier(){
    let m = 1;
    if(save.skillTree.partAffinity) m += 0.10;
    m += (save.permanentUpgrades.equipmentMastery || 0) * 0.05;
    if(isEquipped('ja_contract')) m += 0.10;
