    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at 18% 10%, rgba(93,240,255,.12), transparent 28%),
        radial-gradient(circle at 88% 16%, rgba(255,93,225,.10), transparent 26%),
        linear-gradient(180deg, #060912 0%, #090d19 48%, #050710 100%);
      color:var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow:hidden;
    }
    button, input, select{font:inherit}
    button{
      border:1px solid rgba(93,240,255,.35);
      background:linear-gradient(180deg, #172542, #0c1528);
      color:var(--text);
      border-radius:12px;
      padding:9px 12px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      transition:transform .08s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
    }
    button:hover{border-color:rgba(93,240,255,.9); transform:translateY(-1px)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.45; cursor:not-allowed; transform:none}
    .app{
      display:grid;
      grid-template-rows:auto 1fr auto;
      height:100vh;
      gap:10px;
      padding:10px;
    }
    header{
      min-height:78px;
      border:1px solid rgba(93,240,255,.22);
      background:linear-gradient(90deg, rgba(13,20,37,.96), rgba(10,15,29,.92));
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
    }
    .brand{
      display:grid;
      grid-template-columns:60px 1fr;
      gap:13px;
      align-items:center;
    }
    .logo{
      width:60px;height:60px;
      border:2px solid rgba(255,255,255,.72);
      border-radius:16px;
      background-image:var(--logo-url);
      background-size:cover;
      background-position:center;
      box-shadow:0 0 20px rgba(93,240,255,.28), 0 0 34px rgba(255,93,225,.14), inset 0 0 0 1px rgba(0,0,0,.3);
      image-rendering:auto;
      overflow:hidden;
      flex:0 0 auto;
    }
    .titleBlock h1{margin:0;font-size:30px;letter-spacing:2.4px;line-height:1.02;font-weight:900}
    .titleBlock p{margin:4px 0 0;color:var(--muted);font-size:14px;letter-spacing:.5px;font-weight:700}
    .saveState{font-size:12px;color:var(--muted);text-align:right;line-height:1.55}
    .saveState strong{color:var(--accent);font-weight:700}
    .main{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(420px, 1fr) 430px;
      gap:10px;
    }
    .gamePanel,.console{
      min-height:0;
      border:1px solid rgba(93,240,255,.22);
      background:rgba(13,20,37,.9);
      box-shadow:0 18px 42px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .gamePanel{
      display:grid;
      grid-template-rows:1fr;
      position:relative;
    }
    .canvasWrap{
      position:relative;
      display:grid;
      place-items:center;
      padding:10px;
      min-height:0;
    }
    canvas{
      max-width:100%;
      max-height:100%;
      aspect-ratio:640/820;
      background:#050814;
      border:1px solid rgba(93,240,255,.25);
      image-rendering:pixelated;
      cursor:crosshair;
      touch-action:none;
    }
    .powerupModal{
      position:absolute;
      inset:10px;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(3,6,13,.62);
      backdrop-filter: blur(3px);
      z-index:20;
      border:1px solid rgba(255,230,109,.18);
    }
    .powerupModal.show{display:flex}
    .powerupPanel{
      width:min(96%, 920px);
      border:1px solid rgba(255,230,109,.55);
      background:linear-gradient(180deg, rgba(14,20,35,.98), rgba(10,12,22,.98));
      box-shadow:0 0 34px rgba(255,230,109,.20), 0 20px 60px rgba(0,0,0,.45);
      padding:18px;
    }
    .powerupPanel h2{margin:0 0 4px;font-size:22px;color:var(--gold)}
    .powerupPanel .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
    .cards{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    .powerCard{
      min-height:190px;
      padding:15px;
      text-align:left;
      background:
        linear-gradient(180deg, rgba(26,41,73,.98), rgba(13,22,41,.98));
      border-color:rgba(93,240,255,.35);
      border-radius:14px;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:8px;
    }

  function loadSave(){
    try{
      let raw = localStorage.getItem(SAVE_KEY);
      if(!raw){
        for(const key of OLD_SAVE_KEYS){
          raw = localStorage.getItem(key);
          if(raw) break;
        }
      }
      if(!raw) return defaultSave();
      const data = JSON.parse(raw);
      const base = defaultSave();
      const merged = deepMerge(base, data);
      merged.version = VERSION;
      if(!Number.isFinite(merged.selectedRank) || merged.selectedRank < 1) merged.selectedRank = Math.max(1, merged.highestClearedRank + 1);
      return merged;
    }catch(err){
      console.warn(err);
      return defaultSave();
    }
  }

  function deepMerge(base, data){
    const out = Array.isArray(base) ? [...base] : {...base};
    for(const k in data){
      if(data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && base[k]) out[k] = deepMerge(base[k], data[k]);
      else out[k] = data[k];
    }
    return out;
  }

    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
      el.saveStatus.textContent = label;

    }catch(err){
      el.saveStatus.textContent = '저장 실패';
      el.saveStatus.style.color = colors.danger;
      console.error(err);
    }
  }
